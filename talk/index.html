<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rocket Rides — the talk</title>
    <!-- A presentation, not part of the game: no manifest, no icons, no service worker, and left
         out of the iOS build by tools/ios-sync.mjs. See docs/talk.md. -->
    <meta name="robots" content="noindex" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; overflow: hidden;
        background: #ffffff; color: #121a22;
        font-family: -apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', sans-serif;
        user-select: none; -webkit-user-select: none;
      }

      /* The live demo's phone: always its playing size — full height, in the middle of the window
         — and shrunk into the slide's slot by a transform (--dock, set by talk.js), so the game
         inside lays out for a phone and never resizes. Going live eases the transform away. */
      #device {
        position: fixed; left: 50%; top: 50%; z-index: 3;
        height: 92vh; aspect-ratio: 9 / 19.5;
        translate: -50% -50%;
        transform: var(--dock);
        border-radius: 13% / 6%;
        border: 1.3vh solid #05080b;
        box-shadow: 0 0 0 0.3vh #3a4652, 0 3vh 8vh rgba(0, 0, 0, 0.22);
        background: #05080b; overflow: hidden; cursor: pointer;
        transition: transform var(--reveal-ms) cubic-bezier(0.65, 0, 0.35, 1), opacity 0.4s ease;
      }
      body:not(.on-phone) #device { visibility: hidden; opacity: 0; }
      body.live #device { transform: none; cursor: auto; box-shadow: 0 0 0 0.3vh #3a4652, 0 4vh 12vh rgba(0, 0, 0, 0.6); }
      /* The screen. Not clickable until it's live, so a tap on the docked phone opens it. */
      #game {
        display: block; width: 100%; height: 100%; border: 0; border-radius: 10% / 4.6%;
        opacity: 0; transition: opacity 0.5s ease; pointer-events: none;
      }
      #game.ready { opacity: 1; }
      body.live #game { pointer-events: auto; }
      /* Round the live phone, the city carries on past its edges, dimmed: #surround is a second copy
         of the same city, held still, with its camera locked to the phone's (talk.js), under a dark
         wash. (A blurred copy of the phone's own screen stretched out round it, like a video's ambient
         mode, came first and was disorienting: a city out of focus, at the wrong scale, moving.) */
      #scrim {
        position: fixed; inset: 0; z-index: 2; pointer-events: none; background: #0a0e14;
        opacity: 0; visibility: hidden; transition: opacity 0.6s ease, visibility 0s 0.6s;
      }
      /* The wash's opacity and the city's blur, picked by eye with temporary sliders (2026-10-27). */
      :root { --surround-dim: 0.69; --surround-blur: 2.5px; }
      #scrim::after { content: ''; position: absolute; inset: 0; background: rgb(10, 14, 20); opacity: var(--surround-dim); }
      #surround { display: block; width: 100%; height: 100%; border: 0; pointer-events: none; filter: blur(var(--surround-blur)); }
      body.live #scrim { opacity: 1; visibility: visible; transition: opacity 0.6s ease; }

      /* The deck: one slide on at a time. Hidden by visibility rather than display, so the phone
         slide keeps its layout box — talk.js measures the phone off it before it is ever shown. */
      .slide {
        position: fixed; inset: 0; padding: 0 7vw;
        visibility: hidden; opacity: 0; transition: opacity 0.3s ease, visibility 0s 0.3s;
      }
      .slide.on { visibility: visible; opacity: 1; transition: opacity 0.3s ease; }
      /* Titles: the deck's Figma type style (Inter 450, 149% leading, -0.01em, #1A1A1A), at slide
         sizes rather than the frame's 32px. Body text stays on the system font. */
      .slide h1, .slide h2 {
        font-family: 'Inter Variable', -apple-system, system-ui, sans-serif;
        font-weight: 450; font-style: normal; font-variation-settings: 'slnt' 0;
        line-height: 1.49; letter-spacing: -0.01em; color: #1A1A1A;
      }
      /* Tighter than the Figma 149%: that leading is for one line, and a two-line h1 fell apart. */
      .slide h1 { font-size: 72px; font-weight: 600; line-height: 1.05; }
      .slide h2 { font-size: clamp(28px, 4vw, 68px); }
      /* Subtitles: the Figma subtitle style (Inter 450, 140% leading, -0.01em, #A1A1A1). */
      .slide p {
        margin-top: 1vh; font-size: clamp(18px, 2.2vw, 36px);
        font-family: 'Inter Variable', -apple-system, system-ui, sans-serif;
        font-weight: 450; font-variation-settings: 'slnt' 0;
        line-height: 1.4; letter-spacing: -0.01em; color: #A1A1A1;
      }
      .center { display: grid; place-content: center; text-align: center; }
      /* The title slide: words on the left over the game's own title screen (live city, no riders),
         full-bleed — sky behind the words, the island on the right, shifted there by the camera
         (talk.js, BG_SHIFT) rather than by moving the frame. */
      /* The title centred down the slide; the event pinned to the top edge and the handle to the
         bottom, both out of the flow so they don't pull it off centre. */
      .title {
        display: grid; align-content: center; justify-items: start; overflow: hidden;
      }
      /* Over the title: the event, after Stripe's parallelogram (stripe.com's footer logo, as served). Under it: the handle. */
      /* Both at 80% so the title carries the slide. As a colour alpha, not `opacity`: `.in-scene`
         sets opacity to hide the HTML, and the painter (scenetext.js) reads the colour. */
      /* The same pair on every slide: the title's own (painted into its game, so the rain bends
         them) and #chrome's, a fixed copy over every other slide, at the same place and size. */
      p.kicker, p.handle {
        position: absolute; left: 7vw; display: flex; align-items: center; gap: 12px; margin: 0;
        font-size: clamp(16px, 1.6vw, 26px); font-weight: 600; letter-spacing: 0; color: rgba(26, 26, 26, 0.8);
      }
      /* Capitals set smaller and tracked out, so the line weighs about what the mixed case did. The
         handle wears the same. */
      p.kicker, p.handle {
        font-size: clamp(12px, 1.15vw, 19px); letter-spacing: 0.08em; text-transform: uppercase;
      }
      p.kicker { top: 6vh; }
      /* The parallelogram stands exactly a capital tall: Inter's cap height is 0.727 em. */
      p.kicker img { height: 0.727em; width: auto; opacity: 0.8; }
      p.handle { bottom: 5vh; }
      #chrome { position: fixed; inset: 0; z-index: 5; pointer-events: none; transition: opacity 0.3s ease; }
      /* Not over the title, which wears its own, nor over the live game, which is the player's, nor
         on a slide that opts out (`data-chrome="off"`: the workshop, whose panels sit up there). */
      body.on-title #chrome, body.live #chrome, body.no-chrome #chrome { opacity: 0; }
      /* Bigger and heavier than the deck's h1, centred down the slide over the city's edge, and inked
         by what's behind it (scenetext.js, `contrast`): this colour over the sky, plain white where
         it runs onto the city. (It spent a while up at the top in plain ink, 24px under the kicker
         and clear of the city; centred carried the slide better.) */
      .title > h1 { font-size: clamp(64px, 7.5vw, 140px); font-weight: 800; --blend: contrast; }
      .title > :not(.bg-game) { position: relative; z-index: 1; }
      .title > p.kicker, .title > p.handle { position: absolute; }
      .bg-game {
        position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
        pointer-events: none; opacity: 0; transition: opacity 1.2s ease;
      }
      .bg-game.loaded { opacity: 1; }
      /* Once the words are drawn inside the game (src/talk/scenetext.js), the HTML keeps the layout
         and stops drawing. Opacity, not a transparent colour: a redraw on resize reads the colour
         back off these elements, and the first cut repainted the title in transparent ink. */
      .title.in-scene h1, .title.in-scene .kicker, .title.in-scene .handle { opacity: 0; }
      /* Slide 3: the character select (src/talk/select.js). A white screen like the rest of the deck,
         the pixel font, and sprites drawn into canvases one pixel per cell and scaled up by --u with
         no smoothing. A fighter takes no room until they arrive (`.in`), so the roster stays centred
         and slides over to make space as each one pops in. */
      #select {
        display: grid; place-content: center; justify-items: center; gap: 5vh; padding: 0; overflow: hidden;
        background: #fff; color: #1a1a1a; cursor: pointer;
        font-family: 'Press Start 2P', monospace; text-transform: uppercase;
        --u: min(0.42vw, 0.8vh);
      }
      /* The roster is the whole group, centred both ways. Its top padding is the 1P tag's room
         (about 2.5 of its own font size, plus the gap it hangs at), since the tag hangs above the
         box; START sits out of the flow below, so it doesn't push the group up while hidden. */
      #select .roster {
        display: flex; justify-content: center; align-items: start;
        padding-top: calc(2.5 * clamp(12px, 1.4vw, 24px) + 1.2vh);
      }
      /* Spaced by margins rather than a gap, so a fighter who isn't there takes no share. */
      #select .fighter {
        --w: calc(var(--cw) * var(--u));
        display: grid; justify-items: center; align-content: start; gap: 2.2vh;
        width: 0; margin: 0; visibility: hidden;
        transition: width 0.4s cubic-bezier(0.3, 1.3, 0.5, 1), margin 0.4s cubic-bezier(0.3, 1.3, 0.5, 1);
      }
      #select .fighter.in { width: var(--w); margin: 0 1.6vw; visibility: visible; }
      /* As tall as the tallest figure (Tyler, 43 cells), feet on its floor, so the names line up. */
      #select .stage {
        position: relative; width: var(--w); height: calc(43 * var(--u));
        display: flex; align-items: flex-end; justify-content: center;
      }
      #select .stage::after {
        content: ''; position: absolute; left: 18%; right: 18%; bottom: -1.5%; height: 4%;
        border-radius: 50%; background: rgba(0, 0, 0, 0.12); z-index: -1;
      }
      #select .sprite { width: var(--w); height: calc(var(--ch) * var(--u)); image-rendering: pixelated; }
      #select .name { font-size: clamp(10px, 1.05vw, 18px); padding: 0.4em 0.6em; white-space: nowrap; }
      #select .age { font-size: clamp(8px, 0.8vw, 13px); white-space: nowrap; }
      /* The tag hangs just over the figure's head, with a notch pointing down at it. */
      #select .tag {
        position: absolute; bottom: calc(var(--ch) * var(--u) + 1.2vh); left: 50%; translate: -50% 0;
        z-index: 1; padding: 0.4em 0.55em; font-size: clamp(12px, 1.4vw, 24px);
        background: var(--p); color: #fff; text-shadow: 0.12em 0.12em 0 #000; box-shadow: 0 0.25em 0 #000;
      }
      #select .tag::after {
        content: ''; position: absolute; top: 100%; left: 50%; translate: -50% 0;
        border: 0.4em solid transparent; border-top-color: var(--p);
      }
      #select .fighter .name { background: var(--p); color: #fff; text-shadow: 0.12em 0.12em 0 #000; }
      /* Arriving: the figure pops up out of its own feet, past full size and back, in steps like a
         cartridge would; the tag drops in on top, then the name and stats. */
      #select .fighter.in .sprite { transform-origin: 50% 100%; animation: sel-pop 0.42s steps(7) both; }
      #select .fighter.in .tag { animation: sel-drop 0.36s steps(6) 0.18s both; }
      #select .fighter.in .name, #select .fighter.in .age { animation: sel-fade 0.3s steps(3) 0.25s both; }
      @keyframes sel-pop {
        0% { transform: scale(0, 0); }
        55% { transform: scale(1.12, 1.18); }
        80% { transform: scale(0.96, 0.92); }
        100% { transform: none; }
      }
      @keyframes sel-drop {
        0% { transform: translateY(-160%) scale(1.8); opacity: 0; }
        70% { transform: translateY(12%) scale(1); opacity: 1; }
        100% { transform: none; opacity: 1; }
      }
      @keyframes sel-fade { from { opacity: 0; } }
      /* The one who sits out: grey, a hop and then off the bottom of the screen — and once she's gone
         her slot closes up and the other three slide together. */
      #select .fighter.in.dropped {
        width: 0; margin: 0;
        transition: width 0.45s ease 0.8s, margin 0.45s ease 0.8s;
      }
      /* `.in` as well, to outrank the arrival's own animations on the same children. */
      #select .fighter.in.dropped > * {
        filter: grayscale(1); animation: sel-fall 0.8s cubic-bezier(0.5, -0.5, 0.9, 0.6) forwards;
      }
      @keyframes sel-fall { to { transform: translateY(110vh) rotate(20deg); } }
      /* Hidden until the team is settled: shown once she's off and the others have closed up. */
      #select .start {
        position: absolute; left: 50%; bottom: 10vh; translate: -50% 0; visibility: hidden;
        font: inherit; font-size: clamp(14px, 1.8vw, 30px); text-transform: inherit; letter-spacing: 0.1em;
        color: #ff4d4d; background: none; border: 0; padding: 0.8em 1.6em; cursor: pointer;
        animation: sel-blink 0.5s steps(1) infinite;
      }
      #select.ready .start { visibility: visible; transition: visibility 0s 1.3s; }
      @keyframes sel-blink { 50% { opacity: 0; } }
      /* A playable game on a slide: loaded when the slide comes up, unloaded when it goes. */
      .demo { display: grid; gap: 1.2vh; justify-items: center; }
      .demo iframe {
        width: 100%; height: 66vh; border: 0; border-radius: 1.6vw; background: #222;
        box-shadow: 0 2vh 4vh rgba(0, 0, 0, 0.18);
      }
      /* Then and now: the first build (abfb86a9, prebuilt into public/talk/first/) over today's
         game, both under the same fixed camera; the first is clipped to the left of the wipe. */
      .compare { cursor: ew-resize; touch-action: none; --x: 100%; }
      .compare .cmp-old {
        position: absolute; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none;
        clip-path: inset(0 calc(100% - var(--x)) 0 0); opacity: 0; transition: opacity 1.2s ease;
      }
      .compare .cmp-old.loaded { opacity: 1; }
      /* The divider: a black line and a black knob with white chevrons. Out of sight unless it's
         doing something — the reveal sweep, a drag, or a pointer over it (the element is a 64px
         hover strip; the line and the knob are drawn inside it). */
      .compare .wipe {
        position: absolute; top: 0; bottom: 0; left: var(--x); width: 64px; translate: -50% 0;
        opacity: 0; transition: opacity 0.35s ease; z-index: 2;
      }
      .compare .wipe:hover, .compare.sweeping .wipe, .compare.dragging .wipe { opacity: 1; }
      .compare .wipe::before {
        content: ''; position: absolute; top: 0; bottom: 0; left: 50%; width: 3px; translate: -50% 0;
        background: #111; box-shadow: 0 0 10px rgba(255, 255, 255, 0.25);
      }
      .compare .wipe span {
        position: absolute; top: 50%; left: 50%; translate: -50% -50%; width: 48px; height: 48px;
        border-radius: 50%; background: #111; box-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
        display: grid; place-items: center;
      }
      .compare .wipe svg {
        width: 26px; height: 26px; fill: none; stroke: #fff; stroke-width: 2.4;
        stroke-linecap: round; stroke-linejoin: round;
      }
      /* A demo that takes the whole slide, edge to edge, like the title's backdrop. */
      .bleed { padding: 0; }
      .bleed .demo { position: absolute; inset: 0; display: block; }
      .bleed .demo iframe { width: 100%; height: 100%; border-radius: 0; box-shadow: none; }
      .bleed .demo iframe.focused { outline-offset: -4px; }
      .demo iframe.focused { outline: 4px solid #F5C130; outline-offset: 4px; }
      .demo small { font-size: 13px; font-weight: 600; color: #8a96a2; }
      /* A photo print: already tilted with a ragged edge in the file, so no box — just a shadow. */
      /* Sized to the image itself (no letterboxing in the box), so a point in the picture —
         the real cans, for slide 2's gag — is a point in the element. */
      .photo {
        display: block; max-width: 82vw; max-height: 82vh; width: auto; height: auto;
        filter: drop-shadow(0 2vh 3vh rgba(0, 0, 0, 0.18));
      }

      /* The table of contents: a column of thin ticks at the left edge, faint until hovered, when
         it widens and names each slide. */
      #toc {
        position: fixed; left: 0; top: 50%; translate: 0 -50%; z-index: 6;
        display: flex; flex-direction: column; padding: 12px 12px 12px 16px;
      }
      /* Packed tight; the line under the pointer opens a little room around itself and names its
         slide, so the column shifts as you run down it. */
      #toc button {
        display: flex; align-items: center; gap: 10px; height: 6px;
        background: none; border: 0; padding: 0; cursor: pointer; font: inherit; color: #121a22;
        opacity: 0.25; transition: height 0.18s ease, opacity 0.18s ease;
      }
      /* Only the line under the pointer darkens; the rest stay grey. */
      #toc button:hover { height: 26px; opacity: 1; }
      #toc i {
        display: block; flex: none; width: 14px; height: 2px; background: currentColor;
        transition: width 0.18s ease;
      }
      #toc button.on i { width: 24px; }
      #toc button:hover i { width: 32px; }
      #toc span {
        font-size: 13px; font-weight: 600; white-space: nowrap;
        max-width: 0; overflow: hidden; opacity: 0;
        transition: max-width 0.25s ease, opacity 0.18s ease;
      }
      #toc button:hover span { max-width: 320px; opacity: 1; }
      body.live #toc { display: none; }

      /* Slide 2's falling cans (src/talk/cans.js): over the slide, never in the way of a click. */
      #cans {
        position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 4; pointer-events: none;
        display: none;
      }
      #cans.on { display: block; }
      /* The snake (src/talk/snake.js): the same kind of overlay as the cans. */
      #snake-game {
        position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 4; pointer-events: none;
        display: none;
      }
      #snake-game.on { display: block; }
      #snake, #sketch { cursor: pointer; }
      /* Slide 5's question, until the snake is let loose: then it fades and shrinks away behind it.
         The clip before that lands on top of it and leaves it be. */
      #snake h1 { transition: opacity 0.6s ease, scale 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
      #snake.playing h1 { opacity: 0; scale: 0.6; }
      /* The clip between the question and the game: a phone recording dropped over the question,
         tilted like the deck's other prints, with a play button on it until it plays. */
      #snake .clip {
        position: absolute; left: 50%; top: 50%; height: 73.6vh; aspect-ratio: 404 / 720;
        translate: -50% -46%; rotate: 3deg; opacity: 0; pointer-events: none;
        transition: opacity 0.5s ease, translate 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      #snake.clipping .clip { opacity: 1; translate: -50% -50%; pointer-events: auto; }
      #snake .clip video {
        display: block; width: 100%; height: 100%; object-fit: cover;
        border-radius: 18px; box-shadow: 0 18px 50px rgba(0, 0, 0, 0.22);
      }
      #snake .clip .play {
        position: absolute; left: 50%; top: 50%; translate: -50% -50%; width: 96px; height: 96px;
        display: grid; place-items: center; padding: 0; border: 0; border-radius: 50%; cursor: pointer;
        background: #111; box-shadow: 0 8px 28px rgba(0, 0, 0, 0.3);
        transition: opacity 0.25s ease, scale 0.15s ease;
      }
      #snake .clip .play:hover { scale: 1.06; }
      /* Optically centred: the triangle's centroid, not its box, sits on the circle's centre (the
         path starts at x 8.4 so that (2·8.4 + 19.4) / 3 is the viewBox's 12). */
      #snake .clip .play svg { width: 44px; height: 44px; fill: #fff; }
      #snake .clip.is-playing .play { opacity: 0; pointer-events: none; }
      /* Slide 2's print has its tilt baked into the file; this one is a straight photo, so it gets
         its tilt here; src/talk/wisp.js copies it onto the canvas that burns it away. */
      #sketch .photo { max-height: 60vh; rotate: -3deg; }
      #kid .photo { cursor: pointer; max-height: 60vh; }
      /* "Try it out", in two columns: the pitch on the left (app icon, rounded the way the home
         screen rounds it, over the title), lined up with the header and footer at 7vw; the QR card on
         the right, at the safe frame's edge (20vw in), with the App Store badge inside it. */
      #try {
        display: grid; grid-template-columns: auto auto; justify-content: space-between; align-items: center;
        gap: 4vw; padding: 0 20vw 0 7vw;
      }
      #try .app-icon { display: block; width: 96px; height: 96px; border-radius: 22.5%; margin-bottom: 3vh; box-shadow: 0 1vh 2.5vh rgba(0, 0, 0, 0.12); }
      #try h2 { font-size: clamp(22px, 2.4vw, 40px); line-height: 1.3; margin-top: 1.5vh; color: #6b6b6b; }
      /* The card: the QR (white with its own quiet zone) and the badge under it, on one white card
         with a faint grey edge so it stands off the white slide. */
      #try .scan {
        display: flex; flex-direction: column; align-items: center; width: min(40vh, 26vw);
        padding-bottom: 3.5vh; background: #fff; border: 1px solid #e3e3e3; border-radius: 12px;
        box-shadow: 0 2vh 4vh rgba(0, 0, 0, 0.12); overflow: hidden;
      }
      /* The QR, generated once (npx qrcode) into talk/media so it needs no network. */
      #try .qr { display: block; width: 100%; height: auto; image-rendering: pixelated; }
      /* Apple's own badge (developer.apple.com, unmodified), at no less than the 40px it asks for. */
      #try .store-badge { display: block; height: max(40px, 6vh); width: auto; }
      .hero-taxi canvas { display: block; width: 100%; height: 100%; }
      /* The title with the taxi on the same line, to its right. The road under it fades out before
         the canvas's bottom edge. */
      /* Big enough for the three creatures (src/talk/escape.js, perchCreatures) to stand along. */
      #thanks h1 { font-size: clamp(96px, 12vw, 200px); }
      #name .title-row { display: flex; align-items: center; justify-content: center; gap: 2vw; }
      #name h1 { font-size: clamp(56px, 7vw, 120px); }
      /* Wider than its slot by SPILL each side (the negative margins keep the layout), so the dust
         thrown back off a landing has room to drift out and fade rather than stopping dead at the
         canvas's edge, which it did a few centimetres past the car. The camera is centred on the
         car and the height is unchanged, so the car is the same size in the same place. */
      #name .hero-taxi {
        --spill: 14vw;
        width: calc(min(36vw, 52vh) + 2 * var(--spill)); height: 30vh; margin-inline: calc(-1 * var(--spill));
        mask-image: linear-gradient(to bottom, #000 75%, transparent 95%),
          linear-gradient(to right, transparent, #000 18%, #000 82%, transparent);
        mask-composite: intersect;
      }

      /* The game clock: hidden on the title, pops in when the talk starts, red in the last minute,
         and counts overtime after the buzzer. */
      #clock {
        position: fixed; right: 24px; bottom: 24px; z-index: 7;
        display: flex; align-items: center; gap: 10px;
        padding: 10px 18px 10px 14px; border-radius: 999px;
        background: #121a22; color: #F5C130;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25), inset 0 -3px 0 rgba(0, 0, 0, 0.35);
        font-weight: 800; font-size: 28px; font-variant-numeric: tabular-nums; letter-spacing: 0.01em;
        transform: scale(0); transform-origin: 100% 100%;
        transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.3s, color 0.3s;
        pointer-events: none;
      }
      #clock.on { transform: scale(1); }
      /* Parked for now: the clock still runs (R resets it), it just isn't shown. Delete this line to bring it back. */
      #clock { display: none !important; }
      /* On a full-bleed demo the bottom right is the demo's (the workshop's Send button). */
      body.on-bleed #clock { right: auto; left: 24px; transform-origin: 0 100%; }
      #clock i { font-style: normal; font-size: 22px; }
      #clock.hurry { background: #d7263d; color: #fff; animation: clock-pulse 1s ease-in-out infinite; }
      #clock.over { background: #d7263d; color: #fff; animation: clock-pulse 0.5s ease-in-out infinite; }
      #clock.over::before {
        content: 'TIME!'; font-size: 16px; font-weight: 900; letter-spacing: 0.08em;
      }
      @keyframes clock-pulse { 50% { transform: scale(1.08); } }

      /* The slide. Words on the left, phone on the right. */
      #slide {
        display: grid; grid-template-columns: 1.25fr 1fr; align-items: center;
        gap: 6vw; pointer-events: none;
      }
      /* Where the phone docks on the slide: an empty box the phone (#device) is shrunk onto. */
      #phone-slot { justify-self: center; height: min(82vh, 92vw * 19.5 / 9); aspect-ratio: 9 / 19.5; }
      #words { transition: opacity 0.4s ease, transform 0.6s cubic-bezier(0.65, 0, 0.35, 1); }
      #words p { font-size: clamp(18px, 2.4vw, 40px); }

      /* Out to the left as the phone opens, away from it. */
      body.live #words { opacity: 0; transform: translateX(-6vw); }

    </style>
  </head>
