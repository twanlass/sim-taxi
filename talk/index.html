<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rocket Rides — the talk</title>
    <!-- A presentation, not part of the game: no manifest, no icons, no service worker, and left
         out of the iOS build by tools/ios-sync.mjs. See docs/talk.md. -->
    <meta name="robots" content="noindex" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; overflow: hidden;
        background: #ffffff; color: #121a22;
        font-family: -apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', sans-serif;
        user-select: none; -webkit-user-select: none;
      }

      /* The game itself, always the full size of the window. It never resizes: the phone is a
         clip over it, so the reveal is the clip opening rather than the canvas growing — a canvas
         resize mid-animation would re-frame the camera and empty the buffer on every step. */
      #game {
        position: fixed; inset: 0; width: 100vw; height: 100vh; border: 0;
        opacity: 0; transition: opacity 0.5s ease;
        clip-path: var(--clip);
      }
      #game.ready { opacity: 1; }
      body:not(.on-phone) #game { visibility: hidden; }

      /* The deck: one slide on at a time. Hidden by visibility rather than display, so the phone
         slide keeps its layout box — talk.js measures the phone off it before it is ever shown. */
      .slide {
        position: fixed; inset: 0; padding: 0 7vw;
        visibility: hidden; opacity: 0; transition: opacity 0.3s ease, visibility 0s 0.3s;
      }
      .slide.on { visibility: visible; opacity: 1; transition: opacity 0.3s ease; }
      /* Titles: the deck's Figma type style (Inter 450, 149% leading, -0.01em, #1A1A1A), at slide
         sizes rather than the frame's 32px. Body text stays on the system font. */
      .slide h1, .slide h2 {
        font-family: 'Inter Variable', -apple-system, system-ui, sans-serif;
        font-weight: 450; font-style: normal; font-variation-settings: 'slnt' 0;
        line-height: 1.49; letter-spacing: -0.01em; color: #1A1A1A;
      }
      /* Tighter than the Figma 149%: that leading is for one line, and a two-line h1 fell apart. */
      .slide h1 { font-size: 72px; font-weight: 600; line-height: 1.05; }
      .slide h2 { font-size: clamp(28px, 4vw, 68px); }
      /* Subtitles: the Figma subtitle style (Inter 450, 140% leading, -0.01em, #A1A1A1). */
      .slide p {
        margin-top: 1vh; font-size: clamp(18px, 2.2vw, 36px);
        font-family: 'Inter Variable', -apple-system, system-ui, sans-serif;
        font-weight: 450; font-variation-settings: 'slnt' 0;
        line-height: 1.4; letter-spacing: -0.01em; color: #A1A1A1;
      }
      .center { display: grid; place-content: center; text-align: center; }
      /* The title slide: words on the left over the game's own title screen (live city, no riders),
         full-bleed — sky behind the words, the island on the right, shifted there by the camera
         (talk.js, BG_SHIFT) rather than by moving the frame. */
      .title {
        display: grid; align-content: start; justify-items: start; overflow: hidden; padding-top: 18vh;
      }
      .title > p.byline {
        position: absolute; left: 7vw; bottom: 5vh; margin: 0;
        font-size: clamp(13px, 1.1vw, 18px); font-weight: 600; letter-spacing: 0; color: #1A1A1A;
      }
      .title > :not(.bg-game) { position: relative; z-index: 1; }
      .bg-game {
        position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
        pointer-events: none; opacity: 0; transition: opacity 1.2s ease;
      }
      .bg-game.loaded { opacity: 1; }
      /* Once the words are drawn inside the game (src/talk/scenetext.js), the HTML keeps the layout
         and stops drawing. Opacity, not a transparent colour: a redraw on resize reads the colour
         back off these elements, and the first cut repainted the title in transparent ink. */
      .title.in-scene h1, .title.in-scene .byline { opacity: 0; }
      .split { display: grid; grid-template-columns: 1.3fr 1fr; align-items: center; gap: 5vw; }
      .stack { display: grid; grid-template-rows: auto 1fr; gap: 4vh; padding-top: 8vh; padding-bottom: 8vh; }
      .row { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2vw; }
      /* A stand-in for a photo or a video that hasn't been dropped in yet. */
      .ph {
        display: grid; place-content: center; text-align: center; padding: 2vw;
        min-height: 30vh; height: 100%; border-radius: 1.6vw;
        border: 2px dashed #c3ccd5; background: #f4f6f8; color: #8a96a2;
        font-size: clamp(13px, 1.2vw, 18px); font-weight: 600;
      }
      .split .ph { height: 70vh; }
      /* A playable game on a slide: loaded when the slide comes up, unloaded when it goes. */
      .demo { display: grid; gap: 1.2vh; justify-items: center; }
      .demo iframe {
        width: 100%; height: 66vh; border: 0; border-radius: 1.6vw; background: #222;
        box-shadow: 0 2vh 4vh rgba(0, 0, 0, 0.18);
      }
      /* A 16:9 scene fills the column's width at its own shape rather than letterboxing in 66vh. */
      .demo iframe.wide { height: auto; aspect-ratio: 16 / 9; }
      /* A whole-page tool under a slide heading: the frame takes the rest of the slide. */
      .demo.full { grid-template-rows: 1fr auto; min-height: 0; }
      .demo.full iframe { height: 100%; min-height: 0; }
      /* A looping clip; the placeholder under it shows until the file exists. */
      .vid { display: grid; }
      .vid > * { grid-area: 1 / 1; }
      .vid video {
        width: 100%; max-height: 70vh; border-radius: 1.6vw; background: #000;
        box-shadow: 0 2vh 4vh rgba(0, 0, 0, 0.18);
      }
      .vid video:not(.loaded) { visibility: hidden; }
      .vid video.loaded + .ph { display: none; }
      /* Then and now: the first build (abfb86a9, prebuilt into public/talk/first/) over today's
         game, both under the same fixed camera; the first is clipped to the left of the wipe. */
      .compare { cursor: ew-resize; touch-action: none; --x: 100%; }
      .compare .cmp-old {
        position: absolute; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none;
        clip-path: inset(0 calc(100% - var(--x)) 0 0); opacity: 0; transition: opacity 1.2s ease;
      }
      .compare .cmp-old.loaded { opacity: 1; }
      /* The divider: a black line and a black knob with white chevrons. Out of sight unless it's
         doing something — the reveal sweep, a drag, or a pointer over it (the element is a 64px
         hover strip; the line and the knob are drawn inside it). */
      .compare .wipe {
        position: absolute; top: 0; bottom: 0; left: var(--x); width: 64px; translate: -50% 0;
        opacity: 0; transition: opacity 0.35s ease; z-index: 2;
      }
      .compare .wipe:hover, .compare.sweeping .wipe, .compare.dragging .wipe { opacity: 1; }
      .compare .wipe::before {
        content: ''; position: absolute; top: 0; bottom: 0; left: 50%; width: 3px; translate: -50% 0;
        background: #111; box-shadow: 0 0 10px rgba(255, 255, 255, 0.25);
      }
      .compare .wipe span {
        position: absolute; top: 50%; left: 50%; translate: -50% -50%; width: 48px; height: 48px;
        border-radius: 50%; background: #111; box-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
        display: grid; place-items: center;
      }
      .compare .wipe svg {
        width: 26px; height: 26px; fill: none; stroke: #fff; stroke-width: 2.4;
        stroke-linecap: round; stroke-linejoin: round;
      }
      /* Each label rides a full-screen layer clipped exactly like its own game, so the divider wipes
         it away with its side rather than sliding over it. */
      .compare .side { position: absolute; inset: 0; pointer-events: none; }
      .compare .side-old { clip-path: inset(0 calc(100% - var(--x)) 0 0); }
      .compare .side-new { clip-path: inset(0 0 0 var(--x)); }
      .compare .tag {
        position: absolute; top: 4vh; padding: 6px 14px; border-radius: 999px; pointer-events: none;
        background: rgba(18, 26, 34, 0.75); color: #fff; font-size: 14px; font-weight: 600;
      }
      .compare .tag-old { left: 4vw; }
      .compare .tag-new { right: 4vw; }
      /* A demo that takes the whole slide, edge to edge, like the title's backdrop. */
      .bleed { padding: 0; }
      .bleed .demo { position: absolute; inset: 0; display: block; }
      .bleed .demo iframe { width: 100%; height: 100%; border-radius: 0; box-shadow: none; }
      .bleed .demo iframe.focused { outline-offset: -4px; }
      .demo iframe.focused { outline: 4px solid #F5C130; outline-offset: 4px; }
      .demo small { font-size: 13px; font-weight: 600; color: #8a96a2; }
      /* A photo print: already tilted with a ragged edge in the file, so no box — just a shadow. */
      /* Sized to the image itself (no letterboxing in the box), so a point in the picture —
         the real cans, for slide 2's gag — is a point in the element. */
      .photo {
        display: block; max-width: 82vw; max-height: 82vh; width: auto; height: auto;
        filter: drop-shadow(0 2vh 3vh rgba(0, 0, 0, 0.18));
      }

      /* The table of contents: a column of thin ticks at the left edge, faint until hovered, when
         it widens and names each slide. */
      #toc {
        position: fixed; left: 0; top: 50%; translate: 0 -50%; z-index: 6;
        display: flex; flex-direction: column; padding: 12px 12px 12px 16px;
      }
      /* Packed tight; the line under the pointer opens a little room around itself and names its
         slide, so the column shifts as you run down it. */
      #toc button {
        display: flex; align-items: center; gap: 10px; height: 6px;
        background: none; border: 0; padding: 0; cursor: pointer; font: inherit; color: #121a22;
        opacity: 0.25; transition: height 0.18s ease, opacity 0.18s ease;
      }
      /* Only the line under the pointer darkens; the rest stay grey. */
      #toc button:hover { height: 26px; opacity: 1; }
      #toc i {
        display: block; flex: none; width: 14px; height: 2px; background: currentColor;
        transition: width 0.18s ease;
      }
      #toc button.on i { width: 24px; }
      #toc button:hover i { width: 32px; }
      #toc span {
        font-size: 13px; font-weight: 600; white-space: nowrap;
        max-width: 0; overflow: hidden; opacity: 0;
        transition: max-width 0.25s ease, opacity 0.18s ease;
      }
      #toc button:hover span { max-width: 320px; opacity: 1; }
      body.live #toc { display: none; }

      /* Slide 2's falling cans (src/talk/cans.js): over the slide, never in the way of a click. */
      #cans {
        position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 4; pointer-events: none;
        display: none;
      }
      #cans.on { display: block; }
      #kid .photo { cursor: pointer; max-height: 60vh; }
      /* The TestFlight slide's QR, generated once (npx qrcode) into talk/media so it needs no network. */
      .qr {
        justify-self: center; width: min(36vh, 60vw); height: auto; margin-top: 4vh;
        image-rendering: pixelated; border-radius: 12px; box-shadow: 0 2vh 4vh rgba(0, 0, 0, 0.12);
      }
      .slide p.qr-url { margin-top: 2vh; font-size: clamp(14px, 1.3vw, 22px); }

      /* The game clock: hidden on the title, pops in when the talk starts, red in the last minute,
         and counts overtime after the buzzer. */
      #clock {
        position: fixed; right: 24px; bottom: 24px; z-index: 7;
        display: flex; align-items: center; gap: 10px;
        padding: 10px 18px 10px 14px; border-radius: 999px;
        background: #121a22; color: #F5C130;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25), inset 0 -3px 0 rgba(0, 0, 0, 0.35);
        font-weight: 800; font-size: 28px; font-variant-numeric: tabular-nums; letter-spacing: 0.01em;
        transform: scale(0); transform-origin: 100% 100%;
        transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.3s, color 0.3s;
        pointer-events: none;
      }
      #clock.on { transform: scale(1); }
      /* Parked for now: the clock still runs (R resets it), it just isn't shown. Delete this line to bring it back. */
      #clock { display: none !important; }
      /* On a full-bleed demo the bottom right is the demo's (the workshop's Send button). */
      body.on-bleed #clock { right: auto; left: 24px; transform-origin: 0 100%; }
      #clock i { font-style: normal; font-size: 22px; }
      #clock.hurry { background: #d7263d; color: #fff; animation: clock-pulse 1s ease-in-out infinite; }
      #clock.over { background: #d7263d; color: #fff; animation: clock-pulse 0.5s ease-in-out infinite; }
      #clock.over::before {
        content: 'TIME!'; font-size: 16px; font-weight: 900; letter-spacing: 0.08em;
      }
      @keyframes clock-pulse { 50% { transform: scale(1.08); } }
      body.revealing #game, body.revealing-back #game {
        transition: opacity 0.5s ease, clip-path var(--reveal-ms) cubic-bezier(0.65, 0, 0.35, 1);
      }

      /* The slide. Phone on the left, words on the right. */
      #slide {
        display: grid; grid-template-columns: 1fr 1.25fr; align-items: center;
        gap: 6vw; pointer-events: none;
      }
      #phone {
        justify-self: center;
        height: min(82vh, 92vw * 19.5 / 9); aspect-ratio: 9 / 19.5;
        border-radius: 13% / 6%;
        border: 1.1vh solid #05080b;
        box-shadow: 0 0 0 0.25vh #3a4652, 0 3vh 8vh rgba(0, 0, 0, 0.22);
        position: relative;
        pointer-events: auto; cursor: pointer;
        transform-origin: 50% 50%;
        transition: transform var(--reveal-ms) cubic-bezier(0.65, 0, 0.35, 1),
          opacity calc(var(--reveal-ms) * 0.7) ease;
      }
      /* The island, so the outline reads as a phone at a glance. */
      #phone::after {
        content: ''; position: absolute; top: 1.4%; left: 50%; translate: -50% 0;
        width: 30%; height: 3.6%; border-radius: 999px; background: #05080b;
      }
      #words { transition: opacity 0.4s ease, transform 0.6s cubic-bezier(0.65, 0, 0.35, 1); }
      #words p { font-size: clamp(18px, 2.4vw, 40px); }
      #words .hint {
        margin-top: 6vh; font-size: clamp(12px, 1vw, 15px); font-weight: 500;
        letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.45;
      }

      body.live #phone { transform: scale(2.6); opacity: 0; pointer-events: none; }
      body.live #words { opacity: 0; transform: translateX(6vw); }

      #back {
        position: fixed; top: 14px; left: 50%; translate: -50% 0; z-index: 5;
        padding: 6px 14px; border-radius: 999px; font: inherit; font-size: 13px; font-weight: 600;
        background: rgba(18, 26, 34, 0.7); color: #eef3f7; border: 0; cursor: pointer;
        opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
      }
      body.live:not(.revealing) #back { opacity: 0.85; pointer-events: auto; }
    </style>
  </head>
  <body>
    <iframe id="game" title="Rocket Rides" allow="autoplay; fullscreen"></iframe>
    <nav id="toc" aria-label="Slides"></nav>
    <div id="clock" aria-live="off"><i>⏱</i><b>9:00</b></div>
    <!-- 1 -->
    <section class="slide title" data-name="Making games with my kids">
      <iframe class="bg-game" data-src="/?splash=classic&titleintro=classic" data-squall tabindex="-1" aria-hidden="true"></iframe>
      <h1>Making games<br />with my kids</h1>
      <p class="byline">@tdub • Stripe Design Onsite 26′</p>
    </section>
    <!-- 2 -->
    <section class="slide center" id="kid" data-name="Tyler as a kid">
      <img class="photo" src="./media/tyler-kid.png" alt="Young Tyler at a CRT, making games" />
    </section>
    <!-- 3 -->
    <section class="slide bleed compare" data-name="Then and now">
      <iframe class="bg-game" data-src="/?splash=classic&titleintro=classic" data-zoom="52" data-shift="0" data-squall="50" tabindex="-1" aria-hidden="true"></iframe>
      <iframe class="cmp-old" data-src="/talk/first/index.html" tabindex="-1" aria-hidden="true"></iframe>
      <div class="wipe"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 6 4 12l5.5 6M14.5 6 20 12l-5.5 6" /></svg></span></div>
      <div class="side side-old"><span class="tag tag-old">First commit</span></div>
      <div class="side side-new"><span class="tag tag-new">Today</span></div>
    </section>
    <!-- 4 -->
    <section class="slide bleed" data-name="The workshop">
      <div class="demo"><iframe data-src="/workshop/" title="The model workshop"></iframe></div>
    </section>
    <!-- 5: the phone that opens into the live game -->
    <section class="slide" id="slide" data-name="Live demo">
      <div id="phone" role="button" aria-label="Play the game"></div>
      <div id="words">
        <h1>Rocket Rides</h1>
        <p>A look at what we've built</p>
        <div class="hint">Tap the phone</div>
      </div>
    </section>
    <!-- 6 -->
    <section class="slide center">
      <h1>Thanks!</h1>
    </section>
    <!-- 7 -->
    <section class="slide center" data-name="TestFlight">
      <h2>Placeholder content here</h2>
      <p>Here's a TestFlight link: put Rocket Rides on your iPhone</p>
      <img class="qr" src="./media/testflight-qr.svg" alt="QR code for testflight.apple.com/join/ZMskw8Gu" />
      <p class="qr-url">testflight.apple.com/join/ZMskw8Gu</p>
    </section>
    <button id="back" type="button">Back to the slide · Esc</button>
    <script type="module" src="/src/talk/talk.js"></script>
  </body>
</html>
