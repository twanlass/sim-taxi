<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rocket Rides — model workshop</title>
    <!-- A workbench at /workshop/, like /lab/: no manifest, no icons, no service worker, nothing in
         the game links here, and it is not in `npm run build` at all — the chat panel is a dev
         server endpoint (tools/workshop-agent.mjs), so a built copy would be a viewer with a dead
         text box. See docs/workshop.md. -->
    <meta name="robots" content="noindex" />
    <!-- The game's own face (src/fonts.css), so the workshop reads as part of the same thing. -->
    <link rel="stylesheet" href="/src/fonts.css" />
    <style>
      :root {
        color-scheme: light;
        --chat-w: 380px;
        --ink: #eef3f7;
        --panel: rgba(22, 30, 38, 0.82);
        --accent: #F5C130;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; overflow: hidden; background: #dcedf7;
        font: 500 13px/1.5 "Space Grotesk", system-ui, -apple-system, "Helvetica Neue", sans-serif;
      }
      /* The bench runs under the chat, which floats inset over its right side; viewer.js shifts
         both cameras' centre left by half the chat's footprint so the model sits in what is left. */
      #stage { position: fixed; inset: 0; }
      #stage canvas { position: absolute; inset: 0; display: block; touch-action: none; }

      /* The bench's knobs, top-left over the canvas. Plain for the reason the lab gives. */
      #bench {
        position: absolute; top: 14px; left: 14px; z-index: 5;
        display: grid; gap: 8px; width: 236px;
        padding: 12px 14px; border-radius: 12px;
        background: var(--panel); color: var(--ink);
        backdrop-filter: blur(6px);
        box-shadow: 0 6px 22px rgba(12, 24, 34, 0.28);
        user-select: none; -webkit-user-select: none;
      }
      #bench h1 {
        font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.62; font-weight: 700;
      }
      #bench select {
        width: 100%; padding: 5px 8px; border-radius: 8px; border: 0; font: inherit; font-weight: 700;
        background: rgba(255, 255, 255, 0.14); color: inherit;
      }
      #bench select option, #bench select optgroup { color: #16120a; }
      .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
      .seg button, .act {
        padding: 4px 10px; border: 0; border-radius: 999px; cursor: pointer;
        background: rgba(255, 255, 255, 0.12); color: inherit; font: inherit; font-weight: 600;
      }
      .seg button.on { background: var(--accent); color: #16120a; font-weight: 700; }
      label.slider { display: grid; grid-template-columns: 40px 1fr 38px; align-items: center; gap: 8px; }
      label.slider input { width: 100%; accent-color: var(--accent); }
      label.pick { display: grid; grid-template-columns: 40px 1fr; align-items: center; gap: 8px; }
      label.check { display: flex; gap: 6px; align-items: center; cursor: pointer; }
      .value { text-align: right; font-variant-numeric: tabular-nums; opacity: 0.8; }
      .source { font: 11px/1.4 ui-monospace, Menlo, monospace; opacity: 0.6; word-break: break-word; }
      #reloaded { font-size: 11px; opacity: 0; transition: opacity 0.4s; color: var(--accent); }
      #reloaded.show { opacity: 1; transition: none; }
      /* The game-zoom inset's frame. The picture itself is drawn into the canvas underneath
         (viewer.js), so this is only an outline and a label, and must not take the orbit's drags. */
      #inset-box {
        position: absolute; top: 14px; right: 14px; width: 300px; height: 210px; z-index: 4;
        border: 2px solid rgba(245, 193, 48, 0.85); border-radius: 4px; pointer-events: none;
        box-shadow: 0 6px 22px rgba(12, 24, 34, 0.28);
      }
      #inset-box span {
        position: absolute; left: 6px; top: 4px; font-size: 11px; font-weight: 700;
        color: var(--ink); text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
      }
      /* The one part of the frame that takes the pointer. Minimized, the frame shrinks to a tab
         holding the label and this button, and the canvas stops drawing the inset (viewer.js). */
      #inset-toggle {
        position: absolute; right: 4px; top: 3px; width: 20px; height: 18px; pointer-events: auto;
        border: 0; border-radius: 4px; cursor: pointer; font: inherit; font-weight: 700; line-height: 1;
        background: rgba(22, 30, 38, 0.7); color: var(--ink);
      }
      #inset-toggle:hover { background: var(--accent); color: #16120a; }
      #inset-box.min {
        width: 112px; height: 26px; background: var(--panel); border-color: rgba(245, 193, 48, 0.5);
      }
      /* Play: the real game in a frame over the bench, so an edit can be seen in play and the chat
         stays beside it. Laid out over the part of the stage the chat leaves uncovered (12px of chat
         margin and 12px of gap past --chat-w); on a narrow screen that is the whole stage. */
      #play {
        position: absolute; top: 14px; z-index: 7;
        left: calc((100% - var(--chat-w) - 24px) / 2); transform: translateX(-50%);
        display: flex; align-items: center; gap: 10px;
        padding: 10px 26px 10px 20px; border: 0; border-radius: 999px; cursor: pointer;
        background: var(--accent); color: #16120a; font: inherit; font-size: 17px; font-weight: 700;
        box-shadow: 0 6px 22px rgba(12, 24, 34, 0.32);
      }
      #play:hover { filter: brightness(1.06); }
      #play .glyph { font-size: 15px; line-height: 1; }
      body.playing #play { background: var(--panel); color: var(--ink); font-size: 14px; padding: 7px 18px 7px 14px; }
      #game-frame {
        /* Sized outright: an iframe is a replaced element, so left/right insets leave it at 300×150. */
        position: absolute; top: 0; left: 0; z-index: 6;
        width: calc(100% - var(--chat-w) - 24px); height: 100%; border: 0; background: #000;
      }
      body.playing #bench, body.playing #inset-box { display: none; }
      /* A pin dropped by clicking the model, and the note that goes with it (viewer.js). Both are
         placed by a transform each frame so they follow the orbit; the pin is centred on its spot. */
      #pin, .pin {
        position: absolute; left: -9px; top: -9px; width: 18px; height: 18px; z-index: 5;
        border: 3px solid var(--accent); border-radius: 50%; pointer-events: none;
        box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.45), 0 2px 8px rgba(0, 0, 0, 0.35);
      }
      /* Sent and waiting on a reply (queued or in progress): dimmer, so the one being written is
         the one that reads as live. */
      .pin.sent { opacity: 0.6; z-index: 4; }
      #pin-note {
        position: absolute; left: 0; top: 0; z-index: 5; width: 280px;
        display: grid; gap: 6px; padding: 10px; border-radius: 10px;
        background: var(--panel); color: var(--ink); backdrop-filter: blur(6px);
        box-shadow: 0 6px 22px rgba(12, 24, 34, 0.32);
      }
      #pin-note textarea {
        width: 100%; resize: none; padding: 7px 9px 36px; border: 0; border-radius: 8px; outline: none;
        background: rgba(255, 255, 255, 0.1); color: inherit; font: inherit;
      }
      #pin[hidden], .pin[hidden], #pin-note[hidden], #pin-note [hidden] { display: none; }
      body.playing #pin, body.playing .pin, body.playing #pin-note { display: none; }
      #bench-error {
        position: absolute; left: 14px; right: 14px; bottom: 14px; z-index: 5; display: none;
        padding: 10px 12px; border-radius: 10px; background: rgba(150, 30, 30, 0.9); color: #fff;
        font: 12px/1.45 ui-monospace, Menlo, monospace; white-space: pre-wrap;
      }

      /* The chat. Docked right on a desktop; under the bench on anything narrow. */
      #chat {
        position: fixed; top: 12px; right: 12px; bottom: 12px; width: var(--chat-w);
        display: flex; flex-direction: column; overflow: hidden;
        background: #151c23; color: var(--ink);
        border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 10px;
        box-shadow: 0 8px 28px rgba(12, 24, 34, 0.35);
      }
      #chat header {
        display: flex; align-items: center; gap: 8px; padding: 12px 14px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      }
      #chat header h2 { font-size: 13px; font-weight: 700; flex: 1; }
      #chat header .act { font-size: 12px; }
      #log { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
      .msg { max-width: 92%; padding: 8px 11px; border-radius: 12px; white-space: pre-wrap; word-wrap: break-word; }
      .msg.user { align-self: flex-end; background: var(--accent); color: #16120a; font-weight: 600; }
      .msg.agent { align-self: flex-start; background: rgba(255, 255, 255, 0.07); }
      .msg.agent.working::after { content: "▍"; animation: blink 1s steps(2) infinite; opacity: 0.7; }
      /* Sent while a reply was still going (chat.js): waiting its turn, below the live reply. */
      .msg.user.queued { opacity: 0.55; position: relative; padding-right: 26px; }
      .msg.user.queued::before { content: "Queued · "; font-weight: 700; }
      .msg.user.queued button {
        position: absolute; right: 5px; top: 5px; width: 18px; height: 18px; border: 0; border-radius: 50%;
        background: rgba(0, 0, 0, 0.15); color: inherit; font: inherit; line-height: 1; cursor: pointer;
      }
      .msg.error { align-self: stretch; background: rgba(190, 50, 50, 0.25); color: #ffd9d4; }
      .msg code { font: 12px ui-monospace, Menlo, monospace; background: rgba(255, 255, 255, 0.09); padding: 0 3px; border-radius: 4px; }
      .tool { align-self: flex-start; font: 11px/1.4 ui-monospace, Menlo, monospace; opacity: 0.55; padding-left: 4px; }
      .tool b { font-weight: 700; color: var(--accent); opacity: 0.9; }
      .tools { align-self: stretch; }
      .tools summary { list-style: none; cursor: pointer; display: flex; }
      .tools summary::-webkit-details-marker { display: none; }
      .tools summary .tool { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
      .tools summary .count { flex: none; margin-left: 8px; font-size: 11px; opacity: 0.45; }
      .tools summary .count::after { content: " ▸"; }
      .tools[open] summary .count::after { content: " ▾"; }
      .tools.working summary .tool::before { content: "● "; color: var(--accent); animation: blink 1s steps(2) infinite; }
      .tools[open] summary .tool { display: none; }
      .tools[open] summary .count { margin-left: 4px; }
      .tool-list { display: flex; flex-direction: column; gap: 4px; padding: 4px 0; }
      .undo { align-self: flex-start; font-size: 12px; opacity: 0.75; }
      .undo .act { font-size: 12px; }
      .empty { opacity: 0.5; font-size: 12px; line-height: 1.55; }
      @keyframes blink { 50% { opacity: 0; } }
      #compose { padding: 10px; border-top: 1px solid rgba(255, 255, 255, 0.07); display: grid; gap: 6px; }
      #input {
        width: 100%; min-height: 64px; max-height: 200px; resize: vertical;
        padding: 9px 11px 40px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.05); color: inherit; font: inherit;
      }
      #input:focus { outline: 2px solid rgba(245, 193, 48, 0.5); outline-offset: -1px; }
      /* A text box with its buttons sitting inside its bottom-right corner: the chat's and the pin
         note's. The box keeps clear room under its last line so text never runs beneath them. */
      .field { position: relative; }
      .field textarea { display: block; }   /* the bottom padding is on each box's own rule */
      .field-actions { position: absolute; right: 7px; bottom: 7px; display: flex; gap: 6px; }
      /* Images pasted or dropped into the chat, waiting to go with the next message (chat.js). */
      #attachments { display: flex; gap: 6px; flex-wrap: wrap; }
      #attachments[hidden] { display: none; }
      #attachments .thumb { position: relative; width: 56px; height: 56px; border-radius: 8px; overflow: hidden; }
      #attachments img { width: 100%; height: 100%; object-fit: cover; display: block; }
      #attachments button {
        position: absolute; right: 2px; top: 2px; width: 16px; height: 16px; border: 0; border-radius: 50%;
        background: rgba(0, 0, 0, 0.6); color: #fff; font: inherit; font-size: 11px; line-height: 1; cursor: pointer;
      }
      #compose.dropping #input { outline: 2px dashed var(--accent); outline-offset: -1px; }
      .act.primary { background: var(--accent); color: #16120a; font-weight: 700; }
      .act:disabled { opacity: 0.35; cursor: default; }

      @media (max-width: 760px) {
        :root { --chat-w: 0px; }
        #stage { bottom: 46%; }
        #chat { top: 54%; left: 12px; width: auto; }
        #bench { width: 200px; }
        #game-frame { width: 100%; }
      }

      /* `.` toggles this (viewer.js): just the viewport, for a clean look or a screenshot. The error
         box stays, so a broken edit is never hidden behind a tidy screen. After the media query so
         a narrow screen's stage gets its lower half back too. */
      body.bare #bench, body.bare #chat, body.bare #inset-box, body.bare #play,
      body.bare #pin, body.bare .pin, body.bare #pin-note { display: none; }
      body.bare #stage { bottom: 0; }
      body.bare #game-frame { width: 100%; }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="bench">
        <h1>Model workshop</h1>
        <select id="model" aria-label="Model"></select>
        <div class="source" id="source"></div>
        <div class="row seg" id="views">
          <button type="button" data-view="orbit">Orbit</button>
          <button type="button" data-view="game">Game view</button>
        </div>
        <label class="pick">Paint <select id="paint" aria-label="Paint look"></select></label>
        <label class="slider">Hour<input id="hour" type="range" min="0" max="24" step="0.1" /><span class="value" id="hour-v"></span></label>
        <div class="row">
          <label class="check"><input id="spin" type="checkbox" /> Turntable</label>
          <label class="check"><input id="wire" type="checkbox" /> Wireframe</label>
          <button type="button" class="act" id="frame">Reframe</button>
        </div>
        <div id="reloaded">Updated from source</div>
      </div>
      <div id="inset-box"><span>Game zoom</span><button type="button" id="inset-toggle" aria-label="Minimize game zoom" title="Minimize">–</button></div>
      <div id="pin" hidden></div>
      <div id="pin-note" hidden>
        <div class="field">
          <textarea id="pin-input" rows="2" placeholder="What should change here?"></textarea>
          <span class="field-actions">
            <button type="button" class="act primary" id="pin-send">Send</button>
          </span>
        </div>
      </div>
      <button type="button" id="play"><span class="glyph">▶</span><span class="label">Play</span></button>
      <div id="bench-error"></div>
    </div>

    <aside id="chat">
      <header>
        <h2>Claude</h2>
        <button type="button" class="act" id="new-chat">New chat</button>
      </header>
      <div id="log"></div>
      <form id="compose">
        <div id="attachments" hidden></div>
        <div class="field">
          <textarea id="input" placeholder="Make the taxi's roof sign bigger…" rows="3"></textarea>
          <span class="field-actions">
            <button type="button" class="act" id="stop" hidden>Stop</button>
            <button type="submit" class="act primary" id="send">Send</button>
          </span>
        </div>
      </form>
    </aside>

    <!-- Two modules, deliberately. The viewer re-runs on every edit to anything it imports (that is
         how the bench hot-reloads); the chat imports nothing from the game, so an edit never takes
         the conversation down with it. -->
    <script type="module" src="/src/workshop/chat.js"></script>
    <script type="module" src="/src/workshop/viewer.js"></script>
  </body>
</html>
