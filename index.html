<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sim Taxi 🚕</title>
    <!-- Home-screen icon. iOS's mask is round-cornered, so the artwork is centred with a purple
         border that the mask crops into. Generated by tools/make-icon.mjs — regenerate both PNGs
         together (the SVG source stays alongside them for future edits). -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/apple-touch-icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/apple-touch-icon-512.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Sim Taxi" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Chrome's spelling of the tag above; Chrome 117+ ignores the `apple-` one on its own. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- `black-translucent` is the only status-bar style that lets the canvas draw under the top
         bar. It was reverted once for capping the document short of the true bottom of the screen
         — by more than `env(safe-area-inset-bottom)` accounted for, and no canvas-sizing trick
         could move it (confirmed by turning `document.body` red and watching only that strip
         change colour). That measurement was taken without `viewport-fit=cover` on the viewport
         meta above, and `cover` is the whole story: without it iOS spends the notch and
         home-indicator insets *itself*, by shrinking the layout viewport — which is exactly the
         short bottom — and `env(safe-area-inset-*)` reads 0 because the UA has already applied
         the inset, which is why no padding could account for it. With `cover` the top underlaps
         for real and the insets report their values — but the *bottom* stays short even then
         (measured on-device: a strip of bare sky under the canvas): in standalone mode the layout
         viewport, `window.innerHeight` and percentage heights all stop ~34pt above the physical
         bottom. `100vh` is the one length that reaches it, which is why html/body and every
         `inset: 0` overlay below carry it and the canvas is sized through util/viewport.js. The
         `--safe-*` maths keeps the HUD out from under the hardware at both ends. (The tag is
         deprecated in favour of the manifest, but the manifest has no translucent option — this
         is still the only way in.) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#A46BFF" />
    <style>
      :root { color-scheme: light; }
      /* The screen's own hardware: status bar / Dynamic Island up top, home indicator below, and
         whichever of them the notch becomes in landscape. All four resolve to 0px wherever they
         don't exist — including any context without `viewport-fit=cover` — so every `calc()`
         below degrades to its old constant. Held in variables rather than written as bare `env()`
         at each site because `env()` is CSS-only: the drop-off arrow clamps its position in JS
         (game/dropoffindicator.js) and reads these off the root instead. */
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
      }
      /* `touch-action` does *not* inherit, which is why it is on `*` and not on `html, body` next
         to the selection properties below. Set it on the root alone and every control the player
         actually presses computes `auto` again and keeps its double-tap zoom — which is how the
         rider-finder row went on zooming the city long after the pill and the ⏸ had each opted
         out by hand. `manipulation` is `auto` minus the double-tap, so panning and pinch-to-zoom
         (the deliberate, accessible kind) both survive. The elements that need the stronger
         `none` — the canvas, the Loco Mode pill — still say so below and win on specificity, `*`
         having none at all. */
      * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
      /* Matches PALETTE.skyBottom, so the frame before WebGL's first paint is the sky rather
         than a flash of a different colour. */
      /* Nothing on this page is prose to be read — it's a surface you tap and drag on. Without
         these, a long press anywhere on iOS still finds *something* selectable (the callout hunts
         past the canvas for the nearest text node) and pops the Copy / Look Up / Translate
         toolbar across the middle of the city, which then swallows the next tap that should have
         routed the taxi. Both properties inherit, so the root covers every overlay — the
         `user-select: none` declarations further down are belt and braces on the elements most
         likely to be pressed. The `-webkit-` prefixes still earn their place: iOS Safari only
         took unprefixed `user-select` in 17, and `-webkit-touch-callout` has no standard
         equivalent at all. */
      /* `100vh`, NOT `height: 100%`. On an installed iOS app (`black-translucent` +
         `viewport-fit=cover`) the percentage resolves against a layout viewport that stops ~34pt
         short of the physical bottom — the home-indicator zone — while `100vh` resolves to the
         full screen, and is the one length that is right from a cold start (`100dvh` reads the
         short value until the phone has been rotated once). The canvas is sized by the same rule
         in JS — see util/viewport.js. Everywhere else the two spellings agree exactly. */
      html, body {
        width: 100vw; height: 100vh; overflow: hidden; background: #dcedf7;
        user-select: none; -webkit-user-select: none;
        -webkit-touch-callout: none;
        /* No grey flash under a tap either — every control here has its own :active state. */
        -webkit-tap-highlight-color: transparent;
      }
      /* The one exception: the debug panel's JSON dump exists to be selected and copied when the
         clipboard API refuses, and an inherited `user-select: none` would leave nothing to drag
         over. Sliders and colour wells come along for the ride harmlessly. */
      input, textarea { user-select: text; -webkit-user-select: text; }
      canvas { display: block; touch-action: none; cursor: pointer; }

      /* The top row's type, in one place. The two counters set from `--hud-count-size` and the ⏸
         between them centres itself against `--hud-count-line` — the line box those digits occupy
         — so the three of them share one centre line and a change of size moves all three. */
      :root {
        --hud-count-size: 34px;
        --hud-count-line: calc(var(--hud-count-size) * 1.5); /* the 1.5 in the `font` shorthands */
      }

      #hud {
        position: fixed; top: calc(18px + var(--safe-top)); left: calc(18px + var(--safe-left));
        font: 600 14px/1.5 ui-rounded, "SF Pro Rounded", "Avenir Next", system-ui, sans-serif;
        color: #fff; text-shadow: 0 2px 6px rgba(20, 40, 55, 0.65);
        pointer-events: none; user-select: none;
      }
      #hud .money {
        font-size: var(--hud-count-size); font-weight: 800; font-variant-numeric: tabular-nums;
        display: inline-block; transform-origin: left center;
      }
      /* A short green bump when the flying earning lands and the total ticks up, so the counter
         registers the event rather than silently changing digits. Driven from JS by toggling the
         class off/on around a reflow — CSS animations only re-fire when the class transitions. */
      #hud .money.money-bumped { animation: money-bump 0.32s cubic-bezier(0.22, 1, 0.36, 1); }
      @keyframes money-bump {
        0%   { transform: scale(1);    color: #fff;    }
        40%  { transform: scale(1.14); color: #6BE08A; }
        100% { transform: scale(1);    color: #fff;    }
      }

      /* Cargo chip — the courier box, pictured under the cash total while a package is aboard. See
         src/game/cargochip.js for what is inside it and why it lives up here rather than at the end
         of the rider-finder row.

         **The box and nothing else.** No disc behind it, no rim around it. A rider chip needs its
         disc because the ring around it is a clock and a clock needs a dial to be read against; the
         courier layer's defining property is that a package *has* no clock, so there was nothing for
         a ring to say — and once the ring goes, the disc is a plate under an object that does not
         need one. What is left reads like the rest of the HUD: the cash total and the ⏸ are both
         bare marks on the sky too.

         The drop shadow stays, and is the same one they wear — `#hud`'s own `text-shadow` in its
         filter form, so the box holds against pale asphalt exactly as the digits above it do. It is
         a lift off the background rather than a background of its own. */
      #cargo-chip {
        margin-top: 4px;
        width: 42px; height: 42px;
        display: grid; place-items: center;
        filter: drop-shadow(0 2px 6px rgba(20, 40, 55, 0.65));
        /* Two ways in, and the transform is shared between them. The pop is the fallback — a chip
           raised with nothing on screen to come in from (`setCarrying`, and reduced motion). The real
           pickup is `flyIn`, which drives this same transform *and* the opacity with a Web Animation
           of its own; those outrank transitions in the cascade, so the two cannot fight.

           `.is-flying` kills the transition for the length of that arrival, and it has to: the chip
           fades up on its own curve, timed to overlap the world box still fading out across the map,
           and a 0.16s transition running underneath would be a second fade on the same property.

           Nothing here is driven off sim time, so shot mode has nothing to land (see the `settle()`
           note in CLAUDE.md); the whole chip is hidden with #hud there anyway. */
        opacity: 0; transform: scale(0.55); transform-origin: center;
        transition: opacity 0.16s ease, transform 0.26s cubic-bezier(0.22, 1, 0.36, 1);
      }
      #cargo-chip.is-on { opacity: 1; transform: scale(1); }
      #cargo-chip.is-flying { transition: none; }
      #cargo-chip canvas { display: block; width: 42px; height: 42px; }
      /* The chip still arrives and still leaves; it just stops springing — or flying — to do it.
         `flyIn` checks the same query and hands over to the plain pop. */
      @media (prefers-reduced-motion: reduce) {
        #cargo-chip, #cargo-chip.is-on { transform: none; transition: opacity 0.16s ease; }
      }

      /* Streak counter — mirrors the money counter at the opposite corner, and like the money
         counter it's on screen from the first frame reading `0x`. It used to stay hidden until
         the first drop-off, but an empty corner gives the player nothing to aim at; showing the
         zero states the goal. JS bumps the number on every delivery. */
      #streak {
        position: fixed; top: calc(18px + var(--safe-top)); right: calc(18px + var(--safe-right));
        font: 600 14px/1.5 ui-rounded, "SF Pro Rounded", "Avenir Next", system-ui, sans-serif;
        font-size: var(--hud-count-size); font-weight: 800; font-variant-numeric: tabular-nums;
        color: #fff; text-shadow: 0 2px 6px rgba(20, 40, 55, 0.65);
        pointer-events: none; user-select: none;
        transform-origin: right center;
      }
      /* Sits outside #hud, so it needs its own shot-mode rule — otherwise every screenshot
         carries a `0x` in the top-right corner that isn't what the shot is about. */
      body.shot-mode #streak { display: none; }
      /* Same shape as .money-bumped, but in the taxi's own yellow rather than cash green — the
         streak isn't a payout, and reusing green would read as a second money event. */
      #streak.streak-bumped { animation: streak-bump 0.32s cubic-bezier(0.22, 1, 0.36, 1); }
      @keyframes streak-bump {
        0%   { transform: scale(1);    color: #fff;    }
        40%  { transform: scale(1.14); color: #F5C130; }
        100% { transform: scale(1);    color: #fff;    }
      }

      /* Pause — the ⏸ between the two counters, and the screen behind it. See src/game/pause.js.

         Set like the counters either side of it rather than as a chip: white, with the HUD's own
         drop shadow, so the top edge reads as one row of three things instead of two numbers with
         a button parked between them. The glyph is 26px in a box 44px wide — the shape is
         HUD-sized, the target is thumb-sized. Sized *against the digits*, not to some icon
         convention: the bars stand 21px, within a pixel of the counters' own cap height at
         34px/800, because a glyph set smaller than the numbers it sits between reads as a browser
         control that wandered onto the HUD rather than as part of it.

         The box is as *tall* as the counters' line box (`--hud-count-line`), not 44px square, and
         that is what puts the ⏸ on their centre line. Three things pinned to the same `top` do not
         share a centre unless they are the same height: the counters' digits sit inside a 51px
         line box, so their cap band centres 25px down from the top, while a 44px button centres
         its glyph at 22 — the ⏸ rode 3px high for as long as the box was square, which is visible
         at this size and was reported as such. Matching the heights lands them within half a pixel
         (measured), because a line box distributes its leading evenly about the digits. Vertical
         only: the width stays 44px so the tap target keeps its size and the press dip stays round.

         Centred with `left: 0; right: 0` and auto margins, NOT `transform: translateX(-50%)`. The
         press dip below animates `transform`, and a centring translate there would be overwritten
         by it — the button would jump to the left edge of the screen for as long as it was held. */
      #pause {
        position: fixed; top: calc(18px + var(--safe-top)); left: 0; right: 0; margin: 0 auto; z-index: 24;
        width: 44px; height: var(--hud-count-line); padding: 0; border: 0; background: none;
        display: grid; place-items: center; cursor: pointer;
        /* The tap wants to land now, not after the browser has waited out a double-tap — and there
           is nothing here to select or long-press. */
        touch-action: manipulation;
        user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
        transition: transform 0.1s ease;
      }
      #pause:active { transform: scale(0.92); }
      #pause svg {
        display: block; width: 26px; height: 26px; fill: #fff;
        /* The counters' `text-shadow` in its glyph form — same offset, same blur, same colour — so
           the ⏸ holds against pale asphalt exactly as the numbers do. */
        filter: drop-shadow(0 2px 6px rgba(20, 40, 55, 0.65));
      }
      /* One button, two glyphs: it is a toggle, and while the run is held it offers the way out. */
      #pause .glyph-play { display: none; }
      body.is-paused #pause .glyph-pause { display: none; }
      body.is-paused #pause .glyph-play { display: block; }
      /* Nothing to pause on a screenshot, and once the run is over the retry pill is the only
         action on the screen — the same rule the Loco Mode pill and the ⚙️ toggle follow. */
      body.shot-mode #pause, body.game-over #pause { display: none; }

      /* The screen itself. A dim rather than a blackout: the run is being *held*, not ended, and
         seeing the city frozen underneath is what says so — the full black belongs to #run-end,
         which is the one overlay that means the run is finished.

         Under #pause (24) so the button stays lit and clickable above it, over the coach bubble
         (22) and the spotlight (21), below the run-end blackout (30) and the Home Screen screen
         (26) — both of those are gates in their own right and outrank a pause. */
      /* Every full-screen overlay carries `width: 100vw; height: 100vh` on top of `inset: 0`,
         because `inset: 0` alone stops at the layout viewport — which on an installed iOS app is
         ~34pt short of the physical bottom (see the html/body comment above). The explicit height
         wins over `bottom: 0` (an over-constrained fixed box keeps top+height), so each overlay
         reaches the same true bottom the canvas draws to; without it the blackout and the veil
         leave a strip of live city showing under themselves. */
      #pause-veil {
        position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 23;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: rgba(6, 14, 22, 0.72); color: #fff; text-align: center;
        font: 500 16px/1.5 ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
        touch-action: manipulation;
        user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
      }
      /* `display: flex` above beats the UA stylesheet's `[hidden] { display: none }`, so without
         this the veil covers the city from the first frame. Same trap as #run-end. */
      #pause-veil[hidden] { display: none; }
      body.shot-mode #pause-veil { display: none; }
      /* The run-end title's type, a size down: this is the same kind of statement — one word on
         nothing — but it is a state the player chose rather than the end of their run. */
      #pause-veil .pause-title {
        font-size: clamp(28px, 6.2vh, 46px); font-weight: 800; line-height: 1.1;
        letter-spacing: -0.01em;
      }
      /* The same yellow pill as "Play again", because it is the same kind of action: the one thing
         on the screen that puts the game back in the player's hands. */
      #pause-veil .pause-resume {
        margin-top: clamp(16px, 4vh, 34px); padding: 14px 26px; border-radius: 999px;
        cursor: pointer; border: 2px solid #16120a; background: #F5C130; color: #16120a;
        font: 800 17px/1 ui-rounded, "SF Pro Rounded", "Avenir Next", system-ui, sans-serif;
        letter-spacing: 0.02em; white-space: nowrap;
        transition: transform 0.1s ease;
      }
      #pause-veil .pause-resume:active { transform: scale(0.95); }

      /* Earnings fly off the taxi so the payout is visibly connected to the drop-off; the flight
         itself (rise, then travel to the counter) is driven from JS so it can aim at the counter's
         actual on-screen position, which changes with the viewport. */
      .earning {
        position: fixed; z-index: 25; pointer-events: none; user-select: none;
        font: 800 27px/1 ui-rounded, "SF Pro Rounded", "Avenir Next", system-ui, sans-serif;
        color: #6BE08A; text-shadow: 0 2px 10px rgba(10, 30, 20, 0.65);
        transform: translate(-50%, -50%);
      }

      /* The boost half of a drop-off's payout — see src/game/energybits.js. Small, bright and
         round, so it reads as *energy* against the flying "$20"'s green text: the two currencies
         leaving the same car have to be told apart at a glance. The light core inside the taxi
         yellow keeps it legible over both the pale asphalt and the parks. */
      .energy-bit {
        position: fixed; z-index: 25; pointer-events: none;
        width: 11px; height: 11px; border-radius: 50%;
        background: radial-gradient(circle at 40% 35%, #FFF6C9 0%, #FFD84D 45%, #F5C130 100%);
        box-shadow: 0 0 10px 2px rgba(245, 193, 48, 0.75);
        transform: translate(-50%, -50%);
      }

      /* The cut to black a skipped opening happens behind — see src/game/wipe.js. Nothing is ever
         drawn on it: it exists so the vignette can be landed, and the camera thrown across the map
         to the framing the run plays at, on a frame nobody can see.

         Above every overlay that can be up while it runs (the coach bubble at 22, the pause veil at
         23, the ⏸ itself at 24) and below the two that are gates of their own: the Home Screen
         screen at 26, which holds the vignette in `wait` and so cannot coexist with a skip, and the
         run-end blackout at 30. Opacity lives here rather than in the animation's fill, so a
         cancelled or finished wipe lands on a transparent element rather than a black one. */
      #wipe {
        position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 28;
        background: #000; opacity: 0; pointer-events: none;
      }

      /* A full-screen black mask, not a modal over the city. The dim-and-card version kept the
         frozen city legible behind a panel, and the panel's edges were the loudest thing on the
         screen — a hard blackout puts the run's numbers on nothing at all, which is what makes
         them the ending rather than an overlay on top of one. */
      #run-end {
        position: fixed; inset: 0; width: 100vw; height: 100vh;
        display: flex; flex-direction: column; align-items: center;
        /* Above every other overlay (the tweak toggle and the rider chips at 20). Without a
           z-index of its own the blackout paints *under* them, so the waiting-rider chips stayed
           lit in the bottom-left corner of the game-over screen — and a chip that is still on top
           also swallows the tap that skips the tally. */
        z-index: 30;
        background: rgba(0, 0, 0, 0.95); color: #fff; text-align: center;
        /* Centred by `margin: auto` on the card rather than by `justify-content`: if the content
           ever outgrows a short viewport, a centred flex line clips its own overflow at the *top*,
           where the title is. This way it scrolls instead. */
        overflow-y: auto;
        padding: calc(24px + var(--safe-top)) calc(16px + var(--safe-right))
                 calc(24px + var(--safe-bottom)) calc(16px + var(--safe-left));
        font: 500 16px/1.5 ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
        user-select: none;
      }
      /* `display: flex` above beats the UA stylesheet's `[hidden] { display: none }`, so without
         this the game-over overlay renders from the first frame and dims the whole game. */
      #run-end[hidden] { display: none; }

      /* The software keyboard, on the one screen that opens one. iOS does not resize the *layout*
         viewport when the keyboard comes up, so a `position: fixed; inset: 0` overlay still spans
         the whole screen and its bottom half is simply underneath the keys — scrolling the initials
         field to the centre of that box parks it behind them, which is what the bug looked like:
         a field centred on a screen whose bottom half you cannot see. `followKeyboard` (runend.js)
         measures `visualViewport` for as long as the field has focus and clamps the overlay to it,
         so `margin: auto` on the card re-centres in the band that is actually visible. Applied only
         when the two viewports genuinely disagree — Android resizes the layout viewport itself, and
         clamping on top of that would take the keyboard's height off twice. */
      #run-end.is-keyboard {
        top: var(--kb-top, 0px); bottom: auto; height: var(--kb-height, 100%);
        /* The visible band is about half a screen: 24px of gutter is most of a stat row there. */
        padding-top: 12px; padding-bottom: 12px;
        /* The blackout is the element, so clamping it also stops it painting the strip the keyboard
           is about to cover — and the clamp lands on the first `resize`, which iOS sends while the
           keys are still sliding up. A spread shadow in the same colour carries the black out past
           the clamp, so that strip is never the live city for a frame or two. Outer shadows are
           clipped to outside the border box, so it cannot double-darken what it surrounds. */
        box-shadow: 0 0 0 100vh rgba(0, 0, 0, 0.95);
      }
      /* Both gaps were doubled to spend a tall viewport's slack (see `.run-end-body` below); with
         the keyboard up there is no slack to spend, so they go back to roughly what they were
         before the doubling and the prompt fits the band without scrolling. */
      #run-end.is-keyboard .run-end-body { margin-top: clamp(12px, 3.8vh, 30px); }
      #run-end.is-keyboard .retry { margin-top: clamp(14px, 3.5vh, 28px); }

      #run-end .run-end-card {
        display: flex; flex-direction: column; align-items: center; margin: auto;
        /* No panel of its own — this only holds the content together and gives it a width to be
           measured against. Capped at a phone's content width (390px screen less the 16px gutters
           either side) so the desktop layout *is* the mobile layout: the stats rows push label and
           value to opposite edges, and on a 1280px screen that would otherwise strand a number
           three feet away from its own name. The title and reason are the exception — on a wide
           enough title neither is shy about overflowing this box, centred on the same axis; see
           `.run-end-reason`. */
        width: 100%; max-width: min(358px, 100%);
      }
      /* Type and rhythm scale with the viewport. Height drives most of it — it is a short viewport
         (a landscape phone) that runs the list past the fold — and the clamps hold the full-size
         layout down to ~560px tall, shrinking it below that so "Play again" stays above the fold
         on a 390px-high phone in landscape. The title is the loudest thing on the card on purpose —
         "Wrecked!" is the headline, and the reason underneath it is a caption, not a co-headline. */
      #run-end .run-end-title {
        font-size: clamp(32px, 7.4vh, 56px); font-weight: 800; line-height: 1.1;
        letter-spacing: -0.01em;
      }
      /* Deliberately smaller than the title and left free to wrap — `matchReasonWidth` (runend.js)
         caps its width at the title's own rendered width, and `text-wrap: balance` then picks the
         break point that leaves two even lines rather than a short orphan word. Capping at the
         title's width rather than the card's 358px is what keeps a two-line reason reading as a
         caption sitting under the headline instead of a block wider than it. */
      #run-end .run-end-reason {
        margin-top: 8px; font-size: clamp(17px, 3.6vh, 24px); opacity: 0.72; text-wrap: balance;
      }

      /* One stat per row, label pinned to the left edge and value to the right — a ledger, not a
         centred pair. Both edges are then straight lines down the block, which is what lets four
         rows of identically-styled text read as four separate stats. The label column takes the
         slack (`1fr`) so the values stay flush right however long the names get. */
      #run-end .run-end-stats {
        display: grid; grid-template-columns: 1fr auto; width: 100%;
        column-gap: clamp(12px, 2.4vh, 20px); row-gap: clamp(8px, 2.3vh, 16px);
      }
      /* The wrapper exists so the reveal can animate a stat as a unit; `display: contents` drops it
         out of the layout so its label and value are grid items of the row above, which is what
         keeps every row on the same two edges. */
      #run-end .stat { display: contents; }
      /* Label and value are deliberately the same size, weight and colour — the small grey caption
         over a big yellow number made the label look like chrome and the number like the content,
         when the pairing *is* the content. Same type for both makes each row one phrase:
         "Fares  9". */
      /* Sized against whichever axis is tighter. Height is the usual constraint for the list as a
         whole, but a side-by-side row has a width to fit too: the longest, "Shift  Early Shift",
         is the one that would run past the gutters of a 320px phone at 30px, where `nowrap` pushes
         it off the screen rather than wrapping it. */
      #run-end .stat-label,
      #run-end .stat-value {
        font-size: clamp(19px, min(3.9vh, 7.2vw), 30px); font-weight: 800; line-height: 1.15;
        color: #F5C130; white-space: nowrap;
      }
      /* Each entrance is anchored to the edge its text is aligned to — the label's fade-in from
         1.55x and the value's landing bump both grow inward, toward the slack between them, rather
         than out past the container. Scaling from the default centre made each row nudge sideways
         as it landed, and pushed the label's oversized first frame off the left edge. */
      #run-end .stat-label { text-align: left;  transform-origin: left center; }
      #run-end .stat-value { text-align: right; transform-origin: right center; }
      /* Tabular figures so a rolling counter doesn't jitter its own width as the digits change,
         and the column stays put while a row counts. */
      #run-end .stat-value { font-variant-numeric: tabular-nums; }

      /* The slot the three screens take turns in: the stats, the initials prompt and the table.
         `runend.js` locks a min-height onto it from the stats' own rendered height, so a card
         centred by `margin: auto` doesn't re-centre — and drag the title up and down the screen —
         each time a shorter screen swaps in. The margin lives here rather than on any one screen so
         all three sit at the same distance under the reason. */
      #run-end .run-end-body {
        /* Doubled from `clamp(12px, 3.8vh, 30px)`. Doubled at the *cap*, which is what governs on
           any ordinary viewport, rather than by doubling the `vh` term too: that spends the extra
           space hardest exactly where there is least of it, and it put "Play again" under the fold
           on a 390px-tall landscape phone. Measured — retry bottom 366 of 390 and the overlay
           scrolling — which is the one thing this card's clamps exist to prevent. */
        width: 100%; margin-top: clamp(14px, 5.2vh, 60px);
        display: flex; flex-direction: column; justify-content: center;
      }

      /* --- The initials prompt ------------------------------------------- */

      #run-end .score-entry { display: flex; flex-direction: column; align-items: center; }
      /* The headline of this screen — "New high score!" is the reward, so it is set at the stats'
         own weight rather than as a caption over the field. */
      #run-end .score-entry-lead {
        font-size: clamp(19px, min(3.9vh, 7.2vw), 30px); font-weight: 800; color: #F5C130;
        line-height: 1.15; white-space: nowrap;
      }
      #run-end .score-entry-hint {
        margin-top: 6px; font-size: clamp(14px, 2.6vh, 17px); font-weight: 500; opacity: 0.62;
      }

      /* Three fixed boxes with one transparent <input> stretched over them — see `buildEntry` in
         runend.js for why it is one field and not three, and why the letters are painted into spans
         rather than letter-spaced inside the input. */
      #run-end .score-slots {
        position: relative; display: flex; gap: clamp(8px, 1.8vh, 14px);
        margin-top: clamp(12px, 2.6vh, 20px);
      }
      #run-end .score-cell {
        width: clamp(42px, 8.4vh, 62px); padding-bottom: 4px;
        font-size: clamp(30px, 6.2vh, 46px); font-weight: 800; line-height: 1.1; text-align: center;
        color: #F5C130; border-bottom: 3px solid rgba(245, 193, 48, 0.3);
        /* An empty cell would collapse to zero height and the underlines would sit at three
           different heights as the name is typed. */
        min-height: 1.1em;
      }
      #run-end .score-cell.is-filled { border-bottom-color: rgba(245, 193, 48, 0.55); }
      /* The caret. The real one is hidden with the input, so the active slot's underline is what
         says where the next letter lands. */
      #run-end .score-cell.is-active {
        border-bottom-color: #F5C130; animation: score-caret 1.06s steps(1, end) infinite;
      }
      @keyframes score-caret { 0%, 50% { border-bottom-color: #F5C130; } 50.01%, 100% { border-bottom-color: rgba(245, 193, 48, 0.25); } }

      #run-end .score-input {
        position: absolute; inset: 0; width: 100%; height: 100%;
        background: none; border: 0; padding: 0; margin: 0; outline: none;
        /* Invisible, but genuinely present and focusable: the cells behind it are the display, and
           laying it over all three means a tap anywhere on them opens the keyboard. */
        opacity: 0; color: transparent; caret-color: transparent;
        /* 16px is the threshold under which iOS Safari zooms the page on focus, which on a fixed
           full-screen overlay leaves the card scrolled somewhere the player didn't put it. */
        font-size: 16px;
        text-align: center; cursor: text;
      }

      /* Secondary to "Play again": this one only confirms three letters, so it is outlined rather
         than filled, and the yellow pill stays the one action that restarts the game. */
      #run-end .score-ok {
        margin-top: clamp(14px, 3vh, 24px); padding: 10px 30px; border-radius: 999px;
        cursor: pointer; border: 2px solid #F5C130; background: none; color: #F5C130;
        font: 800 16px/1 ui-rounded, "SF Pro Rounded", "Avenir Next", system-ui, sans-serif;
        letter-spacing: 0.02em;
      }
      #run-end .score-ok:active { transform: scale(0.95); }

      /* --- The table ------------------------------------------------------ */

      #run-end .score-board { width: 100%; }
      /* Left-aligned, over the left edge of the list it heads. Centred, it floated free of a block
         whose own columns start hard against that edge, and read as a caption for the card rather
         than a label on the table. */
      #run-end .score-board-title {
        font-size: clamp(14px, 2.6vh, 17px); font-weight: 700; letter-spacing: 0.08em;
        text-transform: uppercase; opacity: 0.55; text-align: left;
        margin-bottom: clamp(8px, 2vh, 14px);
      }
      /* Same `display: contents` grid as the stats: the <li> drops out of the layout so every
         column lands on one straight edge down the block. Name takes the slack so the score stays
         flush right whatever the initials are. */
      #run-end .score-list {
        display: grid; grid-template-columns: auto 1fr auto; width: 100%;
        column-gap: clamp(10px, 2.2vh, 18px); row-gap: clamp(6px, 1.8vh, 12px);
        list-style: none; margin: 0; padding: 0;
      }
      #run-end .score-row { display: contents; }
      /* A notch under the stats' type: there are five of these rather than four, and they are a
         reference table rather than the run's own headline figures. */
      #run-end .score-row > span {
        font-size: clamp(16px, min(3.1vh, 5.6vw), 23px); font-weight: 800; line-height: 1.2;
        color: rgba(255, 255, 255, 0.82); white-space: nowrap;
      }
      /* Left, not right. With one digit in every rank for a five-row table the two edges are the
         same line anyway, and aligning left keeps the numbering against the block's own edge with
         the heading above it. */
      #run-end .score-rank { text-align: left; color: rgba(255, 255, 255, 0.4); }
      /* Explicitly left, against the rank beside it. The card centres its text, so without this the
         name floated in the middle of a `1fr` column with a gap either side of it and the row read
         as three unrelated things rather than as "1. TWA — $500". */
      #run-end .score-name { text-align: left; letter-spacing: 0.06em; }
      #run-end .score-cash { text-align: right; font-variant-numeric: tabular-nums; }
      /* The run that just ended, in the taxi's own yellow. Picked out by id rather than by rank —
         a run that ties an existing score sits below it, so matching on the number lights the
         wrong row. */
      #run-end .score-row.is-you > span { color: #F5C130; }
      #run-end .score-row.is-you .score-rank { color: rgba(245, 193, 48, 0.7); }

      /* Same yellow as the throttle's fuel gauge — the retry action reads as the primary button. */
      #run-end .retry {
        /* Doubled from `clamp(14px, 3.5vh, 28px)`, the same way as `.run-end-body` above and for
           the same reason — the two gaps are paid on the same axis and a short viewport pays both. */
        margin-top: clamp(16px, 4.9vh, 56px); padding: 14px 26px; border-radius: 999px; cursor: pointer;
        border: 2px solid #16120a; background: #F5C130; color: #16120a;
        font: 800 17px/1 ui-rounded, "SF Pro Rounded", "Avenir Next", system-ui, sans-serif;
        letter-spacing: 0.02em; white-space: nowrap;
        transition: box-shadow 0.15s ease, transform 0.1s ease;
      }
      #run-end .retry:active { transform: scale(0.95); }
      /* Disabled while the stats count themselves out — it is transparent until its entrance, and
         a pill you can click before you can see it reloads the run out from under the tally. The
         pointer has to pass *through* it while it waits: a tap there is a tap on the overlay, which
         is what skips to the end of the sequence. */
      #run-end .retry:disabled { pointer-events: none; }

      /* The Loco Mode pill and the ⚙️ tweak toggle are gameplay controls; once the run is over
         they are noise behind the retry pill. */
      body.game-over #throttle,
      body.game-over #dbg-toggle, body.game-over #dbg-panel { display: none; }

      /* --- The throttle -------------------------------------------------------
         One spring-loaded lever in the bottom-left reach zone, replacing the Loco Mode pill and the
         brake button that used to share a row across the bottom of the screen. See
         docs/gameplay.md#the-throttle for why it is a lever, and src/game/throttle.js for the
         clock behind the knob.

         The anatomy, top to bottom, is one 150px track with the rest line 60% of the way down it:
           - above the rest line, the **boost channel** — an empty pale trough that the amber fuel
             gauge fills upward from the middle. The half you push into is the half that empties.
           - below it, the **brake**, solid red and always full: it costs nothing and cannot run
             out, so there is nothing there for a gauge to say.
         The knob's travel is the track: at +1 its centre sits on the top cap, at -1 on the bottom
         one, so it overhangs each end by its own radius and the lever reads as having *ends*.

         `--throttle-neutral` is the one number the CSS and the JS both have to agree on — it is
         `THROTTLE_NEUTRAL` in game/throttle.js, and the smoke check asserts the knob at rest lands
         on the line it describes. */
      :root {
        --ctl-side: 12.5%;            /* band margin, left — also #rider-finder-stack's column */
        --throttle-w: 72px;           /* the hit box: wider than the knob, so a thumb has slack */
        --throttle-track-w: 26px;
        --throttle-h: 150px;          /* the track alone, cap to cap */
        --throttle-knob: 46px;
        --throttle-neutral: 0.6;      /* fraction of the track above the rest line — the boost half */
      }

      body.shot-mode #hud, body.shot-mode #run-end { display: none; }

      #throttle {
        position: fixed; z-index: 20;
        left: var(--ctl-side); bottom: calc(26px + var(--safe-bottom));
        width: var(--throttle-w);
        /* The knob overhangs the track by half of itself at each end, so the box is the track plus
           one whole knob. Everything that measures this control — the tutorial's third spotlight,
           the delivery sparks' target — measures the box. */
        height: calc(var(--throttle-h) + var(--throttle-knob));
        cursor: grab;
        /* Hold-to-hold, so kill the mobile long-press UI. `none` rather than `manipulation`, and
           for the reason the old pill carried it: `manipulation` only drops double-tap zoom, and a
           pan or a pinch starting here lets the browser claim the touch and fire `pointercancel`
           at a lever the player is still holding — which with pointer capture means nothing else
           arrives until they lift and press again. A thumb on this control and a second finger
           tapping a fare is a pinch as far as the browser is concerned, and that is exactly how
           this game is held. */
        touch-action: none;
        user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
        transition: transform 0.1s ease;
      }
      #throttle:active { cursor: grabbing; }
      body.shot-mode #throttle { display: none; }

      /* The track. Every child of #throttle is `pointer-events: none` for the same reason the pill's
         label was wrapped and taken out of hit-testing: iOS 15 stopped honouring
         `-webkit-user-select: none` for the magnifier and the double-tap zoom (webkit.org/b/231161)
         and both of them hit-test like everything else, so the fix is to leave them nothing to land
         on but the control itself. Combined with the `touchstart` guard in main.js, that is the
         whole of it. */
      #throttle > * { pointer-events: none; }
      .throttle-track {
        position: absolute; left: 50%; margin-left: calc(var(--throttle-track-w) / -2);
        /* Inset by the knob's radius top and bottom: the track is the knob's travel. */
        top: calc(var(--throttle-knob) / 2); height: var(--throttle-h);
        width: var(--throttle-track-w);
        border-radius: 999px; border: 2px solid #16120a;
        /* Black outline and a near-solid trough, so the lever holds its shape over pale asphalt and
           over the yellow taxi both. The alpha is the load-bearing number: the empty boost channel
           has to read as *empty*, and at 0.55 the city drove visibly through it — a window rather
           than a trough, which is the same mistake the old pill's `.is-active` fill was moved off a
           translucent wash to fix. */
        background: rgba(250, 248, 242, 0.86);
        overflow: hidden;
        transition: background-color 0.15s ease, box-shadow 0.15s ease;
      }
      /* The brake, from the rest line to the bottom cap. Solid, always full: it costs nothing to use
         and has nothing to run out of, so a gauge on it would promise a resource that isn't there.
         Brake-light red against Loco Mode's taxi yellow, so the two halves never have to be read to
         be told apart at the edge of vision — which is where this control is while the player is
         watching the road. */
      .throttle-brake {
        position: absolute; left: 0; right: 0; bottom: 0;
        top: calc(var(--throttle-neutral) * 100%);
        background: #D33A2C;
        transition: background-color 0.12s ease;
      }
      /* The fuel gauge, growing up out of the rest line. `--pct` is 0..1 straight off the boost
         meter (game/boostmeter.js), so the overshoot-and-settle the meter authors on a top-up lands
         here as the fill springing past its new mark. */
      .throttle-fuel {
        position: absolute; left: 0; right: 0;
        bottom: calc(100% - var(--throttle-neutral) * 100%);
        height: calc(var(--pct, 0.333) * var(--throttle-neutral) * 100%);
        background: linear-gradient(180deg, #FFD75A 0%, #F5C130 100%);
      }
      /* The leading edge of the fill: a soft bar riding the fuel's top, blurred so it reads as light
         spilling off the arriving fuel rather than as a hairline UI divider. Near-white core with a
         yellow bloom, not a yellow line — the fill under it is already #F5C130 and a yellow-on-
         yellow edge washes out to nothing. Fades in with the pour and out with the bounce. */
      .throttle-fuel::after {
        content: ''; position: absolute; left: -2px; right: -2px; top: -2px; height: 4px;
        border-radius: 4px;
        background: #FFFDF2;
        box-shadow: 0 0 9px 3px rgba(255, 213, 74, 0.95);
        filter: blur(1.4px);
        opacity: var(--fill, 0);
      }
      /* The knob. Positioned by its top edge off one number the JS writes: `--knob-frac` is the
         offset from the rest line as a fraction of the *whole* track, which is what makes the two
         unequal halves one coordinate (see `knobFraction` in game/throttle.js). At 0 the knob's top
         is 60% of the way down the track and its centre is on the rest line; at +0.6 (full boost)
         the top is at 0 and the knob caps the track. */
      .throttle-knob {
        position: absolute; left: 50%; margin-left: calc(var(--throttle-knob) / -2);
        top: calc((var(--throttle-neutral) - var(--knob-frac, 0)) * var(--throttle-h));
        width: var(--throttle-knob); height: var(--throttle-knob);
        border-radius: 50%;
        border: 2px solid #4a453d;
        /* A lit sphere rather than a flat disc: the offset highlight is what says "grab this" on a
           control with no label on it. */
        background: radial-gradient(circle at 38% 32%, #FFFFFF 0%, #EFEDE8 45%, #D2CEC6 100%);
        box-shadow: 0 2px 5px rgba(10, 12, 16, 0.35);
        /* No transition on `top`: the knob follows a finger, and 100ms of ease between the thumb
           and the thing under it is exactly the lag a direct-manipulation control cannot have. The
           spring back to the middle is integrated per frame in game/throttle.js instead, which is
           also why it can overshoot — a CSS ease cannot. */
        transition: transform 0.1s ease, filter 0.15s ease;
      }
      /* Held. The knob dips under the thumb, and it is a class rather than `:active` for the reason
         the pedal row's `is-held` was: this control captures the pointer, so `:active` stays pinned
         to it however far the finger travels — and here the finger is *meant* to travel. The class
         follows the lever actually being held, including when the spacebar is the one holding it,
         which `:active` cannot describe at all. */
      #throttle.is-held .throttle-knob { transform: scale(0.94); }

      /* Boosting. The trough goes solid white behind the fuel — over pale asphalt the translucent
         version reads as the same tan as the road and the gauge loses its edge — and the fill runs
         hot, amber at the top down into the ember at the bottom of the channel where the tank is
         being spent from. */
      #throttle.is-active .throttle-track {
        background: #fff;
        box-shadow: 0 0 26px rgba(255, 232, 115, 0.85);
      }
      #throttle.is-active .throttle-fuel {
        background: linear-gradient(180deg, #FFE873 0%, #F5C130 52%, #E0662B 100%);
      }
      /* Braking. Lit rather than dimmed: this is a brake *light*, and the taxi's own lamps are
         coming on out on the road at the same moment. */
      #throttle.is-braking .throttle-brake { background: #FF4B36; }
      #throttle.is-braking .throttle-track { box-shadow: 0 0 24px rgba(255, 75, 54, 0.8); }
      /* Empty tank. Nothing refills on its own, so this persists until the next drop-off tops it up
         — it has to read as "go earn it", not "wait for it". There is no `disabled` here and there
         cannot be: the lever still has a brake on it, and half a dead control is not a state. What
         says it instead is the channel standing empty above a knob that has gone grey — the one
         push on this control that now does nothing, drawn as nothing. */
      #throttle.is-empty .throttle-knob {
        background: radial-gradient(circle at 38% 32%, #DDE1E4 0%, #B7BDC1 45%, #969CA1 100%);
        border-color: #6b6f73;
      }

      /* Delivery bonus. Fuel is only ever earned, so the pour is the reward animation: the gauge
         overshoots its new mark and springs back (game/boostmeter.js), the whole lever pulses, and
         the bright edge above rides the front of the fill. `--fill` is 0..1 for "fuel is arriving"
         and `--pulse` is the throb inside it; both are written per frame by main.js, which is what
         lets the glow fade out smoothly however long the pour ran instead of snapping off when a
         fixed keyframe ends. Listed after .is-active so a top-up collected mid-boost still shows. */
      #throttle.is-filling .throttle-track {
        /* Every property here is rewritten per frame, so any transition at all smears the throb
           flat — 0.15s of ease against a 250ms period leaves almost nothing moving. */
        transition: none;
        box-shadow: 0 0 calc(14px + 26px * var(--pulse, 0)) rgba(245, 193, 48, calc(0.95 * var(--fill, 0)));
      }
      #throttle.is-filling {
        transition: none;
        /* The lever itself flutters, not just its glow — enough to catch the eye at the edge of
           vision, which is where this control is while the player is watching the road. Scaled
           about the bottom so the knob, which the thumb may be resting on, moves least. */
        transform-origin: 50% 100%;
        transform: scale(calc(1 + 0.035 * var(--pulse, 0)));
      }
      /* A control fluttering under someone who asked for less motion is exactly what they didn't
         want. The glow and the leading edge still carry the top-up; only the movement goes. */
      @media (prefers-reduced-motion: reduce) {
        #throttle.is-filling { transform: none; }
      }

      /* Rider finder — one chip per waiting fare, in a row above the Loco Mode pill, left-aligned
         to the pill's own left edge so both controls share one visual column in the bottom-centre
         reach zone. Sized to the same 49px height as Loco Mode so the two read as a matched pair;
         the row grows rightward as extra riders spawn, keeping the first chip anchored beside the
         throttle. Each chip is a circular disc with a conic-gradient ring for the fare's clock —
         same four-stage colour as the in-world timer — and a mini three.js canvas drawing the
         figure.

         It used to sit *above* the Loco Mode pill, in the same column. The throttle is 196px tall
         and stands in that column now, so the row moved to the lever's right on the same baseline:
         still one reach zone, still the first chip anchored to a control's edge, and nothing under
         a thumb that is on the lever. */
      #rider-finder-stack {
        position: fixed; z-index: 20;
        left: calc(var(--ctl-side) + var(--throttle-w) + 14px);
        bottom: calc(26px + var(--safe-bottom));
        display: flex; flex-direction: row; align-items: center; gap: 8px;
        pointer-events: none;
      }
      body.shot-mode #rider-finder-stack { display: none; }

      .rider-finder-chip {
        position: relative;
        width: 49px; height: 49px; padding: 0; border: 0; border-radius: 50%;
        cursor: pointer; background: transparent; pointer-events: auto;
        display: grid; place-items: center;
        transition: transform 0.1s ease;
        /* Kill the mobile double-tap-to-zoom and its 300ms click delay: a tap here dispatches
           the taxi and wants to land now, not after the browser has waited to see whether a
           second one is coming. Also suppress the long-press callout and text selection since
           neither has anything to sell on a bare figure canvas. */
        touch-action: manipulation;
        user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
      }
      .rider-finder-chip:active { transform: scale(0.95); }
      .rider-finder-chip[hidden] { display: none; }
      /* Ring: an annulus painted with the fare colour, filling counter-clockwise as the clock
         drains — same reading as the in-world timer. `--pct` and `--ring-color` come from the
         update loop. Widths scaled from the original 72px chip by 49/72 so the ring/chip ratio
         stays the same at the smaller size. */
      .rider-finder-chip::before {
        content: ''; position: absolute; inset: 0; border-radius: 50%;
        background:
          conic-gradient(from -90deg, var(--ring-color, #26E05A) var(--pct, 100%),
                                      rgba(255, 255, 255, 0.15) 0);
        padding: 3px;
        -webkit-mask: radial-gradient(circle, transparent 55%, #000 56%);
                mask: radial-gradient(circle, transparent 55%, #000 56%);
      }
      /* The dark chip the figure stands in front of. */
      .rider-finder-chip .chip {
        position: relative; width: 38px; height: 38px; border-radius: 50%;
        background: rgba(24, 44, 58, 0.72);
        display: grid; place-items: center; overflow: hidden;
      }
      .rider-finder-chip canvas { display: block; width: 38px; height: 38px; }

      /* Taxi finder — the chip that comes up when the player's own car has gone off-frame, at the
         opposite end of the bottom row from the rider chips. See src/game/taxifinder.js for when it
         is up; a tap rides the camera back to the taxi.

         Mirrored on the rider row's own geometry — 49px, the same distance up, and inset 12.5% from
         its own edge, which is the edge of the Loco Mode pill — so the two bottom corners read as a
         matched pair either side of it. One is "who is waiting", the other is "where am I".

         **A disc and nothing else.** No ring: a rider chip's ring is a clock, and the taxi has none
         — it is not going anywhere and nothing about it expires. So the ring's 49px outer diameter
         becomes the disc itself, which is what keeps the two chips the same weight on screen even
         though only one of them is a dial.

         The entrance is on the standalone `scale` property, NOT a transform, for the same reason
         the HUD's own entrance uses `translate`: the press dip below animates `transform`, and two
         rules competing for that property would mean whichever landed last silently killed the
         other. `scale` composes with `transform` instead. */
      #taxi-finder {
        position: fixed; right: 12.5%; bottom: calc(95px + var(--safe-bottom)); z-index: 20;
        width: 49px; height: 49px; padding: 0; border: 0; border-radius: 50%;
        display: grid; place-items: center; cursor: pointer; overflow: hidden;
        background: rgba(24, 44, 58, 0.72);
        /* Same as the rider chips: a tap here moves the camera and wants to land now, not after
           the browser has waited out a double-tap, and there is nothing on a bare car canvas for a
           long press to select. */
        touch-action: manipulation;
        user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
        /* Down by default. `pointer-events: none` matters as much as the opacity does — an
           invisible chip that still takes the tap aimed at the city behind it is worse than a
           visible one. */
        opacity: 0; scale: 0.6; pointer-events: none;
        transition: opacity 0.22s ease, scale 0.3s cubic-bezier(0.22, 1, 0.36, 1),
                    transform 0.1s ease;
      }
      #taxi-finder.is-on { opacity: 1; scale: 1; pointer-events: auto; }
      #taxi-finder.is-on:active { transform: scale(0.95); }
      #taxi-finder canvas { display: block; width: 44px; height: 44px; }
      /* It still arrives and still leaves; it just stops springing to do it. */
      @media (prefers-reduced-motion: reduce) {
        #taxi-finder, #taxi-finder.is-on { scale: 1; transition: opacity 0.22s ease; }
      }
      /* Nothing to go back to once the run is over, and a screenshot frames itself. */
      body.shot-mode #taxi-finder, body.game-over #taxi-finder { display: none; }

      /* Off-screen fare pointers. Arrows that clamp to the viewport edge and rotate to point at a
         fare that has slipped off the frame (portrait, or after panning). Two kinds, same arrow:
         the drop-off ring while a fare is aboard, and every rider still waiting on a kerb.

         The rider arrows replaced the rider-finder chips: a chip answered "where is the next fare,
         how urgent, and shall I take it" in one tap without the player ever looking at the city,
         and the arrow deliberately only answers the first two. See src/game/farepointers.js.

         The colour is written from JS rather than set here: each arrow stands in for a mark that is
         painted in its rider's clock, so it has to step with it. The value below is only what one
         opens on before its first colour write. */
      .fare-pointer {
        position: fixed; left: 50%; top: 50%; z-index: 18;
        width: 28px; height: 28px; pointer-events: none; user-select: none;
        transform: translate(-50%, -50%);
        color: #3ECF5A;   /* PALETTE.urgency[4] — a full clock */
      }
      /* The trip actually under way, drawn a size up: while carrying, several arrows can be on the
         edge at once and colour is already spoken for by the clocks. */
      .fare-pointer.is-dropoff { width: 34px; height: 34px; }
      .fare-pointer[hidden] { display: none; }
      .fare-pointer svg { display: block; width: 100%; height: 100%;
        filter: drop-shadow(0 2px 4px rgba(10, 20, 30, 0.45)); }
      /* Outlined to the same weight as the markers in the world, so an arrow reads as the same
         graphic vocabulary. `currentColor` is what lets one style write on the wrapper repaint it
         as the fare's clock drains. */
      .fare-pointer polygon {
        fill: currentColor;
        stroke: #0a1615; stroke-width: 3; stroke-linejoin: round;
      }
      body.shot-mode .fare-pointer, body.game-over .fare-pointer { display: none; }

      /* --- the off-screen police warning -------------------------------------
         Red and blue washing in over the frame edge the cruiser is coming from, strobing in step
         with its own light bar. See src/game/sirenglow.js for when it is up and why it is armed off
         exactly the same flag the bar is.

         Everything that moves arrives as a custom property: --siren-x/--siren-y are where the
         cruiser crosses the frame edge, --siren-r is the bloom's radius (sized against the
         viewport, since this is light spilling past the edge of the *frame*), and --siren-red /
         --siren-blue are the two alphas the strobe alternates between. Centring the gradient *on*
         the edge is what gives a side approach half a bloom and a corner a quarter, with no
         per-side special cases.

         `screen` rather than plain alpha: an emergency light adds, it doesn't tint, and over a
         daylit city an alpha red reads as a muddy filter rather than as a lamp. It costs a
         full-frame blend, which is why sirenglow.js keeps the element `hidden` outright whenever
         the wash is off — a siren is up for a few seconds a minute.

         Under the HUD (z-index 8, over the canvas and below everything else): this is light in the
         world, and washing it across the money counter would read as a UI effect. */
      #siren-glow {
        position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 8;
        pointer-events: none; user-select: none;
        mix-blend-mode: screen;
        background:
          /* PALETTE.lightRed #E24B3C */
          radial-gradient(circle var(--siren-r, 200px) at var(--siren-x, 50%) var(--siren-y, 50%),
            rgba(226, 75, 60, var(--siren-red, 0)) 0%,
            rgba(226, 75, 60, calc(var(--siren-red, 0) * 0.45)) 45%,
            rgba(226, 75, 60, 0) 100%),
          /* PALETTE.sirenBlue #4D9BFF */
          radial-gradient(circle var(--siren-r, 200px) at var(--siren-x, 50%) var(--siren-y, 50%),
            rgba(77, 155, 255, var(--siren-blue, 0)) 0%,
            rgba(77, 155, 255, calc(var(--siren-blue, 0) * 0.45)) 45%,
            rgba(77, 155, 255, 0) 100%);
      }
      #siren-glow[hidden] { display: none; }
      /* A wash over the edge of every frame would be the loudest thing in a screenshot, and the
         run-end card is not a moment to still be warning about traffic. */
      body.shot-mode #siren-glow, body.game-over #siren-glow { display: none; }

      /* --- coach bubble ---------------------------------------------------
         The opening tutorial: a speech bubble from the taxi itself, bottom centre, with the car
         turning slowly in a round avatar and the line typing itself out. Two beats, and that is
         the whole tutorial — "this car is you", then "tap that rider". See src/game/tutorial.js.

         Not `#tip`/`#intro`/`#banner`: those all sit on ad-blocker filter lists, and one match
         takes the module graph down with ERR_BLOCKED_BY_CLIENT. Same reason #run-end isn't
         #banner. */
      /* Stretched edge to edge and centred with flex, NOT `left: 50%` + a translate. A fixed
         element is shrink-to-fit, and `left: 50%` leaves it a containing block only half the
         viewport wide — so on a 390px phone the bubble was capped at 195px and the line wrapped
         into four, while the same markup looked right on a desktop. The max-width below is the
         only thing that should be setting this bubble's width. */
      #coach {
        position: fixed; left: 0; right: 0; bottom: calc(104px + var(--safe-bottom)); z-index: 22;
        display: flex; justify-content: center;
        /* Clear of the Loco Mode pill (26px up, 49px tall) with room for the bubble's tail, so the
           only control on screen while this is up isn't underneath it. The rider-finder chips
           would still collide, so they are hidden outright — see body.coach-open below. */
        pointer-events: none; user-select: none; -webkit-user-select: none;
      }
      #coach[hidden] { display: none; }
      /* The third beat is about a control rather than about something in the city, so it sits
         directly over that control with its tail pointing down at it, left-aligned to the
         throttle's own column and clear of its top edge — 26px of gutter, the lever's own height,
         and 12px of air. The other two hang centred with the tail up, because what they are
         talking about is up there. */
      #coach.at-boost {
        bottom: calc(38px + var(--throttle-h) + var(--throttle-knob) + var(--safe-bottom));
        justify-content: flex-start; padding-left: var(--ctl-side);
      }
      /* Grows up out of the tail, which is now underneath it. */
      #coach.at-boost .coach-bubble {
        transform-origin: 45px 100%;
        transform: scale(0.8) translateY(10px);
      }
      #coach.at-boost .coach-bubble::after {
        top: 100%; bottom: auto;
        /* Half the lever's width, so the tail comes down on the track itself. Unlike the old pill
           — whose width followed its label, leaving the left edge as the only thing the two boxes
           shared — the throttle is a fixed 72px and its middle is a real place. */
        left: calc(var(--throttle-w) / 2);
        border-bottom: 0; border-top: 12px solid #FFFDF7;
      }
      #coach.at-boost.is-open .coach-bubble { transform: scale(1) translateY(0); }
      #coach.at-boost.is-closing .coach-bubble { transform: scale(0.9) translateY(4px); }
      @media (prefers-reduced-motion: reduce) {
        #coach.at-boost .coach-bubble,
        #coach.at-boost.is-open .coach-bubble,
        #coach.at-boost.is-closing .coach-bubble { transform: none; }
      }
      /* Never over a screenshot, and never over the retry screen: the run is the thing then. */
      body.shot-mode #coach, body.game-over #coach { display: none; }
      /* One tap target at a time. The chips are a second way to pick the rider the bubble is
         pointing at, and in step two the whole lesson is the tap landing on the figure in the
         city — plus a centred bubble and a bottom-left chip column overlap on a phone. The taxi
         finder goes with them: the tutorial is holding the camera itself for both of the beats
         that gate, and the third one is a bubble pointing at the pill beside it. */
      body.coach-open #rider-finder-stack, body.coach-open #taxi-finder { display: none; }

      .coach-bubble {
        position: relative; display: flex; align-items: center; gap: 10px;
        max-width: min(300px, calc(100vw - 32px));
        padding: 11px 20px 11px 11px; border-radius: 22px;
        /* No outline. The rest of the game's UI is black-lined because it sits over the city and
           has to hold its shape against pale asphalt; this sits over a spotlight that has already
           darkened everything behind it, so the line only made it heavier. The shadow carries the
           edge instead. */
        border: 0; background: #FFFDF7; color: #16120a;
        font: 700 15px/1.35 ui-rounded, "SF Pro Rounded", "Avenir Next", system-ui, sans-serif;
        text-align: left; box-shadow: 0 10px 28px rgba(8, 20, 30, 0.4);
        cursor: pointer; pointer-events: auto;
        /* Tap-to-advance wants to land now, not after the browser has waited out a double-tap. */
        touch-action: manipulation; -webkit-touch-callout: none;
        /* Grows out of its own tail rather than its middle, so the pop reads as the taxi speaking
           rather than as a panel expanding. The tail is on top — it points up at the taxi (or the
           rider) the bubble is talking about, which is always above it on screen. */
        transform-origin: 38px 0;
        opacity: 0; transform: scale(0.8) translateY(-10px);
        transition: opacity 0.18s ease, transform 0.26s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      #coach.is-open .coach-bubble { opacity: 1; transform: scale(1) translateY(0); }
      /* Scale down and fade out, per the dismissal. Faster than the entrance and without the
         overshoot — a bounce on the way out reads as the bubble refusing to leave. */
      #coach.is-closing .coach-bubble {
        opacity: 0; transform: scale(0.9) translateY(-4px);
        transition: opacity 0.2s ease, transform 0.2s ease;
      }

      /* The tail, on top and centred over the avatar. One triangle now that the outline is gone. */
      .coach-bubble::after {
        content: ''; position: absolute; left: 29px; bottom: 100%; width: 0; height: 0;
        border-left: 9px solid transparent; border-right: 9px solid transparent;
        border-bottom: 12px solid #FFFDF7;
      }

      /* The avatar: the player's own taxi, turning. It is the whole of lesson one — a picture of
         the car doing the talking says "that yellow thing down there is you" faster than any
         sentence about it. No disc and no ring behind it: the car is lit by the game's own sun
         (see tutorial.js) and sits straight on the bubble, so it reads as the actual vehicle
         rather than as an icon of one. */
      .coach-avatar { flex: none; width: 54px; height: 54px; }
      .coach-avatar canvas { display: block; width: 100%; height: 100%; }

      /* The line types itself out. Both spans stack: the ghost holds the *finished* text at zero
         visibility purely to reserve the bubble's size, and the typed copy is painted over it —
         otherwise every character that wraps a line resizes a bottom-anchored, centre-aligned
         bubble, and the thing you are trying to read wobbles under the words. */
      .coach-text { position: relative; display: block; }
      .coach-ghost { visibility: hidden; }
      .coach-typed { position: absolute; inset: 0; }

      /* A bubble that springs and a line that types are both motion for its own sake. Under
         reduced motion the bubble fades in place and tutorial.js prints the line whole. */
      @media (prefers-reduced-motion: reduce) {
        .coach-bubble,
        #coach.is-open .coach-bubble,
        #coach.is-closing .coach-bubble { transform: none; transition: opacity 0.2s ease; }
      }

      /* The spotlight. Darkens the whole city except a soft pool around whatever the bubble is
         talking about — the taxi on the first beat, the rider on the second. It is what actually
         answers "which one is mine": the bubble can say it, but only this points at it.

         A radial gradient rather than a real light. A three.js SpotLight would mean darkening the
         scene's own sun and re-lighting one patch of a city built for a single global key, which
         is a rendering change to teach a two-sentence lesson. This costs one composited div.

         Position and both radii are written per frame from tutorial.js: --sx/--sy are the subject's
         projected screen position and --r0/--r1 are sized against the camera, since 1 world unit is
         only ~7.7px at play zoom and a pool measured in pixels would be a different size on every
         viewport. Under #coach (22) so the bubble stays lit, over everything else. */
      /* Two layers, both centred on the same point. The warm core is what makes it read as a beam
         rather than as a hole cut in a dark sheet — the darkening alone left the subject merely
         *not dimmed*, which at this contrast is not the same as lit. It dies by --r0 so it only
         ever touches the clear centre and never washes out the falloff. */
      #spotlight {
        position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 21; pointer-events: none;
        opacity: 0; transition: opacity 0.45s ease;
        background:
          radial-gradient(circle at var(--sx, 50%) var(--sy, 50%),
            rgba(255, 238, 198, 0.15) 0,
            rgba(255, 238, 198, 0) var(--r0, 60px)),
          radial-gradient(circle at var(--sx, 50%) var(--sy, 50%),
            rgba(6, 14, 22, 0) 0,
            rgba(6, 14, 22, 0) var(--r0, 60px),
            rgba(6, 14, 22, 0.78) var(--r1, 150px),
            rgba(6, 14, 22, 0.78) 100%);
      }
      body.spotlight-on #spotlight { opacity: 1; }
      body.shot-mode #spotlight, body.game-over #spotlight { display: none; }

      /* --- the HUD's entrance ------------------------------------------------
         Everything the player will need but cannot use yet starts off its own screen edge, and
         slides in once the tutorial has had its say. A run used to open with the full HUD already
         lit — a money counter, a streak counter and a Loco Mode dial, all reading zero, all of them
         answering questions nobody has asked yet. The tutorial is two sentences long; the
         instruments can wait for it.

         The offset is the standalone `translate` property, NOT a transform. Three of these four
         elements already animate their own transform — the money bump, the streak bump, the Loco
         Mode press dip and its top-up flutter — and a `body.hud-ready #throttle { transform: none }`
         would outrank the flutter on specificity and quietly kill it for the rest of the run.
         `translate` composes with `transform` instead of competing with it.

         main.js adds `hud-ready`: the moment the last bubble is dismissed, or immediately when
         there is no tutorial (`?tutorial=off`, shot mode). */
      #hud, #streak, #pause, #throttle, #rider-finder-stack {
        opacity: 0;
        transition: opacity 0.45s ease, translate 0.55s cubic-bezier(0.22, 1, 0.36, 1);
      }
      #hud, #streak, #pause { translate: 0 -160%; }
      #throttle, #rider-finder-stack { translate: 0 200%; }
      /* Invisible is not un-tappable: a 0-opacity pill still takes the tap that was aimed at the
         rider behind it. (#hud and #streak are already pointer-events: none.) The pause button
         rides in the same group for the same reason it waits at all: there is nothing to pause
         while the tutorial is still holding the clocks. */
      body:not(.hud-ready) #pause, body:not(.hud-ready) #throttle,
      body:not(.hud-ready) #rider-finder-stack { pointer-events: none; }
      body.hud-ready #hud, body.hud-ready #streak, body.hud-ready #pause,
      body.hud-ready #throttle,
      body.hud-ready #rider-finder-stack { opacity: 1; translate: 0 0; }
      /* Staggered, top corners first then the bottom ones, so four elements arriving at once read
         as a HUD assembling rather than as a single fade. */
      /* The third beat's other half: the lever pulses while the bubble talks about it, so the text
         is not the only thing saying which control it means.

         Box-shadow on the *track*, and nothing else. A keyframe outranks every ordinary rule on the
         element it runs on, so a pulse that scaled would silently kill the top-up flutter for as
         long as it ran — and putting it on the track rather than on #throttle keeps it off the
         property the flutter uses at all. It does outrank the track's own `is-active` glow, which
         is fine and unreachable: the beat fires two seconds after a drop-off, and the bubble is
         asking for a boost that has not happened yet. */
      @keyframes coach-boost-pulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(245, 193, 48, 0.5); }
        50%      { box-shadow: 0 0 26px 7px rgba(245, 193, 48, 0.95); }
      }
      body.coach-boost #throttle .throttle-track { animation: coach-boost-pulse 1.3s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        body.coach-boost #throttle .throttle-track {
          animation: none; box-shadow: 0 0 22px 5px rgba(245, 193, 48, 0.85);
        }
      }

      /* The pause button lands with the streak counter rather than after it: the two of them are the
         rest of the same top edge, and staggering a row of three left-to-right would read as the
         HUD dealing itself out rather than arriving. */
      body.hud-ready #streak, body.hud-ready #pause { transition-delay: 0.07s; }
      body.hud-ready #throttle { transition-delay: 0.14s; }
      body.hud-ready #rider-finder-stack { transition-delay: 0.21s; }
      @media (prefers-reduced-motion: reduce) {
        #hud, #streak, #pause, #throttle, #rider-finder-stack { translate: none; }
      }

      /* --- "Add to Home Screen" screen — see src/game/homescreen.js -------------
         iOS in a browser tab only, where there is no install affordance to point at and the
         disappearing bottom toolbar resizes the viewport mid-run.

         It does not hide the city, it *sinks* it: the gradient is fully transparent at the top, so
         the skyline and the two HUD counters stay readable, and reaches solid black by the time the
         text starts. Reading the game through it is what says the screen is a step on the way in
         rather than a different place — and it means the black behind the list is genuinely black,
         with no skyline competing with the one thing the player has to read. */
      #home-tip {
        position: fixed; inset: 0; width: 100vw; height: 100vh;
        /* Above the flying earnings (25), below the run-end blackout (30) — a run that somehow
           ended behind this should still show its own screen on top. */
        z-index: 26;
        display: flex; flex-direction: column; justify-content: flex-end;
        background: linear-gradient(to bottom,
          rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.1) 20%, rgba(0, 0, 0, 0.45) 42%,
          rgba(0, 0, 0, 0.88) 55%, #000 63%);
        color: #fff;
        font-family: ui-rounded, "SF Pro Rounded", "Avenir Next", system-ui, sans-serif;
        /* The whole thing is the dismiss target, as the hint says. No long-press callout, no
           double-tap zoom pause between the press and the game starting. */
        cursor: pointer; touch-action: manipulation;
        user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
      }
      #home-tip[hidden] { display: none; }
      body.shot-mode #home-tip, body.game-over #home-tip { display: none; }

      /* Bottom-anchored, and the bottom inset clears the home indicator on a notched phone. The
         gutter is a share of the width rather than a fixed pixel count so the block sits the same
         distance in on a 320px phone as on a 430px one.

         **One size drives the whole block.** The steps are 1em and every other size and gap is a
         ratio of them, so the block scales as a unit — and so the fit-to-width pass in
         homescreen.js has exactly one knob to turn. It is clamped against *both* axes: width is
         what the long third step has to fit across, height is what the whole block has to fit down
         (a landscape phone is 390px tall, and 7.2vw of an 844px-wide viewport would be 60px type on
         a screen with no room for it). Same technique as the run-end stats, for the same reason. */
      #home-tip .home-tip-sheet {
        font-size: clamp(18px, min(7.2vw, 5vh), 30px);
        padding-left: clamp(20px, 7.5vw, 46px);
        padding-right: clamp(20px, 7.5vw, 46px);
        padding-bottom: calc(1em + var(--safe-bottom));
      }

      #home-tip .home-tip-lead {
        font-size: 0.87em; font-weight: 600; line-height: 1.25;
        /* Never wraps: it is one phrase, and a two-line lead pushes the list down the screen and
           stops the block reading as a heading over a list. The fit pass keeps it honest. */
        white-space: nowrap;
        /* A shade under the steps' white: it is the sentence *introducing* the list, and setting
           both at full strength made the colon read as another step. */
        color: rgba(255, 255, 255, 0.92);
      }

      /* Two columns — the numbers on one straight edge, the labels on another. `display: contents`
         on the items drops them out of the layout so each `li`'s two spans become grid items of the
         same row, which is what holds both edges straight however wide the labels get. (The run-end
         stats use the same trick for the same reason.)

         Margins in `em` of the steps rather than of the neighbours, so the vertical rhythm is a
         property of the one size above: both gaps sit on this element, because an `em` margin on
         the hint would resolve against the hint's own smaller size and quietly halve itself. */
      #home-tip .home-tip-steps {
        list-style: none; display: grid; grid-template-columns: auto 1fr;
        column-gap: 0.4em; row-gap: 0.85em; margin: 0.95em 0 0.9em;
        font-weight: 800; line-height: 1.15;
      }
      #home-tip .home-tip-steps li { display: contents; }
      /* Tabular figures so 1./2./3. are all the same width and the labels start on one edge even
           though the numbers are set in the same heavy weight as the words. */
      #home-tip .home-tip-steps .step-index { font-variant-numeric: tabular-nums; }
      /* The longest label — "Add to Home Screen" — is what sets the type size on a narrow phone;
         letting it wrap under its own number instead would break the second edge the grid exists
         to hold. */
      #home-tip .home-tip-steps .step-name { white-space: nowrap; }

      /* Sized and positioned in `em` so each glyph tracks the line it sits on. Drawn as strokes,
         a step down from the label's white — it stands for a control on the browser's chrome, not
         for another word in the sentence. */
      #home-tip .home-tip-steps svg {
        width: 1.05em; height: 1.05em; vertical-align: -0.19em; margin-left: 0.24em;
        fill: none; stroke: currentColor; stroke-width: 1.7;
        stroke-linecap: round; stroke-linejoin: round;
        color: rgba(255, 255, 255, 0.62);
      }
      /* The dots inside Chrome's ⋯ ring are solid and brighter than the ring itself — that is how
         the button actually reads at a glance. */
