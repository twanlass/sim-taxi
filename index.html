<!doctype html>
<html lang="en" class="booting">
  <head>
    <meta charset="UTF-8" />
    <!-- `maximum-scale=1, user-scalable=no` is for the iOS app. Its shell turns off the scroll
         view's pinch recogniser, but WebKit still zooms the page on its own — double-tap and
         zoom-to-focused-element do not go through that recogniser — and with pinch gone the
         player has no gesture to zoom back out: tapping Settings on the pause screen left the
         whole game stuck at ~1.5x, rows running off the right edge, until the app was killed.
         WKWebView honours these limits (`ignoresViewportScaleLimits` defaults to false), so the
         page cannot leave scale 1 at all. Safari ignores `user-scalable=no` since iOS 10, so on
         the web a deliberate pinch still works; `maximum-scale=1` there only stops focus zoom. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Rocket Rides 🚕</title>
    <!-- Home-screen icon. iOS's mask is round-cornered, so the artwork is centred with a purple
         border that the mask crops into. Every size is rendered from the game's own taxi by
         `node tools/make-icon.mjs` — regenerate them together, and bump CACHE_NAME in sw.js. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/apple-touch-icon-512.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Rocket Rides" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Chrome's spelling of the tag above; Chrome 117+ ignores the `apple-` one on its own. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- `black-translucent` is the only status-bar style that lets the canvas draw under the top
         bar. It was reverted once for capping the document short of the true bottom of the screen
         — by more than `env(safe-area-inset-bottom)` accounted for, and no canvas-sizing trick
         could move it (confirmed by turning `document.body` red and watching only that strip
         change colour). That measurement was taken without `viewport-fit=cover` on the viewport
         meta above, and `cover` is the whole story: without it iOS spends the notch and
         home-indicator insets *itself*, by shrinking the layout viewport — which is exactly the
         short bottom — and `env(safe-area-inset-*)` reads 0 because the UA has already applied
         the inset, which is why no padding could account for it. With `cover` the top underlaps
         for real and the insets report their values — but the *bottom* stays short even then
         (measured on-device: a strip of bare sky under the canvas): in standalone mode the layout
         viewport, `window.innerHeight` and percentage heights all stop ~34pt above the physical
         bottom. `100vh` is the one length that reaches it, which is why html/body and every
         `inset: 0` overlay below carry it and the canvas is sized through util/viewport.js. The
         `--safe-*` maths keeps the HUD out from under the hardware at both ends. (The tag is
         deprecated in favour of the manifest, but the manifest has no translucent option — this
         is still the only way in.) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#A46BFF" />
    <!-- Space Grotesk, the game's one face, served from this bundle rather than from Google: the
         iOS build is offline and the web build's service worker should not depend on a third
         party either. A stylesheet rather than an inline @font-face so Vite fingerprints the
         .woff2 files it names. -->
    <link rel="stylesheet" href="/src/fonts.css" />
    <style>
      :root { color-scheme: light; }
      /* The screen's own hardware: status bar / Dynamic Island up top, home indicator below, and
         whichever of them the notch becomes in landscape. All four resolve to 0px wherever they
         don't exist — including any context without `viewport-fit=cover` — so every `calc()`
         below degrades to its old constant. Held in variables rather than written as bare `env()`
         at each site because `env()` is CSS-only: the drop-off arrow clamps its position in JS
         (game/dropoffindicator.js) and reads these off the root instead. */
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
      }
      /* `touch-action` does *not* inherit, which is why it is on `*` and not on `html, body` next
         to the selection properties below. Set it on the root alone and every control the player
         actually presses computes `auto` again and keeps its double-tap zoom — which is how the
         rider-finder row went on zooming the city long after the pill and the ⏸ had each opted
         out by hand. `manipulation` is `auto` minus the double-tap, so panning and pinch-to-zoom
         (the deliberate, accessible kind) both survive. The elements that need the stronger
         `none` — the canvas, the Loco Mode pill — still say so below and win on specificity, `*`
         having none at all. */
      * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
      /* Nothing on this page is prose to be read — it's a surface you tap and drag on. Without
         these, a long press anywhere on iOS still finds *something* selectable (the callout hunts
         past the canvas for the nearest text node) and pops the Copy / Look Up / Translate
         toolbar across the middle of the city, which then swallows the next tap that should have
         routed the taxi. Both properties inherit, so the root covers every overlay — the
         `user-select: none` declarations further down are belt and braces on the elements most
         likely to be pressed. The `-webkit-` prefixes still earn their place: iOS Safari only
         took unprefixed `user-select` in 17, and `-webkit-touch-callout` has no standard
         equivalent at all. */
      /* `100vh`, NOT `height: 100%`. On an installed iOS app (`black-translucent` +
         `viewport-fit=cover`) the percentage resolves against a layout viewport that stops ~34pt
         short of the physical bottom — the home-indicator zone — while `100vh` resolves to the
         full screen, and is the one length that is right from a cold start (`100dvh` reads the
         short value until the phone has been rotated once). The canvas is sized by the same rule
         in JS — see util/viewport.js. Everywhere else the two spellings agree exactly. */
      html, body {
        width: 100vw; height: 100vh; overflow: hidden; background: #dcedf7;
        user-select: none; -webkit-user-select: none;
        -webkit-touch-callout: none;
        /* No grey flash under a tap either — every control here has its own :active state. */
        -webkit-tap-highlight-color: transparent;
      }
      /* Black until the game has drawn. A cold start used to show the page's sky here — the
         `#dcedf7` above, which is PALETTE.skyBottom so a canvas emptied by a resize mid-run blinks
         to sky rather than to some other colour — for as long as the game took to load, and it
         read as a broken blue screen. `booting` is on the root from the first byte, so the first
         frame is black, the same `splashVoid` black as the iOS launch screen and the web view
         behind the page; game/splash.js (or src/boot.js, without the startup screen) takes it off
         once the city is on screen, and the sky underlay is back for the rest of the session. */
      html.booting, html.booting body { background: #000; }
      /* `?backdrop` (game/backdrop.js): the marketing site's frame. The city canvas and nothing else,
         and no input — the site's page is what takes the taps. */
      html.backdrop body > :not(.city-canvas) { display: none !important; }
      html.backdrop, html.backdrop * { pointer-events: none !important; }
      /* The startup screen (game/splash.js): over everything, the menu included, until it fades. */
      #splash {
        position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 100;
        background: #000; touch-action: none;
      }
      body.shot-mode #splash { display: none; }
      /* The one exception: the debug panel's JSON dump exists to be selected and copied when the
         clipboard API refuses, and an inherited `user-select: none` would leave nothing to drag
         over. Sliders and colour wells come along for the ride harmlessly. */
      input, textarea { user-select: text; -webkit-user-select: text; }
      canvas { display: block; touch-action: none; cursor: pointer; }

      /* The top row, in one place: the boost meter on the left, the cash total on the right, both
         pinned to the same `top` and the same `--hud-row` height so they share a centre line.
         Sized off the Figma frame (Taxi 🚕, "Frame 10"), which is drawn 603 wide for a 393pt
         phone — so every number in the file is ×0.652 here: the 52px total is 34px, the 40px side
         margin is 26px, the 56px bolt is 36px. The type is Inter Black in the file; this is the
         system face at 900 instead, which is SF Pro on the phones this ships to and near enough to
         Inter that loading a web font for four digits isn't worth an offline asset.

         That last call was overtaken by the face changing: the whole game is set in Space Grotesk
         now, self-hosted from assets/fonts/ (src/fonts.css), so `--game-font` is the one stack
         every player-facing surface reads. The ⚙️ panel and the ?audio panel keep the system face
         on purpose — they are tools, not the game. Space Grotesk's axis stops at 700, so every
         800/900 below lands on its bold. */
      :root {
        --hud-count-size: 34px;
        --hud-row: 41px;
        --hud-top: calc(13px + var(--safe-top));
        --hud-side: 26px;
        --game-font: "Space Grotesk", system-ui, -apple-system, "Helvetica Neue", sans-serif;
        --hud-font: var(--game-font);
        --hud-shadow: 0 2px 2px rgba(0, 0, 0, 0.25);
      }

      /* Spans the top row edge to edge, inset the same both sides, so its middle is the screen's
         and the run tags can sit there while still riding #hud's slide in and out (a fixed child
         of a translated parent is placed against the parent, not the viewport). */
      #hud {
        position: fixed; z-index: 20; top: var(--hud-top); right: calc(var(--hud-side) + var(--safe-right));
        left: calc(var(--hud-side) + var(--safe-left));
        display: flex; flex-direction: column; align-items: flex-start;
        font: 900 14px/1.2 var(--hud-font);
        color: #fff; text-shadow: var(--hud-shadow);
        pointer-events: none; user-select: none;
      }
      #hud .money {
        font-size: var(--hud-count-size); line-height: var(--hud-row);
        letter-spacing: 0.05em; font-variant-numeric: tabular-nums;
        display: inline-block; transform-origin: left center;
      }

      /* Loco Mode's fuel, read out as a gauge arc hugging the top of the round gas button — a
         tachometer over the control that spends it, so a thumb holding the gas can watch the tank
         go without looking away to a corner. The arc runs from just under the button's centre on
         the left, up over the top, and down to the same height on the right; fuel fills from the
         left end, so burning it sweeps the front back from the right, over the top, and down to the
         left.
         It is a read-out only — the pedal is the control, and nothing here hit-tests.

         The shape is game/fuelarc.js, not markup: the band used to taper, and a stroke cannot, so
         both the track and the fuel are filled
         outlines that main.js writes into the two paths' `d` — the track once, the fuel whenever
         the level moves. The box is #boost's box and the viewBox is the button's, so the gauge and
         the button are drawn in one coordinate system.

         Everything the pedal's old dial did, this does too, off the same three variables
         (`updateBoostButton` in main.js sets them on both): `--pct` is the level, `--fill` is the
         "fuel is arriving" envelope, `--pulse` is the throb inside it. The classes mirror the
         pedal's — `is-active`, `is-empty`, `is-charging`, `is-filling`.

         The glow is a `drop-shadow` on the <svg>, which follows the shapes. The gradient runs
         across the whole arc in user space, not along the fuel, so a colour means a level —
         orange is always the top of the tank. */
      #boost-meter {
        position: fixed; bottom: var(--ctl-bottom); left: var(--gas-left); z-index: 19;
        width: var(--gas-d); height: var(--gas-d);
        pointer-events: none; user-select: none;
      }
      /* The <svg> is the button's box grown by 50 units on every side (the viewBox in the markup
         says the same), so the whole gauge *and* its glow sit inside it. The crown hung out over
         the top of a box exactly the button's size, on `overflow: visible`, and a `filter` on an
         element is free to clip to that element's box: when the burn glow came on, the top of the
         arc was cut off, and it popped back as the glow went. The numbers are 80 units at the
         button's scale, `--gas-d` per 150: 50 until the fuse flame, which licks up to ~32 units
         out past the crown's outer edge. */
      #boost-meter .boost-arc {
        position: absolute; display: block;
        left: calc(-80 * var(--gas-d) / 150); top: calc(-80 * var(--gas-d) / 150);
        width: calc(310 * var(--gas-d) / 150); height: calc(310 * var(--gas-d) / 150);
        /* The button's centre, so the throb swells the arc evenly off it. */
        transform-origin: 50% 50%;
        transition: filter 0.15s ease, transform 0.1s ease;
      }
      /* The track pads the fuel's band by a rim the colour of the pedal's own outline, which keeps a
         full gold arc from melting into the orange pedal beside it. */
      #boost-meter .boost-track { fill: rgba(34, 21, 0, 0.8); }
      #boost-meter .boost-fill { fill: url(#fuel-grad); }
      /* The glint: a thin white line across the fuel at its front, always on while there is fuel
         to draw, so the level reads as a lit edge rather than the end of a coloured shape. */
      #boost-meter .boost-glint {
        stroke: #fff; stroke-width: 2.5; stroke-linecap: round; opacity: 0.95;
      }
      #boost-meter .boost-glint[hidden] { display: none; }
      /* Under the fuse flame the white line is a hard edge right where the flame fades in. */
      #boost-meter.is-fuse .boost-glint { display: none; }
      #boost-meter.is-empty .boost-glint { opacity: 0.5; }
      /* The leading edge of a pour: a soft bright dot riding the fuel's front, faded in and out by
         the same envelope. The softness is a radial gradient rather than a CSS `blur()`, because a
         CSS filter on an element *inside* an SVG gets a filter region off that element's own tiny
         box, and WebKit has never been dependable about the functions there at all. */
      #boost-meter .boost-edge { fill: url(#fuel-edge); opacity: var(--fill, 0); }
      /* Burning. The arc lights up, so the fuel going down reads as fuel being spent. The glow's
         */
      #boost-meter.is-active .boost-arc { filter: drop-shadow(0 0 6px rgba(255, 200, 0, 0.9)); }
      /* The fuse flame (the default, Tyler 2026-10-20: "we have rad flames coming from the taxi
         tailpipe, can we integrate those"): the tailpipe's own tongue (game/locoflame.js
         `tongueOutline`), its three layers and four frames at the plume's 16fps, lying along the
         bar off the fuel's front for as long as the plume burns (`drawFuseFlame` in main.js).
         Always Loco orange: following the plume up a drift chain (violet, blue, teal, the fuel
         too) was tried and Tyler kept it orange. Only the front burns: a whole bar on fire reads
         the same full as empty, and it sits under the player's thumbs. `?locobar=classic` is the
         plain bar. */
      #boost-meter .boost-flame { pointer-events: none; }
      /* The tongues' colours are gradients main.js builds (`fuse-fade-*`), clear at the base and
         solid a little way along, so the flame grows out of the fuel instead of sitting on it. */
      #boost-meter .boost-flame .f { visibility: hidden; animation: combo-flame-frame 0.25s step-end infinite; }
      @media (prefers-reduced-motion: reduce) {
        #boost-meter .boost-flame .f { animation: none; }
        #boost-meter .boost-flame .f:first-child { visibility: visible; }
      }
      /* Empty, and the climb back to a quarter tank: the fuel is there to watch but not to spend
         yet, so the gold is muted — the pedal's reasoning (see `#boost.is-empty`). */
      body.locogrey-classic #boost-meter.is-empty .boost-fill { filter: saturate(0.35) brightness(0.8); }
      /* The default (Tyler, 2026-10-21: "make the loco bar grayscale to further comm you can't use it
         yet"): the climb is grey, not muted gold, so the bar says what the pedal says. A swap of
         gradient rather than a `filter` on the path, for the WebKit reason given at `.boost-edge`;
         the muted gold above was a filter and may never have desaturated on a phone at all. The
         charging glow goes grey with it. */
      body:not(.locogrey-classic) #boost-meter.is-empty .boost-fill { fill: url(#fuel-grad-dead); }
      body:not(.locogrey-classic) #boost-meter.is-empty .boost-edge { fill: url(#fuel-edge-dead); }
      /* The moment it is usable again: the gold comes back in one frame with a flash of the burn's
         glow that fades over half a second, on the gauge and the pedal together (`wakeLoco` in
         main.js). A snap rather than a fade-in, because the flip is the news. */
      @keyframes loco-wake-arc {
        from { filter: drop-shadow(0 0 12px rgba(255, 210, 0, 1)) brightness(1.35); }
        to { filter: drop-shadow(0 0 0 rgba(255, 210, 0, 0)) brightness(1); }
      }
      @keyframes loco-wake-pedal {
        from { filter: brightness(1.45); transform: scale(1.07); }
        to { filter: brightness(1); transform: scale(1); }
      }
      #boost-meter.is-woke .boost-arc { animation: loco-wake-arc 0.5s ease-out; }
      #boost.is-woke .pedal-art { animation: loco-wake-pedal 0.4s ease-out; }
      @media (prefers-reduced-motion: reduce) {
        #boost.is-woke .pedal-art { animation-name: loco-wake-arc; }
      }
      /* A pour landing: the glow and a small throb, off `--fill` and `--pulse`. No transition —
         every value here is rewritten per frame, and any easing smears the 4Hz throb flat. The
         throb was 3.5% and read as the whole gauge bouncing; 1.2% is a swell under the glow. */
      #boost-meter.is-filling .boost-arc {
        transition: none;
        filter: drop-shadow(0 0 calc(4px + 8px * var(--pulse, 0)) rgba(255, 190, 0, calc(0.95 * var(--fill, 0))));
        transform: scale(calc(1 + 0.012 * var(--pulse, 0)));
      }
      /* The recharge rides the pour's envelope but not its movement or its full glow: a meter
         bouncing on a pedal that refuses the press reads as pressable. */
      #boost-meter.is-charging.is-filling .boost-arc {
        filter: drop-shadow(0 0 calc(3px + 3px * var(--fill, 0)) rgba(205, 180, 106, calc(0.5 * var(--fill, 0))));
        transform: none;
      }
      body:not(.locogrey-classic) #boost-meter.is-charging.is-filling .boost-arc {
        filter: drop-shadow(0 0 calc(3px + 3px * var(--fill, 0)) rgba(200, 200, 200, calc(0.4 * var(--fill, 0))));
      }
      @media (prefers-reduced-motion: reduce) {
        #boost-meter.is-filling .boost-arc { transform: none; }
      }
      body.shot-mode #boost-meter { display: none; }
      /* A short green bump when the flying earning lands and the total ticks up, so the counter
         registers the event rather than silently changing digits. Driven from JS by toggling the
         class off/on around a reflow — CSS animations only re-fire when the class transitions. */
      #hud .money.money-bumped { animation: money-bump 0.32s cubic-bezier(0.22, 1, 0.36, 1); }
      @keyframes money-bump {
        0%   { transform: scale(1);    color: #fff;    }
        40%  { transform: scale(1.14); color: #6BE08A; }
        100% { transform: scale(1);    color: #fff;    }
      }
      /* ...and the same bump for money going the other way — the burger's counter charge, which is
         the only thing in the game that takes cash off the player. Red rather than green, and it
         dips *in* rather than swelling: the payout's 1.14 is the counter reacting to something
         arriving, so a charge that used it would say the same thing about a total going down. */
      #hud .money.money-charged { animation: money-charge 0.32s cubic-bezier(0.22, 1, 0.36, 1); }
      @keyframes money-charge {
        0%   { transform: scale(1);    color: #fff;    }
        40%  { transform: scale(0.92); color: #FF7A6B; }
        100% { transform: scale(1);    color: #fff;    }
      }

      /* The combo meter's box, on the cash total's row (`updateRunTags` in main.js). */
      #hud .runs {
        position: absolute; top: 0; left: 50%; translate: -50% 0; height: var(--hud-row);
        display: flex; flex-direction: row; align-items: center; gap: 6px;
      }
      /* The chase siren (game/chasesiren.js): a low-poly 🚨 on the cash row, level with the cash
         and just left of the pause (Tyler, 2026-10-14), for as long as the police are after the
         taxi. The canvas is 60px wide for the rays either side of a ~34px lamp (a touch smaller than
         the first 72px cut, Tyler), so butting it against the pause's 42px square leaves the lamp
         ~13px off the pause glyph. Pops in with an
         overshoot. Two ways out: a short shrink (0.32s, OUT_MS) when the chase ends in an arrest,
         and a slow fade with no shrink (1.2s, COOL_MS) when the cops lose you — the module spins
         the lamp down over the same span. Both have to match the module, which keeps drawing until
         they end. The red glow is the drop shadow's colour, so it holds against pale asphalt the
         way the digits do and reads as a lamp at the same time. */
      #chase-siren {
        position: absolute; width: 60px; height: 44px;
        filter: drop-shadow(0 2px 5px rgba(20, 40, 55, 0.55)) drop-shadow(0 0 6px rgba(226, 75, 60, 0.55));
        opacity: 0; transform: scale(0.3) translateY(-30%); transform-origin: center top;
        transition: opacity 0.2s ease, transform 0.32s cubic-bezier(0.55, 0, 0.85, 0.4);
      }
      #chase-siren.is-on {
        opacity: 1; transform: none;
        transition: opacity 0.15s ease, transform 0.45s cubic-bezier(0.34, 1.7, 0.64, 1);
      }
      #chase-siren.is-cooling { transform: none; transition: opacity 1.2s ease-in; }
      #chase-siren canvas { display: block; width: 60px; height: 44px; }
      /* Where it stands. By default it is a child of #boost-meter and sits on the crown of the
         fuel gauge (Tyler, 2026-10-15), centred over Loco Mode: the gauge's outer edge is
         BASE_R + width + RIM off the button's centre (game/fuelarc.js) — `--arc-out`, 109 units
         with the wider gap (Tyler, 2026-10-20) and 101 under `?buttons=classic` — at `--gas-d` per 150,
         and it pops up out of that rather than down out of the top edge. The probe holds
         `--arc-out` to fuelarc.js.
         `?pedals=classic` moves it back into #hud, on the cash row beside the pause. It rides
         the pedals' entrance, and #boost-meter's own hiding rules (replay, game over, shot mode). */
      #boost-meter #chase-siren {
        --arc-out: 109;
        left: calc(50% - 30px); bottom: calc(50% + var(--arc-out) * var(--gas-d) / 150 + 2px);
        transform-origin: center bottom; transform: scale(0.3) translateY(30%);
      }
      body.buttons-classic #boost-meter #chase-siren { --arc-out: 101; }
      #hud #chase-siren { top: calc((var(--hud-row) - 44px) / 2); right: var(--pause-w); }
      #boost-meter #chase-siren.is-on, #boost-meter #chase-siren.is-cooling { transform: none; }
      @media (prefers-reduced-motion: reduce) {
        #chase-siren, #chase-siren.is-on, #boost-meter #chase-siren { transform: none; }
      }
      /* The combo meter (game/combometer.js; `updateComboTag` in main.js): the count,
         "3x", centred on the screen on the cash row, with the tailpipe's flame licking out of its
         left — Tyler's call (2026-10-07) after a bar was tried: the meter has no full state, so a
         bar had nothing to fill to. #hud starts --hud-side + the safe inset in from the left, so
         that much short of 50vw is the screen's centre in its coordinates. */
      #hud .runs.is-combo { left: calc(50vw - var(--hud-side) - var(--safe-left)); }
      .combo-meter {
        display: flex; flex-direction: row; align-items: center; gap: 1px;
        transition: opacity 0.3s ease;
      }
      .combo-meter.is-off-job { opacity: 0; }
      /* Lifted off the HUD by a drop-off's cash-in: gone at once, since a copy is flying the number
         down into the fare (`popComboPayout` in main.js). */
      .combo-meter.is-cashed { opacity: 0; transition: none; }
      .combo-meter.combo-fly { position: fixed; z-index: 26; pointer-events: none; margin: 0; transform-origin: center; }
      /* The flame: Loco's own tongue (game/locoflame.js `tongueOutline`) as SVG, its three layers
         in Loco orange and its four frames cycled at the plume's 16fps. It
         grows a step with each tier, from its right end so it stays attached to the number. */
      .combo-meter .combo-flame {
        /* 40×30 against the plume's 3 × 1.8 view box: stretched a third taller than the plume's own
           proportions, which at this size read as a dart rather than a flame (34×20 was tried). */
        display: block; width: 40px; height: 30px; overflow: visible;
        transform-origin: right center; transform: scale(var(--flame-size, 1));
        transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        filter: drop-shadow(0 0 4px var(--flame-outer, #FF5D18));
      }
      .combo-meter .combo-flame path { transition: fill 0.25s ease; }
      .combo-meter .combo-flame .t0 { fill: var(--flame-outer, #FF5D18); }
      .combo-meter .combo-flame .t1 { fill: var(--flame-mid, #FF9E12); }
      .combo-meter .combo-flame .t2 { fill: var(--flame-core, #FFF6D8); }
      .combo-meter .combo-flame .f { visibility: hidden; animation: combo-flame-frame 0.25s step-end infinite; }
      @keyframes combo-flame-frame { 0% { visibility: visible; } 25%, 100% { visibility: hidden; } }
      /* A whole step flares: the flame jumps and settles, on top of its size step. */
      .combo-meter.is-flaring .combo-flame { animation: combo-flare 0.45s cubic-bezier(0.22, 1, 0.36, 1); }
      @keyframes combo-flare {
        0%   { transform: scale(calc(var(--flame-size, 1) * 1.6)); }
        100% { transform: scale(var(--flame-size, 1)); }
      }
      /* The count rolls: every number sits in the same grid cell, the outgoing one sliding up and
         out of the top as the new one comes up from below, overshooting and settling (Tyler). */
      .combo-meter .combo-roll { display: inline-grid; min-width: 2.2em; }
      .combo-meter .combo-count {
        grid-area: 1 / 1; white-space: nowrap;
        font: 700 24px/1 var(--hud-font); letter-spacing: 0; color: #fff;
      }
      .combo-meter .combo-count > span { display: inline-block; }
      .combo-meter .combo-count.is-leaving { animation: combo-count-out 0.28s ease-in forwards; }
      @keyframes combo-count-out { to { transform: translateY(-110%); opacity: 0; } }
      .combo-meter .combo-count.is-entering > span {
        animation: combo-count-in 0.5s cubic-bezier(0.34, 1.7, 0.64, 1) backwards;
      }
      /* The "x" a beat behind its number, so the pair lands as two bounces rather than one block. */
      .combo-meter .combo-count.is-entering > .combo-x { animation-delay: 0.07s; }
      @keyframes combo-count-in {
        0%   { transform: translateY(110%) scale(0.8); opacity: 0; }
        100% { transform: translateY(0) scale(1); opacity: 1; }
      }
      /* Broken: side to side, then down and out of sight, to stay hidden until the next combo. */
      .combo-meter.is-broken { animation: combo-broken 0.75s linear forwards; }
      @keyframes combo-broken {
        0%   { transform: translate(0, 0); opacity: 1; }
        8%   { transform: translate(-8px, 0); }
        16%  { transform: translate(8px, 0); }
        24%  { transform: translate(-6px, 0); }
        32%  { transform: translate(5px, 0); }
        40%  { transform: translate(-2px, 0); opacity: 1;
               animation-timing-function: cubic-bezier(0.4, 0, 0.8, 0.6); }
        100% { transform: translate(0, 26px); opacity: 0; }
      }

      /* Strikes — riders let go on the kerb. Three small rings under the cash total (top left), each
         crossed out with a red X as it is spent. Rings rather than numbers because the count that
         matters is how many are *left*, and three shapes say that without being read. The ring stays
         white under the X (Tyler's call over a filled red disc), so a spent strike still reads as one
         of the three slots. The X is two bars on the ring's own pseudo-elements, longer than the ring
         is wide so their ends poke out past it. It is meant to look drawn on rather than set: the
         whole X leans 5 degrees anticlockwise and one stroke runs longer than the other. A fresh
         strike pops so it registers on the frame the rider storms off, wherever the player's eyes
         happen to be. */
      #strikes { display: flex; gap: 9px; margin-top: 6px; }  /* 9 so two Xs' long strokes clear each other */
      #strikes .strike {
        position: relative;
        width: 12px; height: 12px; border-radius: 50%;
        box-sizing: border-box; border: 2px solid rgba(255, 255, 255, 0.85);
        box-shadow: var(--hud-shadow);
      }
      #strikes .strike::before, #strikes .strike::after {
        content: ''; position: absolute; left: 50%; top: 50%;
        width: 20px; height: 3px; margin: -1.5px 0 0 -10px; border-radius: 1.5px;
        background: #FF5A4A;
        opacity: 0; transition: opacity 0.2s ease;
      }
      #strikes .strike::before { width: 24px; margin-left: -12px; transform: rotate(40deg); }
      #strikes .strike::after { transform: rotate(-50deg); }
      #strikes .strike.is-used::before, #strikes .strike.is-used::after { opacity: 1; }
      #strikes .strike.is-new { animation: strike-pop 0.45s cubic-bezier(0.22, 1, 0.36, 1); }
      @keyframes strike-pop {
        0%   { transform: scale(1); }
        40%  { transform: scale(1.7); }
        100% { transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        #strikes .strike.is-new { animation: none; }
      }

      /* The driver's rating — the default face of the strikes above (RATING_START in fares.js):
         one filled gold star and the number beside it, 5.0 down to the floor that ends the run. A
         number rather than five stars because a row of stars reads as decoration and a number reads
         as a score that can move. One decimal because that is how every rideshare app prints a
         rating, so "4.0" looks like a rating where "4" looks like a count. The last star before the
         floor turns the number red, which is the warning the third empty ring used to give. A star
         lost dips the star (flashing red) and drops the new number in from above. Both rows sit in
         the markup; main.js hides whichever is not in use, and `[hidden]` has to be restated
         because both rows set a `display`. */
      #strikes[hidden], #rating[hidden] { display: none; }
      #rating {
        display: flex; align-items: center; gap: 5px; margin-top: 4px;
        font-size: 18px; line-height: 20px; letter-spacing: 0.04em;
        font-variant-numeric: tabular-nums;
      }
      #rating .rating-star {
        width: 19px; height: 19px; flex: none; overflow: visible;
        fill: #FFC93C; stroke: #FFC93C; stroke-width: 2; stroke-linejoin: round;
        filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.45));
        transform-origin: 50% 55%;
      }
      #rating .rating-num { display: inline-block; transition: color 0.3s ease; }
      #rating.is-last .rating-num { color: #FF5A4A; }
      #rating.is-drop .rating-star { animation: rating-star-drop 0.6s cubic-bezier(0.22, 1, 0.36, 1); }
      #rating.is-drop .rating-num { animation: rating-num-drop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
      @keyframes rating-star-drop {
        0%   { transform: scale(1) rotate(0); fill: #FFC93C; stroke: #FFC93C; }
        20%  { transform: scale(1.5) rotate(-14deg); fill: #FF5A4A; stroke: #FF5A4A; }
        40%  { transform: scale(0.75) rotate(10deg); fill: #FF5A4A; stroke: #FF5A4A; }
        65%  { transform: scale(1.08) rotate(-4deg); }
        100% { transform: scale(1) rotate(0); fill: #FFC93C; stroke: #FFC93C; }
      }
      @keyframes rating-num-drop {
        0%   { transform: translateY(-14px); opacity: 0; }
        100% { transform: translateY(0); opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        #rating.is-drop .rating-star, #rating.is-drop .rating-num { animation: none; }
      }

      /* Cargo chip — the courier box, pictured right of the gas pedal while a package is aboard.
         See src/game/cargochip.js for what is inside it. It sat under the cash total until Tyler's
         HUD shuffle (2026-10-05) gave the top-left to the cash and the top-right to the pause, and
         put the box in the corner the pause left.

         `#cargo-dock` is the corner and the chip's slide on and off with the bottom row; the chip
         inside keeps `transform` and `opacity` to itself, for its pop and its flight in. Two
         elements because the entrance and the pickup animate the same opacity, and one element
         cannot fade with the HUD and with its own arrival at once. `pointer-events: none` for the
         reason it had while it lived in #hud: a package cannot be selected, so a thumb landing on
         it goes through to the city. */
      /* Centred where a mirror of the brake would be — the same 22px off the gas pedal on its
         right as the brake is on its left, and on the same centre line (Tyler, 2026-10-06), so the
         bottom row reads as brake · gas · box rather than a box stranded in the corner. */
      #cargo-dock {
        position: fixed; z-index: 20;
        left: calc(var(--gas-left) + var(--gas-d) + var(--pedal-gap) + (var(--brake-d) - 42px) / 2);
        bottom: calc(var(--ctl-bottom) + (var(--gas-d) - 42px) / 2);
        width: 42px; height: 42px;
        pointer-events: none; user-select: none;
      }
      /* **The box and nothing else.** No disc behind it, no rim around it. A rider chip needs its
         disc because the ring around it is a clock and a clock needs a dial to be read against; the
         courier layer's defining property is that a package *has* no clock, so there was nothing for
         a ring to say — and once the ring goes, the disc is a plate under an object that does not
         need one. What is left reads like the cash total does: a bare mark on the sky.

         The drop shadow stays, and is the same one they wear — `#hud`'s own `text-shadow` in its
         filter form, so the box holds against pale asphalt exactly as the digits do. It is
         a lift off the background rather than a background of its own. */
      #cargo-chip {
        width: 42px; height: 42px;
        display: grid; place-items: center;
        filter: drop-shadow(0 2px 6px rgba(20, 40, 55, 0.65));
        /* Two ways in, and the transform is shared between them. The pop is the fallback — a chip
           raised with nothing on screen to come in from (`setCarrying`, and reduced motion). The real
           pickup is `flyIn`, which drives this same transform *and* the opacity with a Web Animation
           of its own; those outrank transitions in the cascade, so the two cannot fight.

           `.is-flying` kills the transition for the length of that arrival, and it has to: the chip
           fades up on its own curve, timed to overlap the world box still fading out across the map,
           and a 0.16s transition running underneath would be a second fade on the same property.

           Nothing here is driven off sim time, so shot mode has nothing to land (see the `settle()`
           note in CLAUDE.md); the whole dock is hidden with #hud there anyway. */
        opacity: 0; transform: scale(0.55); transform-origin: center;
        transition: opacity 0.16s ease, transform 0.26s cubic-bezier(0.22, 1, 0.36, 1);
      }
      #cargo-chip.is-on { opacity: 1; transform: scale(1); }
      #cargo-chip.is-flying { transition: none; }
      #cargo-chip canvas { display: block; width: 42px; height: 42px; }
      /* The chip still arrives and still leaves; it just stops springing — or flying — to do it.
         `flyIn` checks the same query and hands over to the plain pop. */
      @media (prefers-reduced-motion: reduce) {
        #cargo-chip, #cargo-chip.is-on { transform: none; transition: opacity 0.16s ease; }
      }

      /* Pause — the bare glyph in the top-right corner, and the screen behind it. See
         src/game/pause.js.

         Top right since Tyler's HUD shuffle (2026-10-05), on the cash total's row, vertically centred
         on it. The note below is the history of how it got to the bottom row first.

         It used to sit in the middle of the top row, between the cash total and a streak counter
         that is gone now. The Figma frame gives that row to the boost meter and the total, which
         between them leave no middle, and puts the pause at the end of the bottom row with the pedals — so the
         pause sits in the far corner. 42px square is the file's 64, on the same inset and the same
         bottom edge as the pedals.

         The glyph is the file's: two bars with their inner ends clipped on a slant. The play
         triangle it swaps to under the veil isn't in the file, so it's drawn to match. */
      #pause {
        position: fixed; z-index: 24;
        right: calc(var(--hud-side) + var(--safe-right));
        top: calc(var(--hud-top) + (var(--hud-row) - var(--pause-w)) / 2);
        width: var(--pause-w); height: var(--pause-w); padding: 0; border: 0; background: none;
        display: grid; place-items: center; cursor: pointer;
        /* The tap wants to land now, not after the browser has waited out a double-tap — and there
           is nothing here to select or long-press. */
        touch-action: manipulation;
        user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
        transition: transform 0.1s ease;
      }
      #pause:active { transform: scale(0.92); }
      /* No plate behind it (Tyler, 2026-10-06): a bare mark like the cash total beside it, held off
         pale asphalt by the same lift the digits wear — #hud's `text-shadow` in its filter form. The
         button keeps its full square, so the tap target is unchanged. */
      #pause .glyph-pause, #pause .glyph-play { filter: drop-shadow(var(--hud-shadow)); }
      /* 18×23 is the file's 28×36. */
      #pause .glyph-pause { display: block; width: 18px; height: 23px; }
      #pause .glyph-play { width: 20px; height: 22px; fill: #fff; }
      /* One button, two glyphs: it is a toggle, and while the run is held it offers the way out. */
      #pause .glyph-play { display: none; }
      body.is-paused #pause .glyph-pause { display: none; }
      body.is-paused #pause .glyph-play { display: block; }
      /* Nothing to pause on a screenshot, and once the run is over the retry pill is the only
         action on the screen — the same rule the Loco Mode pill and the ⚙️ toggle follow. */
      body.shot-mode #pause, body.game-over #pause { display: none; }

      /* The screen itself. A dim rather than a blackout: the run is being *held*, not ended, and
         seeing the city frozen underneath is what says so — the full black belongs to #run-end,
         which is the one overlay that means the run is finished.

         Under #pause (24) so the button stays lit and clickable above it, over the HUD (20), the
         coach bubble (18) and the spotlight (17), below the run-end blackout (30) and the Home Screen screen
         (26) — both of those are gates in their own right and outrank a pause. */
      /* Every full-screen overlay carries `width: 100vw; height: 100vh` on top of `inset: 0`,
         because `inset: 0` alone stops at the layout viewport — which on an installed iOS app is
         ~34pt short of the physical bottom (see the html/body comment above). The explicit height
         wins over `bottom: 0` (an over-constrained fixed box keeps top+height), so each overlay
         reaches the same true bottom the canvas draws to; without it the blackout and the veil
         leave a strip of live city showing under themselves. */
      #pause-veil {
        position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 23;
        background: rgba(6, 14, 22, 0.72); color: #fff; text-align: left;
        font: 500 16px/1.5 var(--game-font);
        touch-action: manipulation;
        user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
      }
      /* `display: flex` above beats the UA stylesheet's `[hidden] { display: none }`, so without
         this the veil covers the city from the first frame. Same trap as #run-end. */
      #pause-veil[hidden] { display: none; }
      body.shot-mode #pause-veil { display: none; }
      /* The menu is the title screen's (Resume, Settings, Quit as plain white words, and Settings
         the same page) — those rules are shared below under `:is(#title-screen, #pause-veil)`. The
         word "Paused" is the small header over it, set like the title screen's "‹ Back": it names
         the state, and the three words under it are what the player came here to press. */
      #pause-veil .pause-title {
        font-size: 18px; font-weight: 500; opacity: 0.85; padding: 8px 0; margin-bottom: 2px;
      }

      /* Earnings pop in the middle of the screen and fly into the counter (`popEarning` in
         main.js). Driven from JS so it can aim at the counter's actual on-screen position, which
         changes with the viewport and the digits. */
      .earning {
        position: fixed; z-index: 25; pointer-events: none; user-select: none;
        font: 800 27px/1 var(--game-font);
        color: #6BE08A; text-shadow: 0 2px 10px rgba(10, 30, 20, 0.65);
        transform: translate(-50%, -50%);
      }
      /* A charge — the burger at the drive-through window, and nothing else so far. Same flight,
         same size, same place: only the sign and the colour say which way the money
         went, which is the whole point of reusing the pop rather than inventing a second one. */
      .earning.is-charge { color: #FF7A6B; text-shadow: 0 2px 10px rgba(40, 12, 10, 0.65); }
      /* A word rather than a price — the getaway's checkpoints (popLabel in main.js). */
      .earning.is-label {
        font-size: 20px; white-space: nowrap; text-transform: uppercase; letter-spacing: 0.04em;
        color: #FFFFFF; text-shadow: 0 2px 10px rgba(10, 20, 40, 0.7);
      }
      /* The street race's three, two, one (game/race.js) and its words: bigger than a word,
         because it is the one thing on screen the player should be watching. 40px (was 34, Tyler
         asked for a little bigger); tabular figures so the digits are one width. */
      .earning.is-label.is-count { font-size: 40px; font-variant-numeric: tabular-nums; }
      /* The three, two, one and the "Go!" at twice that, in the middle of the screen (Tyler: "double
         the size of those numbers, stick them in the very center of the screen so that you don't
         miss it"; RACE_COUNT_Y in main.js). `?racecount=classic` keeps them at 40px. */
      .earning.is-label.is-count.is-countdown { font-size: 80px; }
      /* The combo's words off the roof and its multiplied total at the drop-off. */
      .earning.run-combo { color: #B27CFF; }
      /* Every pop wears the speech card's highlight outline (`.speech-hl`: a dark stroke painted
         under the fill), so a price or a move name reads over pale asphalt, white roofs and a squall
         alike rather than leaning on a soft shadow that vanishes against the bright half of the map
         (Tyler, 2026-10-25). Each keeps its own colour — green is cash, red a charge, purple the
         combo — since yellow already means boost in this game. The stroke scales with the type so a
         80px "3" gets as heavy a line as the card's 15.5px word does in proportion (3.5px there is
         0.23em; 0.18em here, because the pops are bolder), with a floor so the 16px card word keeps
         the card's own line and a ceiling so the count does not turn into a blob. The soft shadow
         goes: under a hard outline it only greys the edge. `?poptext=classic` keeps the shadow alone. */
      body:not(.poptext-classic) .earning {
        -webkit-text-stroke: clamp(3.5px, 0.18em, 10px) #121318; paint-order: stroke fill;
        text-shadow: none;
      }

      /* The boost half of a drop-off's payout — see src/game/energybits.js. Small, bright and
         round, so it reads as *energy* against the flying "$20"'s green text: the two currencies
         leaving the same car have to be told apart at a glance. The light core inside the taxi
         yellow keeps it legible over both the pale asphalt and the parks. */
      .energy-bit {
        position: fixed; z-index: 25; pointer-events: none;
        width: 11px; height: 11px; border-radius: 50%;
        background: radial-gradient(circle at 40% 35%, #FFF6C9 0%, #FFD84D 45%, #F5C130 100%);
        box-shadow: 0 0 10px 2px rgba(245, 193, 48, 0.75);
        transform: translate(-50%, -50%);
      }

      /* The cut to black a skipped opening happens behind — see src/game/wipe.js. Nothing is ever
         drawn on it: it exists so the vignette can be landed, and the camera thrown across the map
         to the framing the run plays at, on a frame nobody can see.

         Above every overlay that can be up while it runs (the coach bubble at 18, the pause veil at
         23, the ⏸ itself at 24) and below the two that are gates of their own: the Home Screen
         screen at 26, which holds the vignette in `wait` and so cannot coexist with a skip, and the
         run-end blackout at 30. Opacity lives here rather than in the animation's fill, so a
         cancelled or finished wipe lands on a transparent element rather than a black one. */
      #wipe {
        position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 28;
        background: #000; opacity: 0; pointer-events: none;
      }

      /* A full-screen black mask, not a modal over the city. The dim-and-card version kept the
         frozen city legible behind a panel, and the panel's edges were the loudest thing on the
         screen — a hard blackout puts the run's numbers on nothing at all, which is what makes
         them the ending rather than an overlay on top of one. */
      #run-end {
        position: fixed; inset: 0; width: 100vw; height: 100vh;
        display: flex; flex-direction: column; align-items: center;
        /* Above every other overlay (the tweak toggle and the rider chips at 20). Without a
           z-index of its own the blackout paints *under* them, so the waiting-rider chips stayed
           lit in the bottom-left corner of the game-over screen — and a chip that is still on top
           also swallows the tap that skips the tally. */
        z-index: 30;
        background: rgba(0, 0, 0, 0.95); color: #fff; text-align: center;
        /* Centred by `margin: auto` on the card rather than by `justify-content`: if the content
           ever outgrows a short viewport, a centred flex line clips its own overflow at the *top*,
           where the title is. This way it scrolls instead. */
        overflow-y: auto;
        padding: calc(24px + var(--safe-top)) calc(16px + var(--safe-right))
                 calc(24px + var(--safe-bottom)) calc(16px + var(--safe-left));
        font: 500 16px/1.5 var(--game-font);
        user-select: none;
      }
      /* `display: flex` above beats the UA stylesheet's `[hidden] { display: none }`, so without
         this the game-over overlay renders from the first frame and dims the whole game. */
      #run-end[hidden] { display: none; }

      /* The software keyboard, on the one screen that opens one. iOS does not resize the *layout*
         viewport when the keyboard comes up, so a `position: fixed; inset: 0` overlay still spans
         the whole screen and its bottom half is simply underneath the keys — scrolling the initials
         field to the centre of that box parks it behind them, which is what the bug looked like:
         a field centred on a screen whose bottom half you cannot see. `followKeyboard` (runend.js)
         measures `visualViewport` for as long as the field has focus and clamps the overlay to it,
         so `margin: auto` on the card re-centres in the band that is actually visible. Applied only
         when the two viewports genuinely disagree — Android resizes the layout viewport itself, and
         clamping on top of that would take the keyboard's height off twice. */
      #run-end.is-keyboard {
        top: var(--kb-top, 0px); bottom: auto; height: var(--kb-height, 100%);
        /* The visible band is about half a screen: 24px of gutter is most of a stat row there. */
        padding-top: 12px; padding-bottom: 12px;
        /* The blackout is the element, so clamping it also stops it painting the strip the keyboard
           is about to cover — and the clamp lands on the first `resize`, which iOS sends while the
           keys are still sliding up. A spread shadow in the same colour carries the black out past
           the clamp, so that strip is never the live city for a frame or two. Outer shadows are
           clipped to outside the border box, so it cannot double-darken what it surrounds. */
        box-shadow: 0 0 0 100vh rgba(0, 0, 0, 0.95);
      }
      /* Both gaps were doubled to spend a tall viewport's slack (see `.run-end-body` below); with
         the keyboard up there is no slack to spend, so they go back to roughly what they were
         before the doubling and the prompt fits the band without scrolling. */
      #run-end.is-keyboard .run-end-body { margin-top: clamp(12px, 3.8vh, 30px); }
      #run-end.is-keyboard .retry { margin-top: clamp(14px, 3.5vh, 28px); }

      #run-end .run-end-card {
        display: flex; flex-direction: column; align-items: center; margin: auto;
        position: relative;   /* the offset parent for `.run-end-continue` */
        /* No panel of its own — this only holds the content together and gives it a width to be
           measured against. Capped at a phone's content width (390px screen less the 16px gutters
           either side) so the desktop layout *is* the mobile layout: the stats rows push label and
           value to opposite edges, and on a 1280px screen that would otherwise strand a number
           three feet away from its own name. The title and reason are the exception — on a wide
           enough title neither is shy about overflowing this box, centred on the same axis; see
           `.run-end-reason`. */
        width: 100%; max-width: min(358px, 100%);
      }
      /* Type and rhythm scale with the viewport. Height drives most of it — it is a short viewport
         (a landscape phone) that runs the list past the fold — and the clamps hold the full-size
         layout down to ~560px tall, shrinking it below that so "Play again" stays above the fold
         on a 390px-high phone in landscape. The title is the loudest thing on the card on purpose —
         "Wrecked!" is the headline, and the reason underneath it is a caption, not a co-headline. */
      #run-end .run-end-title {
        font-size: clamp(32px, 7.4vh, 56px); font-weight: 800; line-height: 1.1;
        letter-spacing: -0.01em;
      }
      /* Deliberately smaller than the title and left free to wrap — `matchReasonWidth` (runend.js)
         caps its width at the title's own rendered width, and `text-wrap: balance` then picks the
         break point that leaves two even lines rather than a short orphan word. Capping at the
         title's width rather than the card's 358px is what keeps a two-line reason reading as a
         caption sitting under the headline instead of a block wider than it. */
      #run-end .run-end-reason {
        margin-top: 8px; font-size: clamp(17px, 3.6vh, 24px); opacity: 0.72; text-wrap: balance;
      }

      /* One stat per row, label pinned to the left edge and value to the right — a ledger, not a
         centred pair. Both edges are then straight lines down the block, which is what lets four
         rows of identically-styled text read as four separate stats. The label column takes the
         slack (`1fr`) so the values stay flush right however long the names get. */
      #run-end .run-end-stats {
        display: grid; grid-template-columns: 1fr auto; width: 100%;
        column-gap: clamp(12px, 2.4vh, 20px); row-gap: clamp(8px, 2.3vh, 16px);
      }
      /* The wrapper exists so the reveal can animate a stat as a unit; `display: contents` drops it
         out of the layout so its label and value are grid items of the row above, which is what
         keeps every row on the same two edges. */
      #run-end .stat { display: contents; }
      /* Label and value are deliberately the same size, weight and colour — the small grey caption
         over a big yellow number made the label look like chrome and the number like the content,
         when the pairing *is* the content. Same type for both makes each row one phrase:
         "Fares  9". */
      /* Sized against whichever axis is tighter. Height is the usual constraint for the list as a
         whole, but a side-by-side row has a width to fit too: the longest, "Shift  Early Shift",
         is the one that would run past the gutters of a 320px phone at 30px, where `nowrap` pushes
         it off the screen rather than wrapping it. */
      #run-end .stat-label,
      #run-end .stat-value {
        font-size: clamp(19px, min(3.9vh, 7.2vw), 30px); font-weight: 800; line-height: 1.15;
        color: #F5C130; white-space: nowrap;
      }
      /* Each entrance is anchored to the edge its text is aligned to — the label's fade-in from
         1.55x and the value's landing bump both grow inward, toward the slack between them, rather
         than out past the container. Scaling from the default centre made each row nudge sideways
         as it landed, and pushed the label's oversized first frame off the left edge. */
      #run-end .stat-label { text-align: left;  transform-origin: left center; }
      #run-end .stat-value { text-align: right; transform-origin: right center; }
      /* Tabular figures so a rolling counter doesn't jitter its own width as the digits change,
         and the column stays put while a row counts. */
      #run-end .stat-value { font-variant-numeric: tabular-nums; }
      /* The values in white, so the yellow labels read as the headings and the figure as the answer. */
      #run-end .is-counted .stat-value { color: #fff; }
      /* One span per character so a digit can fade up on its own; a transform needs a box. */
      #run-end .stat-glyph { display: inline-block; }

      /* The slot the three screens take turns in: the stats, the initials prompt and the table.
         `runend.js` locks a min-height onto it from the stats' own rendered height, so a card
         centred by `margin: auto` doesn't re-centre — and drag the title up and down the screen —
         each time a shorter screen swaps in. The margin lives here rather than on any one screen so
         all three sit at the same distance under the reason. */
      #run-end .run-end-body {
        /* Doubled from `clamp(12px, 3.8vh, 30px)`. Doubled at the *cap*, which is what governs on
           any ordinary viewport, rather than by doubling the `vh` term too: that spends the extra
           space hardest exactly where there is least of it, and it put "Play again" under the fold
           on a 390px-tall landscape phone. Measured — retry bottom 366 of 390 and the overlay
           scrolling — which is the one thing this card's clamps exist to prevent. */
        width: 100%; margin-top: clamp(14px, 5.2vh, 60px);
        display: flex; flex-direction: column; justify-content: center;
      }

      /* --- The initials prompt ------------------------------------------- */

      #run-end .score-entry { display: flex; flex-direction: column; align-items: center; }
      /* The headline of this screen — "New high score!" is the reward, so it is set at the stats'
         own weight rather than as a caption over the field. */
      #run-end .score-entry-lead {
        font-size: clamp(19px, min(3.9vh, 7.2vw), 30px); font-weight: 800; color: #F5C130;
        line-height: 1.15; white-space: nowrap;
      }
      #run-end .score-entry-hint {
        margin-top: 6px; font-size: clamp(14px, 2.6vh, 17px); font-weight: 500; opacity: 0.62;
      }

      /* Three fixed boxes with one transparent <input> stretched over them — see `buildEntry` in
         runend.js for why it is one field and not three, and why the letters are painted into spans
         rather than letter-spaced inside the input. */
      #run-end .score-slots {
        position: relative; display: flex; gap: clamp(8px, 1.8vh, 14px);
        margin-top: clamp(12px, 2.6vh, 20px);
      }
      #run-end .score-cell {
        width: clamp(42px, 8.4vh, 62px); padding-bottom: 4px;
        font-size: clamp(30px, 6.2vh, 46px); font-weight: 800; line-height: 1.1; text-align: center;
        color: #F5C130; border-bottom: 3px solid rgba(245, 193, 48, 0.3);
        /* An empty cell would collapse to zero height and the underlines would sit at three
           different heights as the name is typed. */
        min-height: 1.1em;
      }
      #run-end .score-cell.is-filled { border-bottom-color: rgba(245, 193, 48, 0.55); }
      /* The caret. The real one is hidden with the input, so the active slot's underline is what
         says where the next letter lands. */
      #run-end .score-cell.is-active {
        border-bottom-color: #F5C130; animation: score-caret 1.06s steps(1, end) infinite;
      }
      @keyframes score-caret { 0%, 50% { border-bottom-color: #F5C130; } 50.01%, 100% { border-bottom-color: rgba(245, 193, 48, 0.25); } }

      #run-end .score-input {
        position: absolute; inset: 0; width: 100%; height: 100%;
        background: none; border: 0; padding: 0; margin: 0; outline: none;
        /* Invisible, but genuinely present and focusable: the cells behind it are the display, and
           laying it over all three means a tap anywhere on them opens the keyboard. */
        opacity: 0; color: transparent; caret-color: transparent;
        /* 16px is the threshold under which iOS Safari zooms the page on focus, which on a fixed
           full-screen overlay leaves the card scrolled somewhere the player didn't put it. */
        font-size: 16px;
        text-align: center; cursor: text;
      }

      /* Secondary to "Play again": this one only confirms three letters, so it is outlined rather
         than filled, and the yellow pill stays the one action that restarts the game. */
      #run-end .score-ok {
        margin-top: clamp(14px, 3vh, 24px); padding: 10px 30px; border-radius: 999px;
        cursor: pointer; border: 2px solid #F5C130; background: none; color: #F5C130;
        font: 800 16px/1 var(--game-font);
        letter-spacing: 0.02em;
      }
      #run-end .score-ok:active { transform: scale(0.95); }

      /* --- The table ------------------------------------------------------ */

      #run-end .score-board { width: 100%; }
      /* Left-aligned, over the left edge of the list it heads. Centred, it floated free of a block
         whose own columns start hard against that edge, and read as a caption for the card rather
         than a label on the table. */
      #run-end .score-board-title {
        font-size: clamp(14px, 2.6vh, 17px); font-weight: 700; letter-spacing: 0.08em;
        text-transform: uppercase; opacity: 0.55; text-align: left;
        margin-bottom: clamp(8px, 2vh, 14px);
      }
      /* Same `display: contents` grid as the stats: the <li> drops out of the layout so every
         column lands on one straight edge down the block. Name takes the slack so the score stays
         flush right whatever the initials are. */
      #run-end .score-list {
        display: grid; grid-template-columns: auto 1fr auto; width: 100%;
        column-gap: clamp(10px, 2.2vh, 18px); row-gap: clamp(6px, 1.8vh, 12px);
        list-style: none; margin: 0; padding: 0;
      }
      #run-end .score-row { display: contents; }
      /* A notch under the stats' type: there are five of these rather than four, and they are a
         reference table rather than the run's own headline figures. */
      #run-end .score-row > span {
        font-size: clamp(16px, min(3.1vh, 5.6vw), 23px); font-weight: 800; line-height: 1.2;
        color: rgba(255, 255, 255, 0.82); white-space: nowrap;
      }
      /* Left, not right. With one digit in every rank for a five-row table the two edges are the
         same line anyway, and aligning left keeps the numbering against the block's own edge with
         the heading above it. */
      #run-end .score-rank { text-align: left; color: rgba(255, 255, 255, 0.4); }
      /* Explicitly left, against the rank beside it. The card centres its text, so without this the
         name floated in the middle of a `1fr` column with a gap either side of it and the row read
         as three unrelated things rather than as "1. TWA — $500". */
      #run-end .score-name { text-align: left; letter-spacing: 0.06em; }
      #run-end .score-cash { text-align: right; font-variant-numeric: tabular-nums; }
      /* The run that just ended, in the taxi's own yellow. Picked out by id rather than by rank —
         a run that ties an existing score sits below it, so matching on the number lights the
         wrong row. */
      #run-end .score-row.is-you > span { color: #F5C130; }
      #run-end .score-row.is-you .score-rank { color: rgba(245, 193, 48, 0.7); }

      /* Same pill treatment as #boost — the retry action reads as the primary yellow button. */
      #run-end .retry {
        /* Doubled from `clamp(14px, 3.5vh, 28px)`, the same way as `.run-end-body` above and for
           the same reason — the two gaps are paid on the same axis and a short viewport pays both. */
        margin-top: clamp(16px, 4.9vh, 56px); padding: 14px 26px; border-radius: 999px; cursor: pointer;
        border: 2px solid #16120a; background: #F5C130; color: #16120a;
        font: 800 17px/1 var(--game-font);
        letter-spacing: 0.02em; white-space: nowrap;
        transition: box-shadow 0.15s ease, transform 0.1s ease;
      }
      #run-end .retry:active { transform: scale(0.95); }
      /* Disabled while the stats count themselves out — it is transparent until its entrance, and
         a pill you can click before you can see it reloads the run out from under the tally. The
         pointer has to pass *through* it while it waits: a tap there is a tap on the overlay, which
         is what skips to the end of the sequence. */
      #run-end .retry:disabled { pointer-events: none; }

      /* "Tap to continue" under the review, laid over the retry pill's slot (`awaitReview` in
         runend.js sets its top and height from the pill) so it takes no space of its own. Quiet on
         purpose — the stats are what is being read — with a slow breathe so it reads as waiting. */
      #run-end .run-end-continue {
        position: absolute; left: 0; right: 0;
        display: flex; align-items: center; justify-content: center;
        font-size: clamp(14px, 2.6vh, 17px); font-weight: 500; opacity: 0.62;
        pointer-events: none;
        animation: run-end-breathe 2.4s ease-in-out 0.8s infinite;
      }
      @keyframes run-end-breathe { 50% { opacity: 0.32; } }
      /* At the foot of the screen instead (the default; `?gameover=classic` keeps the slot above).
         Out of the card's flow and pinned to the blackout, so it never moves the stats, and set in
         white with a soft glow that swells and fades — a pulse rather than the breathe's dim, so it
         reads as the screen asking for something rather than as a caption going grey. */
      #run-end .run-end-continue.is-foot {
        position: fixed; top: auto; bottom: calc(clamp(20px, 5vh, 44px) + var(--safe-bottom));
        color: #fff; opacity: 0.9; font-weight: 600;
        animation: run-end-pulse 1.8s ease-in-out 0.8s infinite;
      }
      @keyframes run-end-pulse {
        0%, 100% { opacity: 0.9; text-shadow: 0 0 0 rgba(255, 255, 255, 0); }
        50% { opacity: 0.5; text-shadow: 0 0 14px rgba(255, 255, 255, 0.6); }
      }

      /* The polaroid over the title: one frame of the ending (game/polaroid.js). Sized off the
         viewport's height like the rest of the card, so a landscape phone gets a smaller print
         rather than a title pushed below the fold. The tilt is the resting state; runend.js drops
         it in from a steeper one. The New Move card's clip is printed on the same paper (below). */
      #run-end .run-end-photo { margin-bottom: clamp(14px, 3.4vh, 30px); }
      #run-end .run-end-print, body:not(.move-card-classic) #new-move .nm-print {
        background: #f7f4ec; padding: 8px 8px 30px; border-radius: 2px;
        transform: rotate(var(--print-tilt, -4deg));
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.6), 0 2px 6px rgba(0, 0, 0, 0.45);
      }
      #run-end .run-end-shot {
        display: block; width: clamp(96px, 24vh, 190px); height: auto; aspect-ratio: 1;
        background: #222;
      }

      /* Room for the foot hint (the default; `?runendfit=classic` is the layout below without it).
         The hint is `position: fixed` and out of the flow, so the card centred itself in the whole
         blackout and, on a phone, ran its table down under the hint: on a 393×852 iPhone the fifth
         row sat at 740–777 against a hint at 750–775. The bottom padding holds the hint's band —
         its own offset, ~26px of line and a 16px gap — so `margin: auto` centres the card in what is
         left above it, and anything that still does not fit scrolls rather than slides underneath.
         Scrolling was the other way out and is the worse one here: the whole blackout is the tap
         target, so the swipe that scrolls a list is also the tap that leaves it.
         The space comes out of the print and the two big gaps, which were sized when the card ended
         on a pill rather than on a table of five. Measured with all five rows up (card bottom → hint
         top): 393×852 −27 → 30px, 375×667 (iPhone SE) −44 → 9px, 440×956 16 → 71px. */
      #run-end.is-fit:not(.is-keyboard) {
        padding-bottom: calc(clamp(20px, 5vh, 44px) + 42px + var(--safe-bottom));
      }
      #run-end.is-fit:not(.is-keyboard) .run-end-body { margin-top: clamp(14px, 4vh, 40px); }
      #run-end.is-fit .run-end-photo { margin-bottom: clamp(12px, 2.6vh, 24px); }
      #run-end.is-fit .run-end-shot { width: clamp(88px, 18vh, 160px); }

      /* The Loco Mode pill and the ⚙️ tweak toggle are gameplay controls; once the run is over
         they are noise behind the retry pill. */
      body.game-over #boost, body.game-over #boost-meter, body.game-over #brake,
      body.game-over #dbg-toggle, body.game-over #dbg-panel { display: none; }

      /* The bottom control row: the gas pedal, the brake pedal beside it, and the pause square in
         the far corner — the Figma frame "boost-active", at the same ×0.652 as the top row.
         The three stay independently `position: fixed` rather than becoming flex children of a
         row, because a wrapper would be a new element between them and the viewport — and `#boost`
         is measured (game/tutorial.js aims its third bubble at `getBoundingClientRect`), animated
         (`translate` on the HUD entrance), and pressed through pointer capture.
         The row sits in one inset, the same on all three sides it touches. That inset is
         *derived*, not typed, and the reason is the home indicator. The row used to stand 26px
         clear of the layout viewport plus whatever `--safe-bottom` was, which is 26 on a desktop
         and 60pt on a notched iPhone — one constant, two very different gaps. Halving the gap the
         player actually sees therefore has to halve the sum: 13px on a desktop, 30pt on a phone,
         and the sides take the same number so the three gaps match on either. 30pt still clears
         the home indicator (~21pt of edge-protect at the bottom). The file has 22pt (its 34);
         the derived inset is kept because that number was chosen against the gesture strip, and
         the file wasn't. Landscape puts 47pt of notch on one side, and no derived inset is going
         to beat that, so the sides floor at their own `env()`.
         `--ctl-h` is the row's height — the gas button, the tallest thing in it — and everything
         stacked above the row (the rider chips, the taxi finder, the coach) measures off it.
         The gas sits dead centre, so `--gas-left` is half the viewport less its radius; the brake
         hangs off its left side (see #boost, #brake). */
      :root {
        --ctl-inset: calc((26px + var(--safe-bottom)) / 2);
        --ctl-bottom: var(--ctl-inset);
        --ctl-left: max(var(--ctl-inset), var(--safe-left));
        --ctl-right: max(var(--ctl-inset), var(--safe-right));
        --ctl-h: 100px;
        --gas-d: 100px;
        --brake-d: 66px;
        --gas-left: calc(50% - var(--gas-d) / 2);
        /* The gap between the brake and the gas, and how far past their drawn edges each one takes
           a thumb (see "The reach" by #boost, #brake). */
        --pedal-gap: 22px;
        --pedal-reach: 20px;
        --pedal-deadband: 8px;
        --pause-w: 42px;
      }

      body.shot-mode #hud, body.shot-mode #cargo-dock, body.shot-mode #run-end { display: none; }

      /* The crash replay (game/replay.js): nothing on screen but the white flash on each cut. It
         had a letterbox and a REPLAY tag and lost both — the cuts say "replay" on their own, and
         the bars took a fifth of a phone's height off a shot that is about a second long. The
         element is still one full-screen tap target: a tap anywhere skips to the card. The HUD
         goes for the length of it — a money counter over a slow-motion fireball is a game still
         running underneath a cut scene. */
      #replay {
        position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 25;
        pointer-events: auto; touch-action: none; user-select: none; -webkit-user-select: none;
      }
      #replay[hidden] { display: none; }
      #replay .replay-flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
      body.replaying #hud, body.replaying #cargo-dock, body.replaying #pause, body.replaying #boost, body.replaying #boost-meter,
      body.replaying #brake, body.replaying #rider-finder-stack, body.replaying #taxi-finder,
      body.replaying .fare-pointer { display: none; }

      /* The pedals: two round buttons, inline SVG rather than an <img> because the press has to
         reach inside them (below). The gas is centred on the bottom edge; the brake is two thirds
         of its size, to its left, with the two centres on one line so a thumb sliding between
         them goes straight across. The gap is wide enough to clear the fuel gauge's left end,
         which stands ~15px off the gas's outline — and it is where the two hit zones meet, a deadband
         apart (see "The reach" below).

         Everything that keeps a hold a hold is unchanged from the pills these replace: `none`
         rather than `manipulation`, because pan or pinch starting on a pedal makes the browser
         claim the touch and fire `pointercancel` at a pedal the player is still holding (a second
         finger tapping a fare while a thumb holds the gas *is* a pinch, as far as the browser is
         concerned); no selection, no callout; and nothing inside the button hit-tests — the art
         is `pointer-events: none` — so iOS's selection and magnifier gestures have no node to
         land on (webkit.org/b/231161, and the `touchstart` guards in main.js). */
      #boost, #brake {
        position: fixed; bottom: var(--ctl-bottom); z-index: 20;
        padding: 0; border: 0; background: none; cursor: pointer;
        user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
        touch-action: none;
      }
      #boost { left: var(--gas-left); width: var(--gas-d); height: var(--gas-d); }
      #brake {
        left: calc(var(--gas-left) - var(--pedal-gap) - var(--brake-d));
        bottom: calc(var(--ctl-bottom) + (var(--gas-d) - var(--brake-d)) / 2);
        width: var(--brake-d); height: var(--brake-d);
      }
      /* The reach. Each pedal takes a thumb `--pedal-reach` past its drawn edge, because a thumb's
         contact point is not where its pad is and a thumb sliding back from the brake does not come
         back along the line it went out on (Tyler, 2026-10-08: it slipped off the gas mid-drift and
         the car stopped). The art stays its size; the hit area grows. On the two facing sides the
         reach stops `--pedal-deadband` short of meeting, which is the band where a resting thumb
         keeps whichever pedal it already had. game/pedalzones.js draws the same zones for the slide
         and reads these same variables, so the first press and the slide agree.
         20px of reach puts the gas's top edge exactly level with the bottom of the rider chips and
         the taxi finder (`--ctl-h + 20px`), so it never takes a tap meant for them. */
      #boost::before, #brake::before {
        content: ''; position: absolute; inset: calc(-1 * var(--pedal-reach));
      }
      #boost::before { left: calc((var(--pedal-deadband) - var(--pedal-gap)) / 2); }
      #brake::before { right: calc((var(--pedal-deadband) - var(--pedal-gap)) / 2); }
      .pedal-art {
        display: block; width: 100%; height: 100%; overflow: visible;
        pointer-events: none;
        transition: filter 0.15s ease;
      }

      /* The press. The button's depth is two discs: a dark base, and the face drawn smaller and
         higher on it, so the base shows as a crescent underneath and reads as the side. (It used
         to be one shape with a 28-unit inner shadow along its bottom, which on a circle left the
         face a squashed oval.) A
         press is drawn *inside* the silhouette rather than by moving it: the face disc drops into
         the dark base disc under it, its filter adds a dark inner shadow from the top edge, and the
         icon drops with it.
         It used to squash the whole pedal toward its base (the top came down ~12px). That read as
         travel, but the fuel gauge hugs the gas button, and a button that moves 12px away from a
         gauge that doesn't opens a gap exactly where the thumb is looking. The outline and
         the hit box now stay where they are.

         Held is a class and never `:active`, for the pedal slide's reason: the browser pins
         `:active` to the button the press *started* on, and a thumb sliding from gas to brake
         would leave the gas looking pressed and the brake it is standing on looking up.
         `is-held` is the pointer's (engagePedal in main.js); `is-down` and `is-on` are the
         pedals' own state, set however they were pressed, so the Space and B keys sink them too. */
      #boost .pedal-classic .pedal-face { filter: url(#gas-up); }
      #brake .pedal-classic .pedal-face { filter: url(#brake-up); }
      #boost.is-held .pedal-classic .pedal-face, #boost.is-down .pedal-classic .pedal-face { filter: url(#gas-down); }
      #brake.is-held .pedal-classic .pedal-face, #brake.is-on .pedal-classic .pedal-face { filter: url(#brake-down); }
      /* The face drops into its base, 5 of the 12 units of crescent under it, and the icon rides
         with it. In the button's user units. The silhouette and the hit box stay put. */
      .pedal-face, .pedal-icon { transition: transform 0.07s ease-out; }
      #boost.is-held .pedal-face, #boost.is-down .pedal-face,
      #brake.is-held .pedal-face, #brake.is-on .pedal-face,
      #boost.is-held .pedal-icon, #boost.is-down .pedal-icon,
      #brake.is-held .pedal-icon, #brake.is-on .pedal-icon { transform: translateY(5px); }
      /* The NES pedals (the default, Tyler 2026-10-15): the same two buttons drawn as a pad's B
         and A — a black plastic surround, a shallow crescent of side, a hard glint rather than a
         soft sheen, and a dish in the middle with the letter debossed in it. Sharper means no blur
         anywhere in the up state, so there is no up filter at all. The press is the same idea as
         the classic one at a shallower depth: 4 of the 5 units of crescent, and a hard inner
         shadow from the top. `?pedals=classic` (body.pedals-classic) shows the drawings these
         replaced, which still ship beside them. */
      body.pedals-classic .pedal-nes, body:not(.pedals-classic) .pedal-classic { display: none; }
      /* No shine (the default, Tyler 2026-10-20: "remove the cartoony white shine graphics"): the
         glint, its dot and the dish's lit lower rim are `.nes-shine` and stay out, so the
         buttons keep their plastic, crescent, dish and debossed letter without the gloss. A flat
         disc was tried first and Tyler went back to the NES drawing. `?buttons=classic`
         (body.buttons-classic, which `?pedals=classic` also sets) puts the shine back. */
      body:not(.buttons-classic) .nes-shine { display: none; }
      .pedal-letter { font: 700 50px/1 -apple-system, system-ui, "Helvetica Neue", Arial, sans-serif; }
      #boost.is-held .pedal-nes .pedal-face, #boost.is-down .pedal-nes .pedal-face,
      #brake.is-held .pedal-nes .pedal-face, #brake.is-on .pedal-nes .pedal-face {
        filter: url(#nes-down); transform: translateY(4px);
      }
      /* Held brake lights up a touch, the way the taxi's own lamps come on out on the road. */
      #brake.is-on .pedal-art { filter: brightness(1.12); }

      /* Empty tank, and the climb back to a quarter (game/boost.js): the gas is dead, and has to
         read as the opposite of "press me" rather than as a dimmer version of it. The fuel meter
         at the top carries the climb itself. */
      #boost.is-empty { cursor: default; }
