      #home-tip .home-tip-steps svg .dot { fill: rgba(255, 255, 255, 0.95); stroke: none; }

      #home-tip .home-tip-hint {
        font-size: 0.52em; font-weight: 600;
        /* Quiet on purpose. It is an instruction about the screen rather than part of the list, and
           at full strength it competed with the step it sits under. */
        color: rgba(255, 255, 255, 0.45);
      }

      /* --- tweak panel --- */
      #dbg-toggle {
        position: fixed; top: calc(16px + var(--safe-top)); right: calc(16px + var(--safe-right)); z-index: 20;
        width: 38px; height: 38px; border: 0; border-radius: 10px; cursor: pointer;
        font-size: 18px; line-height: 1; background: rgba(20, 34, 44, 0.72); color: #fff;
      }
      #dbg-toggle:hover { background: rgba(20, 34, 44, 0.9); }

      #dbg-panel {
        position: fixed; top: calc(62px + var(--safe-top)); right: calc(16px + var(--safe-right));
        z-index: 20; width: 258px;
        padding: 12px 14px 14px; border-radius: 12px;
        background: rgba(18, 30, 39, 0.92); color: #e8eef2;
        font: 500 12px/1.4 ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
        max-height: calc(100vh - 90px - var(--safe-top) - var(--safe-bottom)); overflow: auto;
      }
      #dbg-panel[hidden] { display: none; }
      #dbg-panel h4 {
        margin: 10px 0 6px; font-size: 11px; text-transform: uppercase;
        letter-spacing: 0.08em; opacity: 0.55; font-weight: 700;
      }
      #dbg-panel h4:first-child { margin-top: 0; }
      .dbg-row { display: grid; grid-template-columns: 84px 1fr; gap: 4px 8px; align-items: center; margin-bottom: 7px; }
      .dbg-row span { opacity: 0.8; }
      .dbg-row em { grid-column: 2; font-style: normal; font-size: 11px; opacity: 0.6; font-variant-numeric: tabular-nums; }
      .dbg-row input[type="range"] { width: 100%; accent-color: #F5C130; }
      .dbg-row input[type="color"] { width: 100%; height: 22px; padding: 0; border: 0; background: none; }
      .dbg-row select {
        width: 100%; padding: 3px 4px; border: 0; border-radius: 6px;
        background: rgba(0, 0, 0, 0.35); color: #cfe0ea; font: 500 11px/1.3 inherit;
      }
      /* The Loco Mode ramp preview — see the Loco section in src/game/debugpanel.js. Sized in
         the panel's own content width (258px less its 14px sides) so the curve reaches both
         edges; the taxi's yellow because it is the taxi's speed the curve is describing. */
      .dbg-ramp {
        display: block; width: 100%; height: auto; margin: 2px 0 4px;
        border-radius: 6px; background: rgba(0, 0, 0, 0.3);
      }
      .dbg-ramp-ref { stroke: rgba(232, 238, 242, 0.22); stroke-width: 1; stroke-dasharray: 2 3; }
      .dbg-ramp-curve { fill: none; stroke: #F5C130; stroke-width: 1.6; stroke-linejoin: round; }
      .dbg-ramp-curve.coast { stroke-dasharray: 3 3; opacity: 0.75; }
      .dbg-note {
        margin: 0 0 8px; font-size: 10.5px; line-height: 1.4; opacity: 0.6;
        font-variant-numeric: tabular-nums;
      }
      /* A note that reports on the button above it — the Loco stash line under "Reset Loco Mode".
         `.dbg-wide` carries its own top margin and `.dbg-note` has none, so without this the two
         sit flush and the line reads as part of the button rather than about it. */
      .dbg-wide + .dbg-note { margin-top: 6px; }
      .dbg-actions { display: flex; gap: 6px; margin-top: 10px; }
      .dbg-wide {
        width: 100%; margin-top: 10px; padding: 7px 4px; border: 0; border-radius: 8px;
        cursor: pointer; background: #4E7FC0; color: #fff; font: 700 11px/1 inherit;
      }
      .dbg-out {
        width: 100%; margin-top: 8px; padding: 7px; border: 0; border-radius: 8px; resize: vertical;
        background: rgba(0, 0, 0, 0.35); color: #cfe0ea;
        font: 500 10px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .dbg-actions button {
        flex: 1; padding: 7px 4px; border: 0; border-radius: 8px; cursor: pointer;
        background: #F5C130; color: #23303a; font: 700 11px/1 inherit;
      }
      body.shot-mode #dbg-toggle, body.shot-mode #dbg-panel { display: none; }

      /* The renderer readout — `?diag`, see src/game/diag.js. Bottom-left rather than top, which
         is where the money counter and the streak live, and above the boost pill's own corner.
         It has to survive being photographed on a phone in one hand, so: monospace, a solid
         backing rather than a text shadow, and small enough that six lines fit on a 320px screen.

         It **wraps rather than truncating**. The GPU string is the longest line here and also the
         one most likely to name the culprit — "which Adreno is this" is the whole question on a
         device-specific bug — so an ellipsis would clip away the reason the panel was opened.
         Two wrapped lines are ugly and legible; one truncated line is neither. */
      #diag {
        position: fixed; left: calc(8px + var(--safe-left)); bottom: calc(8px + var(--safe-bottom));
        z-index: 29; max-width: calc(100% - 16px - var(--safe-left) - var(--safe-right));
        padding: 7px 9px; border-radius: 8px;
        background: rgba(6, 14, 22, 0.82); color: #b8f0c8;
        font: 10px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: pre-wrap; overflow-wrap: anywhere;
        pointer-events: none; user-select: none; -webkit-user-select: none;
      }
      #diag[hidden] { display: none; }
      body.shot-mode #diag { display: none; }

      #error {
        position: fixed; inset: 0; width: 100vw; height: 100vh; background: #2b1b1b; color: #ffb4a8;
        padding: calc(24px + var(--safe-top)) calc(24px + var(--safe-right))
                 calc(24px + var(--safe-bottom)) calc(24px + var(--safe-left));
        font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: pre-wrap; overflow: auto; z-index: 10;
        /* Full-screen and tappable-to-scroll like every other overlay here, so a tap meant to
           dismiss/scroll it doesn't instead start an iOS text selection — that pops the copy /
           formatting toolbar and highlights the whole log. */
        user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
      }
      /* In the native shell the same element is a player-facing failure screen rather than a log —
         see the `report()` note beside the handlers at the bottom of this file. It says one short
         sentence, so it is centred and set in the game's own face instead of 13px monospace pinned
         to the top-left corner. The colours are the panel's, unchanged: whatever this is, it is
         still the thing that went wrong. */
      html[data-native] #error {
        display: grid; place-content: center; text-align: center;
        font: 600 17px/1.5 ui-rounded, "SF Pro Rounded", "Avenir Next", system-ui, sans-serif;
      }
      /* `hidden` is a UA-stylesheet `display: none`, so **any** author `display` beats it — and the
         rule above is one, applying from page load rather than from the first error. Without this
         line the App Store build opens with the empty panel covering the whole game: a flat #2b1b1b
         screen with the HUD (higher z-index) still drawn on top of it and no text to explain
         itself, because `report()` never ran to fill it in. The web build never showed this because
         `#error` carries no `display` of its own there. The `[hidden]` has to sit on a selector at
         least as specific as the one it is undoing — `#error[hidden]` alone loses to
         `html[data-native] #error` on the extra type selector. */
      html[data-native] #error[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div id="hud">
      <div class="money">$<span id="money">0</span></div>
      <!-- The courier load, drawn into by game/cargochip.js while a package is aboard. Empty here:
           the box inside it is the real `createParcel` mesh in a WebGL context of its own, the same
           way the rider-finder chips draw the real figure. -->
      <div id="cargo-chip" role="img" aria-label="Package aboard" aria-hidden="true"></div>
    </div>
    <div id="streak"><span id="streak-count">0</span>x</div>

    <!-- Both glyphs ship in the one button; CSS shows whichever the current state offers. Drawn
         rather than typed for the same reason the Home Screen tip draws its ⋯ — the pause and play
         characters are a different weight and shape in every font, and the emoji versions carry
         their own colour. -->
    <button id="pause" type="button" aria-label="Pause" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <g class="glyph-pause">
          <rect x="5.4" y="2.4" width="5.1" height="19.2" rx="1.7" />
          <rect x="13.5" y="2.4" width="5.1" height="19.2" rx="1.7" />
        </g>
        <polygon class="glyph-play" points="6,2.4 20.6,12 6,21.6" />
      </svg>
    </button>
    <div id="pause-veil" role="dialog" aria-modal="true" aria-label="Paused" aria-hidden="true" hidden>
      <div class="pause-title">Paused</div>
      <button class="pause-resume" type="button">Resume</button>
    </div>

    <!-- The throttle: one spring-loaded lever where the Loco Mode pill and the brake used to be two
         buttons. Push the knob up to floor it, pull it down to brake, let go and it springs back to
         the middle — which is the taxi driving itself. The upper half of the track doubles as the
         fuel gauge, so the thing you push into is the thing that empties.
         A `div` rather than a `button` because it is a slider and answers a drag, not a click, and
         `role="slider"` is the only thing that describes that to a screen reader. Every child is
         `aria-hidden` and out of hit-testing: the only thing under a thumb here is #throttle
         itself, which is what keeps WebKit's magnifier and double-tap zoom off it (see the
         `#throttle > *` rule). `aria-keyshortcuts` carries both holds — the
         spacebar is still the boost and B is still the brake, through the same lever. -->
    <div id="throttle" role="slider" tabindex="0"
         aria-label="Throttle" aria-orientation="vertical" aria-keyshortcuts="Space B"
         aria-valuemin="-1" aria-valuemax="1" aria-valuenow="0" aria-valuetext="Coasting">
      <div class="throttle-track" aria-hidden="true">
        <div class="throttle-brake"></div>
        <div class="throttle-fuel"></div>
      </div>
      <div class="throttle-knob" aria-hidden="true"></div>
    </div>
    <div id="rider-finder-stack" role="group" aria-label="Waiting riders"></div>
    <!-- Up only while the taxi is completely off-frame; a tap rides the camera back to it. Empty
         here: the car inside it is the real `createTaxiMesh` in a WebGL context of its own, the
         same way the rider chips draw the real figure. See src/game/taxifinder.js. -->
    <button id="taxi-finder" type="button" aria-label="Back to the taxi" aria-hidden="true"
      disabled></button>
    <!-- Empty: one arrow per off-screen fare is built into here on demand, since how many there
         are is a fact about the board. The arrows are `position: fixed` themselves, so this host
         needs no layout of its own. See src/game/farepointers.js. -->
    <div id="fare-pointers" aria-hidden="true"></div>
    <div id="siren-glow" aria-hidden="true" hidden></div>
    <div id="spotlight" aria-hidden="true"></div>
    <div id="coach" hidden>
      <button class="coach-bubble" type="button">
        <span class="coach-avatar"></span>
        <span class="coach-text">
          <span class="coach-ghost"></span><span class="coach-typed"></span>
        </span>
      </button>
    </div>
    <div id="home-tip" hidden></div>
    <div id="wipe" aria-hidden="true" hidden></div>
    <div id="run-end" hidden></div>

    <div id="diag" hidden></div>
    <div id="error" hidden></div>
    <script>
      const errorPanel = () => {
        const el = document.getElementById('error');
        el.hidden = false;
        return el;
      };

      /* What the panel says, which is not the same question as what it knows.

         On the web this is a developer's panel that happens to live on a player's screen: there is
         no console on a phone, so the stack goes where it can be read. Inside the App Store build
         that reasoning inverts. A player who cannot open a console also cannot act on a stack
         trace, App Review treats one as an unfinished app (Guideline 2.1), and the panel is
         `inset: 0` — so a single caught error replaces a working game with a wall of text about
         `vendor-Dru8FmLU.js`.

         So: the capture is identical on both, and only the presentation forks. Everything still
         accumulates into `window.__errorLog`, which is what Safari Web Inspector attaches to and
         reads — the native build loses nothing diagnostically, it just stops printing it at the
         player. `window.__native` is set by the shell's injected user script before this runs; see
         `src/util/platform.js` for why the flag is a global rather than a build-time constant, and
         note that this file is a classic script with no `import.meta.env` to check even if it were.

         `data-native` on the root rather than a class, because it is a fact about the host and not
         a state the game moves in and out of. The CSS above hangs the centred layout off it. */
      window.__errorLog = '';
      if (window.__native === true) document.documentElement.dataset.native = '';
      const report = (detail) => {
        window.__errorLog += detail;
        const el = errorPanel();
        if (window.__native === true) {
          // Assigned, not appended: a second failure must not stack a second copy of the sentence.
          el.textContent = 'Something went wrong.\n\nClose the app and open it again.';
          return;
        }
        el.textContent += detail;
      };
      /* An error the browser refuses to describe did not come from this page.

         `Script error.` at `:0:0` with a null `error` is the anonymised form the spec hands a page
         for an exception thrown by a script from another origin — every field is stripped so a page
         can't read a foreign script's internals back out of its own handler. Nothing here is
         cross-origin: the module graph is served off this domain, so anything *this* game throws
         arrives with a filename, a line and a stack. Which makes an anonymised one, by
         construction, somebody else's script running in the tab — iOS Safari raises one from the
         page menu's Search item on an ordinary tab (not a Home Screen launch), and extensions and
         content blockers do the same. The panel is `inset: 0`, so opening it for that replaces a
         working game with a message that names nothing and offers nobody anything to act on. Count
         them instead; `window.__foreignErrors` has the tally if a report ever needs it. */
      window.__foreignErrors = 0;
      window.addEventListener('error', (e) => {
        if (!e.filename && !e.lineno && !e.error) { window.__foreignErrors += 1; return; }
        report(`${e.message}\n  at ${e.filename}:${e.lineno}:${e.colno}\n${e.error?.stack ?? ''}\n\n`);
      });
      window.addEventListener('unhandledrejection', (e) => {
        report(`Unhandled rejection: ${e.reason?.stack ?? e.reason}\n\n`);
      });

      /* Three's own reports, put where a phone can show them.

         A whole class of rendering failure never throws, so the panel above never opens for it: a
         lost context, a shader the driver refuses to compile, a context that could not be created
         at all. Three reports each of those to the console and then carries on drawing nothing —
         the page keeps running perfectly with a black canvas underneath it, the sim ticking and
         the HUD updating over the top. That is exactly what an Android device did, and there is
         no console on a phone to read the explanation out of.

         **An allow-list, not a prefix match.** This panel covers the whole screen, so anything
         that opens it has to be a failure the game does not come back from. Three writes plenty
         of benign `THREE.`-prefixed warnings (a missing optional extension, a deprecation), and
         pasting one of those over the city would turn a working build into a broken one. Every
         entry here means the renderer has stopped producing pixels; `Context Restored.` is the
         one that means it started again, and it takes the panel back down.

         Installed inline and ahead of the module script, because a context-creation failure
         happens while that module is still evaluating. */
      const FATAL_GL = [
        'THREE.WebGLRenderer: Context Lost.',
        'THREE.WebGLRenderer: A WebGL context could not be created',
        'THREE.WebGLProgram: Shader Error',
        'THREE.WebGLShader:',
      ];
      for (const level of ['error', 'warn', 'log']) {
        const original = console[level].bind(console);
        console[level] = (...args) => {
          original(...args);
          const first = typeof args[0] === 'string' ? args[0] : '';
          if (first.startsWith('THREE.WebGLRenderer: Context Restored.')) {
            const el = document.getElementById('error');
            el.textContent = '';
            el.hidden = true;
            return;
          }
          if (FATAL_GL.some((prefix) => first.startsWith(prefix))) {
            report(args.map(String).join(' ') + '\n\n');
          }
        };
      }
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
