<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sim Taxi 🚕</title>
    <!-- Home-screen icon. iOS's mask is round-cornered, so the artwork is centred with a purple
         border that the mask crops into. Generated by tools/make-icon.mjs — regenerate both PNGs
         together (the SVG source stays alongside them for future edits). -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/apple-touch-icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/apple-touch-icon-512.png" />
    <meta name="apple-mobile-web-app-title" content="Sim Taxi" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#A46BFF" />
    <style>
      :root { color-scheme: light; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      /* Matches PALETTE.skyBottom, so the frame before WebGL's first paint is the sky rather
         than a flash of a different colour. */
      html, body { width: 100%; height: 100%; overflow: hidden; background: #dcedf7; }
      canvas { display: block; touch-action: none; cursor: pointer; }

      #hud {
        position: fixed; top: 18px; left: 18px;
        font: 600 14px/1.5 ui-rounded, "SF Pro Rounded", "Avenir Next", system-ui, sans-serif;
        color: #fff; text-shadow: 0 2px 6px rgba(20, 40, 55, 0.65);
        pointer-events: none; user-select: none;
      }
      #hud .money {
        font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums;
        display: inline-block; transform-origin: left center;
      }
      /* A short green bump when the flying earning lands and the total ticks up, so the counter
         registers the event rather than silently changing digits. Driven from JS by toggling the
         class off/on around a reflow — CSS animations only re-fire when the class transitions. */
      #hud .money.money-bumped { animation: money-bump 0.32s cubic-bezier(0.22, 1, 0.36, 1); }
      @keyframes money-bump {
        0%   { transform: scale(1);    color: #fff;    }
        40%  { transform: scale(1.14); color: #6BE08A; }
        100% { transform: scale(1);    color: #fff;    }
      }

      /* Streak counter — mirrors the money counter at the opposite corner, and like the money
         counter it's on screen from the first frame reading `0x`. It used to stay hidden until
         the first drop-off, but an empty corner gives the player nothing to aim at; showing the
         zero states the goal. JS bumps the number on every delivery. */
      #streak {
        position: fixed; top: 18px; right: 18px;
        font: 600 14px/1.5 ui-rounded, "SF Pro Rounded", "Avenir Next", system-ui, sans-serif;
        font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums;
        color: #fff; text-shadow: 0 2px 6px rgba(20, 40, 55, 0.65);
        pointer-events: none; user-select: none;
        transform-origin: right center;
      }
      /* Sits outside #hud, so it needs its own shot-mode rule — otherwise every screenshot
         carries a `0x` in the top-right corner that isn't what the shot is about. */
      body.shot-mode #streak { display: none; }
      /* Same shape as .money-bumped, but in the taxi's own yellow rather than cash green — the
         streak isn't a payout, and reusing green would read as a second money event. */
      #streak.streak-bumped { animation: streak-bump 0.32s cubic-bezier(0.22, 1, 0.36, 1); }
      @keyframes streak-bump {
        0%   { transform: scale(1);    color: #fff;    }
        40%  { transform: scale(1.14); color: #F5C130; }
        100% { transform: scale(1);    color: #fff;    }
      }

      /* Earnings fly off the taxi so the payout is visibly connected to the drop-off; the flight
         itself (rise, then travel to the counter) is driven from JS so it can aim at the counter's
         actual on-screen position, which changes with the viewport. */
      .earning {
        position: fixed; z-index: 25; pointer-events: none; user-select: none;
        font: 800 27px/1 ui-rounded, "SF Pro Rounded", "Avenir Next", system-ui, sans-serif;
        color: #6BE08A; text-shadow: 0 2px 10px rgba(10, 30, 20, 0.65);
        transform: translate(-50%, -50%);
      }

      /* The boost half of a drop-off's payout — see src/game/energybits.js. Small, bright and
         round, so it reads as *energy* against the flying "$20"'s green text: the two currencies
         leaving the same car have to be told apart at a glance. The light core inside the taxi
         yellow keeps it legible over both the pale asphalt and the parks. */
      .energy-bit {
        position: fixed; z-index: 25; pointer-events: none;
        width: 11px; height: 11px; border-radius: 50%;
        background: radial-gradient(circle at 40% 35%, #FFF6C9 0%, #FFD84D 45%, #F5C130 100%);
        box-shadow: 0 0 10px 2px rgba(245, 193, 48, 0.75);
        transform: translate(-50%, -50%);
      }

      #toast {
        position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
        font: 600 15px/1 ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
        color: #fff; background: rgba(24, 44, 58, 0.72); padding: 10px 18px; border-radius: 999px;
        opacity: 0; transition: opacity 0.25s ease; pointer-events: none; user-select: none;
      }

      /* A full-screen black mask, not a modal over the city. The dim-and-card version kept the
         frozen city legible behind a panel, and the panel's edges were the loudest thing on the
         screen — a hard blackout puts the run's numbers on nothing at all, which is what makes
         them the ending rather than an overlay on top of one. */
      #run-end {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
        /* Above every other overlay (the toast sits at 25, the tweak toggle and the rider chips at
           20). Without a z-index of its own the blackout paints *under* them, so the waiting-rider
           chips stayed lit in the bottom-left corner of the game-over screen — and a chip that is
           still on top also swallows the tap that skips the tally. */
        z-index: 30;
        background: rgba(0, 0, 0, 0.95); color: #fff; text-align: center;
        /* Centred by `margin: auto` on the card rather than by `justify-content`: if the content
           ever outgrows a short viewport, a centred flex line clips its own overflow at the *top*,
           where the title is. This way it scrolls instead. */
        overflow-y: auto; padding: 24px 16px;
        font: 500 16px/1.5 ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
        user-select: none;
      }
      /* `display: flex` above beats the UA stylesheet's `[hidden] { display: none }`, so without
         this the game-over overlay renders from the first frame and dims the whole game. */
      #run-end[hidden] { display: none; }

      #run-end .run-end-card {
        display: flex; flex-direction: column; align-items: center; margin: auto;
        /* No panel of its own — this only holds the content together and gives it a width to be
           measured against. Capped at a phone's content width (390px screen less the 16px gutters
           either side) so the desktop layout *is* the mobile layout: the stats rows push label and
           value to opposite edges, and on a 1280px screen that would otherwise strand a number
           three feet away from its own name. The fail reason wraps here exactly as it does on a
           phone, which is the point. */
        width: 100%; max-width: min(358px, 100%);
      }
      /* Type and rhythm scale with the viewport. Height drives most of it — it is a short viewport
         (a landscape phone) that runs the list past the fold — and the clamps hold the full-size
         layout down to ~560px tall, shrinking it below that so "Play again" stays above the fold
         on a 390px-high phone in landscape. */
      #run-end .run-end-title {
        font-size: clamp(26px, 5.4vh, 40px); font-weight: 800; line-height: 1.1;
        letter-spacing: -0.01em;
      }
      #run-end .run-end-reason { margin-top: 6px; font-size: 15px; opacity: 0.72; }

      /* One stat per row, label pinned to the left edge and value to the right — a ledger, not a
         centred pair. Both edges are then straight lines down the block, which is what lets four
         rows of identically-styled text read as four separate stats. The label column takes the
         slack (`1fr`) so the values stay flush right however long the names get. */
      #run-end .run-end-stats {
        display: grid; grid-template-columns: 1fr auto; width: 100%;
        column-gap: clamp(12px, 2.4vh, 20px); row-gap: clamp(8px, 2.3vh, 16px);
        margin-top: clamp(12px, 3.8vh, 30px);
      }
      /* The wrapper exists so the reveal can animate a stat as a unit; `display: contents` drops it
         out of the layout so its label and value are grid items of the row above, which is what
         keeps every row on the same two edges. */
      #run-end .stat { display: contents; }
      /* Label and value are deliberately the same size, weight and colour — the small grey caption
         over a big yellow number made the label look like chrome and the number like the content,
         when the pairing *is* the content. Same type for both makes each row one phrase:
         "Fares  9". */
      /* Sized against whichever axis is tighter. Height is the usual constraint for the list as a
         whole, but a side-by-side row has a width to fit too: "Top Speed  54 mph" set at 30px is
         ~290px wide and would run past the gutters of a 320px phone, where `nowrap` pushes it off
         the screen rather than wrapping it. */
      #run-end .stat-label,
      #run-end .stat-value {
        font-size: clamp(19px, min(3.9vh, 7.2vw), 30px); font-weight: 800; line-height: 1.15;
        color: #F5C130; white-space: nowrap;
      }
      /* Each entrance is anchored to the edge its text is aligned to — the label's fade-in from
         1.55x and the value's landing bump both grow inward, toward the slack between them, rather
         than out past the container. Scaling from the default centre made each row nudge sideways
         as it landed, and pushed the label's oversized first frame off the left edge. */
      #run-end .stat-label { text-align: left;  transform-origin: left center; }
      #run-end .stat-value { text-align: right; transform-origin: right center; }
      /* Tabular figures so a rolling counter doesn't jitter its own width as the digits change,
         and the column stays put while a row counts. */
      #run-end .stat-value { font-variant-numeric: tabular-nums; }

      /* Same pill treatment as #boost — the retry action reads as the primary yellow button. */
      #run-end .retry {
        margin-top: clamp(14px, 3.5vh, 28px); padding: 14px 26px; border-radius: 999px; cursor: pointer;
        border: 2px solid #16120a; background: #F5C130; color: #16120a;
        font: 800 17px/1 ui-rounded, "SF Pro Rounded", "Avenir Next", system-ui, sans-serif;
        letter-spacing: 0.02em; white-space: nowrap;
        transition: box-shadow 0.15s ease, transform 0.1s ease;
      }
      #run-end .retry:active { transform: scale(0.95); }
      /* Disabled while the stats count themselves out — it is transparent until its entrance, and
         a pill you can click before you can see it reloads the run out from under the tally. The
         pointer has to pass *through* it while it waits: a tap there is a tap on the overlay, which
         is what skips to the end of the sequence. */
      #run-end .retry:disabled { pointer-events: none; }

      /* The Loco Mode pill and the ⚙️ tweak toggle are gameplay controls; once the run is over
         they are noise behind the retry pill. */
      body.game-over #boost, body.game-over #dbg-toggle, body.game-over #dbg-panel { display: none; }

      body.shot-mode #hud, body.shot-mode #toast, body.shot-mode #run-end { display: none; }

      #boost {
        position: fixed; bottom: 26px; left: 26px; z-index: 20;
        padding: 14px 26px; border-radius: 999px; cursor: pointer;
        /* Black outline so the pill holds its shape against pale asphalt and the yellow taxi. */
        border: 2px solid #16120a;
        font: 800 17px/1 ui-rounded, "SF Pro Rounded", "Avenir Next", system-ui, sans-serif;
        letter-spacing: 0.02em; color: #16120a; white-space: nowrap;
        /* Hold-to-enable, so kill the mobile long-press UI: no text selection, no callout,
           no double-tap zoom pause between the press and the boost engaging. */
        user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
        touch-action: manipulation;
        /* The dial drains left-to-right rather than around a circle, because the button is now a
           pill. Same reading as the fare ring: filled means time remaining. The fallback matches
           the starting third, so the frame before the loop first sets --pct doesn't flash full. */
        background: linear-gradient(90deg, #F5C130 var(--pct, 33.3%), rgba(255, 255, 255, 0.18) 0);
        transition: box-shadow 0.15s ease, transform 0.1s ease;
      }
      #boost.is-active {
        /* Solid white behind the drained portion, not a translucent wash — over pale asphalt the
           translucent version read as the same tan as the road and the dial lost its edge. */
        background: linear-gradient(90deg, #FFE873 var(--pct, 100%), #fff 0);
        box-shadow: 0 0 30px rgba(255, 232, 115, 0.85);
      }
      /* A mirror of the dial floated above the pill, only shown while the button is active. The
         finger holding the button covers the fill on mobile; this thin bar reads the same `--pct`
         and stays visible above the touch. Width tracks the pill (left/right pinned to 0), so it
         resizes with the button and stays perfectly aligned. Offset is generous — a thumb pressing
         the pill can easily cover ~40px above it, and an earlier 8px gap still landed under the
         knuckle on phones. */
      #boost::before {
        content: ''; position: absolute; left: 0; right: 0; bottom: calc(100% + 56px);
        height: 12px; border-radius: 100px; border: 2px solid #16120a;
        background: linear-gradient(90deg, #FFE873 var(--pct, 100%), #fff 0);
        opacity: 0; transform: translateY(4px);
        transition: opacity 0.12s ease, transform 0.12s ease;
        pointer-events: none;
      }
      #boost.is-active::before { opacity: 1; transform: translateY(0); }
      /* Desktop has a cursor, not a thumb — nothing covers the pill, so the mirror bar is
         just visual noise. Gate on a fine pointer with hover so hybrid touchscreens (Surface,
         iPad with trackpad) that also expose touch still keep it. */
      @media (hover: hover) and (pointer: fine) {
        #boost::before, #boost.is-active::before { display: none; }
      }
      /* Empty tank. Nothing refills on its own, so this greyed-out state persists until the next
         drop-off tops it up — it reads as "go earn it", not "wait for it". */
      #boost.is-empty {
        cursor: default; color: rgba(255, 255, 255, 0.5);
        background: linear-gradient(90deg, #6f8899 var(--pct, 0%), rgba(255, 255, 255, 0.12) 0);
      }
      /* Delivery bonus. Fuel is now *only* ever earned, so the pour is the reward animation and it
         gets the full treatment: the bar overshoots its new mark and springs back, the pill pulses,
         and a bright edge rides the front of the fill. The shapes are here, the envelope comes from
         updateBoostButton in main.js — `--fill` is 0..1 for "fuel is arriving" and `--pulse` is the
         throb inside it. Driving the alpha from a variable rather than a keyframe is what lets the
         glow fade out smoothly however long the pour ran, instead of snapping off when a fixed
         animation ends. Listed after .is-active so a top-up collected mid-boost still shows.

         An earlier version was a one-shot green flash matching the flying "$20". Green read as
         "money", which is what the earnings pop already says — yellow says *this is boost*, which
         is the thing the player has to notice, and pulsing for exactly as long as fuel is landing
         ties it to the bar's movement rather than to a fixed 0.65s. */
      #boost.is-filling {
        /* Every property here is rewritten per frame, so any transition at all smears the 8Hz
           throb flat — 0.1s of ease against a 125ms period leaves almost nothing moving. */
        transition: none;
        box-shadow: 0 0 calc(14px + 26px * var(--pulse, 0)) rgba(245, 193, 48, calc(0.95 * var(--fill, 0)));
        /* The pill itself flutters, not just its glow. 3.5% is a couple of pixels either side —
           enough to catch the eye at the edge of vision, which is where this button is while the
           player is watching the road. */
        transform: scale(calc(1 + 0.035 * var(--pulse, 0)));
      }
      /* The leading edge of the fill: a soft vertical bar sitting on the fill front, blurred so it
         reads as light spilling off the advancing fuel rather than as a hairline UI divider. It
         tracks the same --pct as the gradient — both resolve against the padding box, so they stay
         locked together — and inherits the fill envelope, fading in as fuel starts arriving and out
         as the bar springs to rest. Inset a couple of px top and bottom so the blur bleeds to about
         the pill's edge instead of poking out of the rounded ends. */
      #boost::after {
        content: ''; position: absolute; top: 1px; bottom: 1px;
        left: var(--pct, 33.3%); width: 4px; margin-left: -2px;
        border-radius: 4px;
        /* Near-white core with a yellow bloom, not a yellow line: the fill behind it is already
           #F5C130 and the empty track ahead of it is pale, so a yellow-on-yellow line washed out
           to nothing at 3px/blur 2.5px. The core carries the position, the bloom carries the
           colour. Blur stays under half the core width or the line stops reading as an edge. */
        background: #FFFDF2;
        box-shadow: 0 0 9px 3px rgba(255, 213, 74, 0.95);
        filter: blur(1.4px);
        opacity: var(--fill, 0);
        pointer-events: none;
      }
      /* A pill fluttering at 8Hz is exactly what someone who asked for less motion doesn't want.
         The glow and the leading edge still carry the top-up; only the movement goes. */
      @media (prefers-reduced-motion: reduce) {
        #boost.is-filling { transform: none; }
      }
      /* Last of the #boost rules on purpose: the press dip is the one piece of feedback that has to
         win over everything else, and both the throb and the reduced-motion override set a
         transform at equal specificity — a media query adds no weight — so a top-up landing under
         the player's thumb would otherwise swallow it. */
      #boost:active { transform: scale(0.95); }
      body.shot-mode #boost { display: none; }

      /* Rider finder — one chip per waiting fare, stacked vertically above the Loco Mode pill in
         the bottom-left corner so both live in the same reach zone for a right-thumb hold. Sized
         to the same 49px height as Loco Mode so the two controls read as a matched pair; the
         column grows upward as extra riders spawn, keeping the bottom-most chip anchored just
         above the Loco Mode dial. Offset from the button leaves clearance for the mirror bar that
         floats above the pill while boost is active (see #boost::before). Each chip is a circular
         disc with a conic-gradient ring for the fare's clock — same four-stage colour as the
         in-world timer — and a mini three.js canvas drawing the figure. */
      #rider-finder-stack {
        position: fixed; left: 26px; bottom: 155px; z-index: 20;
        display: flex; flex-direction: column-reverse; align-items: center; gap: 8px;
        pointer-events: none;
      }
      body.shot-mode #rider-finder-stack { display: none; }

      .rider-finder-chip {
        position: relative;
        width: 49px; height: 49px; padding: 0; border: 0; border-radius: 50%;
        cursor: pointer; background: transparent; pointer-events: auto;
        display: grid; place-items: center;
        transition: transform 0.1s ease;
        /* Kill the mobile double-tap-to-zoom and its 300ms click delay: a tap here dispatches
           the taxi and wants to land now, not after the browser has waited to see whether a
           second one is coming. Also suppress the long-press callout and text selection since
           neither has anything to sell on a bare figure canvas. */
        touch-action: manipulation;
        user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
      }
      .rider-finder-chip:active { transform: scale(0.95); }
      .rider-finder-chip[hidden] { display: none; }
      /* Ring: an annulus painted with the fare colour, filling counter-clockwise as the clock
         drains — same reading as the in-world timer. `--pct` and `--ring-color` come from the
         update loop. Widths scaled from the original 72px chip by 49/72 so the ring/chip ratio
         stays the same at the smaller size. */
      .rider-finder-chip::before {
        content: ''; position: absolute; inset: 0; border-radius: 50%;
        background:
          conic-gradient(from -90deg, var(--ring-color, #26E05A) var(--pct, 100%),
                                      rgba(255, 255, 255, 0.15) 0);
        padding: 3px;
        -webkit-mask: radial-gradient(circle, transparent 55%, #000 56%);
                mask: radial-gradient(circle, transparent 55%, #000 56%);
      }
      /* The dark chip the figure stands in front of. Same tint as the toast pill. */
      .rider-finder-chip .chip {
        position: relative; width: 38px; height: 38px; border-radius: 50%;
        background: rgba(24, 44, 58, 0.72);
        display: grid; place-items: center; overflow: hidden;
      }
      .rider-finder-chip canvas { display: block; width: 38px; height: 38px; }

      /* Off-screen drop-off pointer. An arrow that clamps to the viewport edge and rotates to
         point at the drop-off ring, so the direction to drive stays readable when the ring has
         slipped off the frame (portrait, or after panning). Wears the ring's own teal — there is
         only ever one drop-off on the board, so the arrow does not have to identify which fare it
         belongs to, only where that ring is. It also carries more weight than it used to: the
         drop-off no longer floats a marker above the rooftops, so this is what says "over there"
         once the ring is out of frame. */
      #dropoff-indicator {
        position: fixed; left: 50%; top: 50%; z-index: 18;
        width: 34px; height: 34px; pointer-events: none; user-select: none;
        transform: translate(-50%, -50%);
      }
      #dropoff-indicator[hidden] { display: none; }
      #dropoff-indicator svg { display: block; width: 100%; height: 100%;
        filter: drop-shadow(0 2px 4px rgba(10, 20, 30, 0.45)); }
      /* Outlined to the same weight as the markers in the world, so the arrow reads as the same
         graphic vocabulary, in the one colour the drop-off has. */
      #dropoff-indicator polygon {
        fill: #5FE0D9;   /* PALETTE.destination — the ring this arrow stands in for */
        stroke: #0a1615; stroke-width: 3; stroke-linejoin: round;
      }
      body.shot-mode #dropoff-indicator { display: none; }

      /* --- "Add to Home Screen" screen — see src/game/homescreen.js -------------
         iOS in a browser tab only, where there is no install affordance to point at and the
         disappearing bottom toolbar resizes the viewport mid-run.

         It does not hide the city, it *sinks* it: the gradient is fully transparent at the top, so
         the skyline and the two HUD counters stay readable, and reaches solid black by the time the
         text starts. Reading the game through it is what says the screen is a step on the way in
         rather than a different place — and it means the black behind the list is genuinely black,
         with no skyline competing with the one thing the player has to read. */
      #home-tip {
        position: fixed; inset: 0;
        /* Above the flying earnings (25), below the run-end blackout (30) — a run that somehow
           ended behind this should still show its own screen on top. */
        z-index: 26;
        display: flex; flex-direction: column; justify-content: flex-end;
        background: linear-gradient(to bottom,
          rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.1) 20%, rgba(0, 0, 0, 0.45) 42%,
          rgba(0, 0, 0, 0.88) 55%, #000 63%);
        color: #fff;
        font-family: ui-rounded, "SF Pro Rounded", "Avenir Next", system-ui, sans-serif;
        /* The whole thing is the dismiss target, as the hint says. No long-press callout, no
           double-tap zoom pause between the press and the game starting. */
        cursor: pointer; touch-action: manipulation;
        user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
      }
      #home-tip[hidden] { display: none; }
      body.shot-mode #home-tip, body.game-over #home-tip { display: none; }

      /* Bottom-anchored, and the bottom inset clears the home indicator on a notched phone. The
         gutter is a share of the width rather than a fixed pixel count so the block sits the same
         distance in on a 320px phone as on a 430px one.

         **One size drives the whole block.** The steps are 1em and every other size and gap is a
         ratio of them, so the block scales as a unit — and so the fit-to-width pass in
         homescreen.js has exactly one knob to turn. It is clamped against *both* axes: width is
         what the long third step has to fit across, height is what the whole block has to fit down
         (a landscape phone is 390px tall, and 7.2vw of an 844px-wide viewport would be 60px type on
         a screen with no room for it). Same technique as the run-end stats, for the same reason. */
      #home-tip .home-tip-sheet {
        font-size: clamp(18px, min(7.2vw, 5vh), 30px);
        padding-left: clamp(20px, 7.5vw, 46px);
        padding-right: clamp(20px, 7.5vw, 46px);
        padding-bottom: calc(1em + env(safe-area-inset-bottom, 0px));
      }

      #home-tip .home-tip-lead {
        font-size: 0.87em; font-weight: 600; line-height: 1.25;
        /* Never wraps: it is one phrase, and a two-line lead pushes the list down the screen and
           stops the block reading as a heading over a list. The fit pass keeps it honest. */
        white-space: nowrap;
        /* A shade under the steps' white: it is the sentence *introducing* the list, and setting
           both at full strength made the colon read as another step. */
        color: rgba(255, 255, 255, 0.92);
      }

      /* Two columns — the numbers on one straight edge, the labels on another. `display: contents`
         on the items drops them out of the layout so each `li`'s two spans become grid items of the
         same row, which is what holds both edges straight however wide the labels get. (The run-end
         stats use the same trick for the same reason.)

         Margins in `em` of the steps rather than of the neighbours, so the vertical rhythm is a
         property of the one size above: both gaps sit on this element, because an `em` margin on
         the hint would resolve against the hint's own smaller size and quietly halve itself. */
      #home-tip .home-tip-steps {
        list-style: none; display: grid; grid-template-columns: auto 1fr;
        column-gap: 0.4em; row-gap: 0.85em; margin: 0.95em 0 0.9em;
        font-weight: 800; line-height: 1.15;
      }
      #home-tip .home-tip-steps li { display: contents; }
      /* Tabular figures so 1./2./3. are all the same width and the labels start on one edge even
           though the numbers are set in the same heavy weight as the words. */
      #home-tip .home-tip-steps .step-index { font-variant-numeric: tabular-nums; }
      /* The longest label — "Add to Home Screen" — is what sets the type size on a narrow phone;
         letting it wrap under its own number instead would break the second edge the grid exists
         to hold. */
      #home-tip .home-tip-steps .step-name { white-space: nowrap; }

      /* Sized and positioned in `em` so each glyph tracks the line it sits on. Drawn as strokes,
         a step down from the label's white — it stands for a control on the browser's chrome, not
         for another word in the sentence. */
      #home-tip .home-tip-steps svg {
        width: 1.05em; height: 1.05em; vertical-align: -0.19em; margin-left: 0.24em;
        fill: none; stroke: currentColor; stroke-width: 1.7;
        stroke-linecap: round; stroke-linejoin: round;
        color: rgba(255, 255, 255, 0.62);
      }
      /* The dots inside Chrome's ⋯ ring are solid and brighter than the ring itself — that is how
         the button actually reads at a glance. */
      #home-tip .home-tip-steps svg .dot { fill: rgba(255, 255, 255, 0.95); stroke: none; }

      #home-tip .home-tip-hint {
        font-size: 0.52em; font-weight: 600;
        /* Quiet on purpose. It is an instruction about the screen rather than part of the list, and
           at full strength it competed with the step it sits under. */
        color: rgba(255, 255, 255, 0.45);
      }

      /* --- tweak panel --- */
      #dbg-toggle {
        position: fixed; top: 16px; right: 16px; z-index: 20;
        width: 38px; height: 38px; border: 0; border-radius: 10px; cursor: pointer;
        font-size: 18px; line-height: 1; background: rgba(20, 34, 44, 0.72); color: #fff;
      }
      #dbg-toggle:hover { background: rgba(20, 34, 44, 0.9); }

      #dbg-panel {
        position: fixed; top: 62px; right: 16px; z-index: 20; width: 258px;
        padding: 12px 14px 14px; border-radius: 12px;
        background: rgba(18, 30, 39, 0.92); color: #e8eef2;
        font: 500 12px/1.4 ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
        max-height: calc(100vh - 90px); overflow: auto;
      }
      #dbg-panel[hidden] { display: none; }
      #dbg-panel h4 {
        margin: 10px 0 6px; font-size: 11px; text-transform: uppercase;
        letter-spacing: 0.08em; opacity: 0.55; font-weight: 700;
      }
      #dbg-panel h4:first-child { margin-top: 0; }
      .dbg-row { display: grid; grid-template-columns: 84px 1fr; gap: 4px 8px; align-items: center; margin-bottom: 7px; }
      .dbg-row span { opacity: 0.8; }
      .dbg-row em { grid-column: 2; font-style: normal; font-size: 11px; opacity: 0.6; font-variant-numeric: tabular-nums; }
      .dbg-row input[type="range"] { width: 100%; accent-color: #F5C130; }
      .dbg-row input[type="color"] { width: 100%; height: 22px; padding: 0; border: 0; background: none; }
      .dbg-row select {
        width: 100%; padding: 3px 4px; border: 0; border-radius: 6px;
        background: rgba(0, 0, 0, 0.35); color: #cfe0ea; font: 500 11px/1.3 inherit;
      }
      .dbg-actions { display: flex; gap: 6px; margin-top: 10px; }
      .dbg-wide {
        width: 100%; margin-top: 10px; padding: 7px 4px; border: 0; border-radius: 8px;
        cursor: pointer; background: #4E7FC0; color: #fff; font: 700 11px/1 inherit;
      }
      .dbg-out {
        width: 100%; margin-top: 8px; padding: 7px; border: 0; border-radius: 8px; resize: vertical;
        background: rgba(0, 0, 0, 0.35); color: #cfe0ea;
        font: 500 10px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .dbg-actions button {
        flex: 1; padding: 7px 4px; border: 0; border-radius: 8px; cursor: pointer;
        background: #F5C130; color: #23303a; font: 700 11px/1 inherit;
      }
      body.shot-mode #dbg-toggle, body.shot-mode #dbg-panel { display: none; }

      #error {
        position: fixed; inset: 0; padding: 24px; background: #2b1b1b; color: #ffb4a8;
        font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: pre-wrap; overflow: auto; z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="hud">
      <div class="money">$<span id="money">0</span></div>
    </div>
    <div id="streak"><span id="streak-count">0</span>x</div>

    <button id="boost" type="button" aria-label="Punch It">Punch It</button>
    <div id="rider-finder-stack" role="group" aria-label="Waiting riders"></div>
    <div id="dropoff-indicator" aria-hidden="true" hidden>
      <svg viewBox="-16 -16 32 32">
        <polygon points="13,0 -9,-10 -4,0 -9,10" />
      </svg>
    </div>
    <div id="toast"></div>
    <div id="home-tip" hidden></div>
    <div id="run-end" hidden></div>

    <div id="error" hidden></div>
    <script>
      window.addEventListener('error', (e) => {
        const el = document.getElementById('error');
        el.hidden = false;
        el.textContent += `${e.message}\n  at ${e.filename}:${e.lineno}:${e.colno}\n${e.error?.stack ?? ''}\n\n`;
      });
      window.addEventListener('unhandledrejection', (e) => {
        const el = document.getElementById('error');
        el.hidden = false;
        el.textContent += `Unhandled rejection: ${e.reason?.stack ?? e.reason}\n\n`;
      });
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
