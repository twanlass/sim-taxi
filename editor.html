<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sim Taxi 🚕 — Vehicle Editor</title>
    <link rel="icon" type="image/svg+xml" href="/apple-touch-icon.svg" />
    <style>
      :root { color-scheme: light; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #dcedf7; }
      body {
        font: 500 13px/1.45 ui-rounded, "SF Pro Rounded", "Avenir Next", system-ui, sans-serif;
        color: #22303a;
      }
      canvas { display: block; touch-action: none; }

      #title {
        position: fixed; top: 16px; left: 18px; pointer-events: none; user-select: none;
        color: #fff; text-shadow: 0 2px 6px rgba(20, 40, 55, 0.65);
      }
      #title strong { font-size: 20px; font-weight: 800; }
      #title .sub { font-size: 12px; opacity: 0.85; }
      #title .sub a { color: #fff; pointer-events: auto; }

      /* The control panel. Same visual family as the game's ⚙️ panel: a light card over the sky. */
      #panel {
        position: fixed; top: 0; right: 0; bottom: 0; width: 292px;
        background: rgba(250, 252, 254, 0.94); backdrop-filter: blur(6px);
        border-left: 1px solid rgba(34, 48, 58, 0.12);
        overflow-y: auto; padding: 14px 16px 24px; user-select: none;
      }
      #panel h2 {
        font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;
        color: #5a6b78; margin: 16px 0 6px;
      }
      #panel h2:first-child { margin-top: 2px; }

      .row { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
      .row label { flex: 0 0 84px; font-size: 12px; color: #3c4c58; }
      .row input[type="range"] { flex: 1; accent-color: #f5c130; min-width: 0; }
      .row output {
        flex: 0 0 38px; text-align: right; font-size: 11px; color: #5a6b78;
        font-variant-numeric: tabular-nums;
      }

      .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0; }
      .chips button {
        padding: 5px 10px; border-radius: 999px; border: 1px solid rgba(34, 48, 58, 0.2);
        background: #fff; font: 600 12px/1 inherit; font-family: inherit; cursor: pointer;
        color: #3c4c58;
      }
      .chips button:hover { border-color: rgba(34, 48, 58, 0.45); }
      .chips button.on { background: #f5c130; border-color: #b98f16; color: #16120a; }

      .swatches { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 4px 0; }
      .swatches button {
        width: 24px; height: 24px; border-radius: 50%; cursor: pointer;
        border: 2px solid rgba(34, 48, 58, 0.18);
      }
      .swatches button.on { border-color: #16120a; }
      .swatches input[type="color"] {
        width: 28px; height: 28px; border: none; background: none; cursor: pointer; padding: 0;
      }

      .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
      .actions button {
        padding: 8px 12px; border-radius: 10px; border: 1px solid rgba(34, 48, 58, 0.2);
        background: #fff; font: 700 12px/1 inherit; font-family: inherit; cursor: pointer;
        color: #22303a;
      }
      .actions button.primary { background: #f5c130; border-color: #b98f16; }
      .actions button:hover { border-color: rgba(34, 48, 58, 0.45); }

      #garage-list { width: 100%; margin: 4px 0; padding: 6px; border-radius: 8px;
        border: 1px solid rgba(34, 48, 58, 0.2); font-family: inherit; font-size: 12px; }
      #spec-name { width: 100%; margin: 4px 0; padding: 7px 9px; border-radius: 8px;
        border: 1px solid rgba(34, 48, 58, 0.2); font-family: inherit; font-size: 13px; }

      #stats { font-size: 11px; color: #5a6b78; margin-top: 10px; font-variant-numeric: tabular-nums; }

      /* Frames the play-zoom inset rendered into the main canvas's corner via scissor. */
      #pip-frame {
        position: fixed; pointer-events: none; border: 2px solid rgba(255, 255, 255, 0.85);
        border-radius: 8px; box-shadow: 0 4px 16px rgba(20, 40, 55, 0.3);
      }
      #pip-frame span {
        position: absolute; top: -22px; left: 2px; font-size: 11px; font-weight: 700;
        color: #fff; text-shadow: 0 1px 4px rgba(20, 40, 55, 0.7); white-space: nowrap;
      }

      #toast {
        position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
        font: 600 14px/1 inherit; font-family: inherit;
        color: #fff; background: rgba(24, 44, 58, 0.8); padding: 10px 18px; border-radius: 999px;
        opacity: 0; transition: opacity 0.25s ease; pointer-events: none; user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="title">
      <strong>Vehicle editor</strong>
      <div class="sub">drag to orbit · wheel to zoom · <a href="/">back to the game</a></div>
    </div>
    <div id="panel"></div>
    <div id="pip-frame" hidden><span>play zoom — how it reads in game</span></div>
    <div id="toast"></div>
    <script type="module" src="/src/editor/editor.js"></script>
  </body>
</html>
