<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The inline text icons' render page (tools/make-inline-icons.mjs) — not part of the game and
         not in the build. Open it by hand at http://localhost:5173/tools/inline-icon/ to look at
         the framing: the big render, then each icon at 1x and 3x on a white card. -->
    <title>Rocket Rides inline icons</title>
    <style>
      html, body { margin: 0; background: #e9e6ef; font: 600 17px 'Space Grotesk', system-ui, sans-serif; }
      body { display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; align-items: flex-end; }
      canvas, img { display: block; }
      #render { width: 384px; height: 256px; background: #fff; }
      p { background: #fff; padding: 12px 16px; border-radius: 14px; width: 300px; line-height: 1.3; }
      p img { display: inline-block; height: 1.15em; vertical-align: -0.18em; }
    </style>
  </head>
  <body>
    <script>
      addEventListener('error', (e) => { window.__iconError = String(e.error?.stack ?? e.message); });
    </script>
    <script type="module" src="./inline-icon.js"></script>
  </body>
</html>
