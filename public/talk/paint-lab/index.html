<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Car Paint Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --panel:#f2f3f5; --ink:#1c2127; --muted:#5b646e; --line:#cfd4da; --field:#e3e6ea;
  --paint:#1f4fa8; --flip:#0b1a3a;
  --sans:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cond:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){color-scheme:dark;--panel:#1d2126;--ink:#e5e8eb;--muted:#9aa3ad;--line:#30363d;--field:#272c32}
}
:root[data-theme="dark"]{color-scheme:dark;--panel:#1d2126;--ink:#e5e8eb;--muted:#9aa3ad;--line:#30363d;--field:#272c32}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--panel);color:var(--ink);font:15px/1.45 var(--sans)}
.app{height:100%;display:grid;grid-template-columns:1fr minmax(320px,380px)}
.stage{position:relative;min-height:0;overflow:hidden;transition:background .6s}
.stage[data-env="studio"]{background:radial-gradient(120% 90% at 50% 20%,#4a4f56 0%,#24272b 60%,#151719 100%)}
.stage[data-env="sunset"]{background:linear-gradient(180deg,#3a4a6a 0%,#c98a5c 52%,#3b2e2a 53%,#1c1715 100%)}
.stage[data-env="overcast"]{background:linear-gradient(180deg,#e9ecef 0%,#c9ced3 55%,#6d7176 56%,#4a4d51 100%)}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
.hint{position:absolute;left:16px;bottom:14px;margin:0;font:500 13px var(--sans);color:#fff;opacity:.7;pointer-events:none}
.panel{min-height:0;overflow-y:auto;border-left:1px solid var(--line);padding:20px 20px 40px}
h1{font:700 26px/1.1 var(--cond);margin:0 0 4px;letter-spacing:.01em}
.lede{margin:0 0 16px;color:var(--muted);font-size:14px}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.presets button,.seg button{font:500 13px var(--sans);color:var(--ink);background:var(--field);border:1px solid transparent;border-radius:999px;padding:6px 11px;cursor:pointer}
.presets button[aria-pressed="true"],.seg button[aria-pressed="true"]{border-color:var(--ink)}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.stack{display:grid;gap:0;border-radius:6px;overflow:hidden;margin-bottom:22px;border:1px solid var(--line)}
.stack button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:0 12px;font:600 13px var(--cond);letter-spacing:.02em;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);transition:opacity .2s}
.stack button:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.stack button span:last-child{font:500 12px var(--sans);opacity:.85}
.stack .l-clear{height:30px;background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(200,215,230,.35)),var(--paint);color:#10151b;text-shadow:none}
.stack .l-flake{height:34px;background:radial-gradient(circle,rgba(255,255,255,.9) 0 1px,transparent 1.6px) 0 0/7px 7px,radial-gradient(circle,rgba(255,255,255,.5) 0 1px,transparent 1.6px) 3px 4px/9px 9px,var(--paint)}
.stack .l-flip{height:34px;background:linear-gradient(90deg,var(--paint),var(--flip))}
.stack .l-base{height:26px;background:#7f858c}
.stack button.off{opacity:.3}
section{border-top:1px solid var(--line);padding:14px 0 6px}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
h2{font:600 18px/1.2 var(--cond);margin:0}
.note{margin:4px 0 10px;color:var(--muted);font-size:13.5px}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 10px;margin:8px 0}
.row label{font-size:13.5px}
.row output{font:500 12.5px var(--sans);color:var(--muted);font-variant-numeric:tabular-nums}
.row input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--ink);margin:2px 0 0}
.row input[type=color]{width:44px;height:28px;border:1px solid var(--line);border-radius:6px;padding:2px;background:var(--field)}
.switch{position:relative;width:40px;height:22px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .2s;pointer-events:none}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.switch input:checked+span{background:var(--ink)}
.switch input:checked+span::after{transform:translateX(18px);background:var(--panel)}
.switch input:focus-visible+span{outline:2px solid var(--ink);outline-offset:2px}
.check{display:flex;align-items:center;justify-content:space-between;margin:10px 0;font-size:13.5px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:46% 1fr}
  .panel{border-left:0;border-top:1px solid var(--line);padding:16px 16px 32px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage" data-env="studio">
    <canvas id="c" aria-label="3D paint sample. Drag to rotate."></canvas>
    <p class="hint">Drag to turn it</p>
  </div>
  <div class="panel">
    <h1>Car Paint Lab</h1>
    <p class="lede">Paint is a stack of layers. Turn each one off to see what it contributes.</p>
    <div class="presets" id="presets"></div>
    <div class="stack" aria-label="Paint layers, top to bottom">
      <button class="l-clear" data-jump="clear"><span>Clearcoat</span><span>lacquer</span></button>
      <button class="l-flake" data-jump="flake"><span>Flakes</span><span>aluminium</span></button>
      <button class="l-flip" data-jump="flip"><span>Flip-flop</span><span>pigment shift</span></button>
      <button class="l-base" data-jump="base"><span>Base coat</span><span>colour</span></button>
    </div>
    <div id="sections"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script>
(() => {
const $ = s => document.querySelector(s);
const canvas = $('#c'), stage = $('#stage');

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.physicallyCorrectLights = true;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
const key = new THREE.DirectionalLight(0xffffff, 3);
scene.add(key);

// ---------- environments (built procedurally, no image files) ----------
const pmrem = new THREE.PMREMGenerator(renderer);
const envCache = {};
function basic(i, tint){ const c = new THREE.Color(tint||0xffffff).multiplyScalar(i); return new THREE.MeshBasicMaterial({color:c, side:THREE.DoubleSide}); }
function gradientSky(stops){
  const g = new THREE.SphereGeometry(50, 64, 32), pos = g.attributes.position, cols = [];
  const tmp = new THREE.Color();
  for (let i=0;i<pos.count;i++){
    const y = pos.getY(i)/50; // -1..1
    let a = stops[0], b = stops[stops.length-1];
    for (let k=0;k<stops.length-1;k++) if (y>=stops[k][0] && y<=stops[k+1][0]) { a=stops[k]; b=stops[k+1]; }
    const t = (y-a[0])/Math.max(1e-5,(b[0]-a[0]));
    tmp.copy(a[1]).lerp(b[1], THREE.MathUtils.clamp(t,0,1)); cols.push(tmp.r,tmp.g,tmp.b);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(cols,3));
  return new THREE.Mesh(g, new THREE.MeshBasicMaterial({vertexColors:true, side:THREE.BackSide}));
}
const C = (h,s) => new THREE.Color(h).multiplyScalar(s);
function buildEnv(name){
  if (envCache[name]) return envCache[name];
  const s = new THREE.Scene();
  if (name==='studio'){
    s.add(new THREE.Mesh(new THREE.BoxGeometry(24,14,24), new THREE.MeshBasicMaterial({color:C(0x1c1e21,1), side:THREE.BackSide})));
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(24,24), basic(0.22)); floor.rotation.x=-Math.PI/2; floor.position.y=-3; s.add(floor);
    const strip = (w,h,x,y,z,i) => { const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h), basic(i)); m.position.set(x,y,z); m.lookAt(0,0,0); s.add(m); };
    strip(14,1.1, 0,6.5,-1.5, 9); strip(14,1.1, 0,6.5,1.8, 6);       // overhead strips: the long highlight lines
    strip(1.6,6, -9,1,2, 4);  strip(1.6,6, 9,1,-2, 2.5);             // side softboxes
    strip(10,1.2, 0,1.5,-10, 1.5);                                   // rim
  } else if (name==='sunset'){
    s.add(gradientSky([[-1,C(0x2a2018,.15)],[-0.02,C(0x3b2a20,.35)],[0,C(0xffa860,2.2)],[0.12,C(0xff8c5a,1.1)],[0.45,C(0x5a6fa0,.45)],[1,C(0x1d2a4a,.25)]]));
    const sun = new THREE.Mesh(new THREE.SphereGeometry(2.2,24,16), basic(40, 0xffd2a0)); sun.position.set(-34,5,-34); s.add(sun);
  } else {
    s.add(gradientSky([[-1,C(0x3a3d40,.2)],[-0.02,C(0x55595d,.35)],[0,C(0xd8dde2,1.3)],[1,C(0xf4f6f8,1.6)]]));
  }
  return envCache[name] = pmrem.fromScene(s, 0.02).texture;
}
const keyRig = {
  studio:{pos:[1,7,2], col:0xffffff, k:1},
  sunset:{pos:[-6,1.2,-5], col:0xffb37a, k:1.3},
  overcast:{pos:[0,8,1], col:0xeef2ff, k:0.35}
};

// ---------- the paint shader ----------
const U = {
  uFlakeScale:{value:160}, uFlakeAmt:{value:.45}, uFlakeDensity:{value:.8}, uFlakeOn:{value:1}, uLod:{value:1},
  uFlipColor:{value:new THREE.Color()}, uFlipAmt:{value:.7}, uFlipPow:{value:1.6},
  uPeel:{value:.2}, uPeelScale:{value:14}, uNM:{value:new THREE.Matrix3()}
};
const mat = new THREE.MeshPhysicalMaterial({metalness:.65, roughness:.38, clearcoat:1, clearcoatRoughness:.03});

const header = `
varying vec3 vObjPos;
uniform float uFlakeScale, uFlakeAmt, uFlakeDensity, uFlakeOn, uLod, uFlipAmt, uFlipPow, uPeel, uPeelScale;
uniform vec3 uFlipColor;
uniform mat3 uNM;
vec3 hash33(vec3 p){ p=fract(p*vec3(.1031,.1030,.0973)); p+=dot(p,p.yxz+33.33); return fract((p.xxy+p.yxx)*p.zyx); }
float hash13(vec3 p){ p=fract(p*.1031); p+=dot(p,p.zyx+31.32); return fract((p.x+p.y)*p.z); }
float vnoise(vec3 p){
  vec3 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  float a=hash13(i), b=hash13(i+vec3(1,0,0)), c=hash13(i+vec3(0,1,0)), d=hash13(i+vec3(1,1,0));
  float e=hash13(i+vec3(0,0,1)), g=hash13(i+vec3(1,0,1)), h=hash13(i+vec3(0,1,1)), k=hash13(i+vec3(1,1,1));
  return mix(mix(mix(a,b,f.x),mix(c,d,f.x),f.y), mix(mix(e,g,f.x),mix(h,k,f.x),f.y), f.z);
}
`;
const flakeCode = `
{
  // Flip-flop: tint the pigment toward a second colour at grazing angles
  float ndv = clamp(dot(geometryNormal, normalize(vViewPosition)), 0., 1.);
  diffuseColor.rgb = mix(diffuseColor.rgb, uFlipColor, pow(1. - ndv, uFlipPow) * uFlipAmt);

  // Flakes: every 3D cell is a tiny mirror with its own random tilt
  vec3 fp = vObjPos * uFlakeScale;
  vec3 cell = floor(fp);
  float present = step(1. - uFlakeDensity, hash13(cell + 7.));
  vec3 tilt = normalize(hash33(cell) * 2. - 1.);
  // LOD: when a flake is smaller than a pixel, fade the tilt and fold it into roughness instead of shimmering
  float px = length(fwidth(fp));
  float lod = uLod > .5 ? 1. - smoothstep(.35, 1.2, px) : 1.;
  float k = uFlakeAmt * present * uFlakeOn;
  normal = normalize(normal + normalize(uNM * tilt) * k * lod);
  roughnessFactor = mix(roughnessFactor, max(roughnessFactor, .25 + uFlakeAmt * .4), (1. - lod) * uFlakeOn * uFlakeDensity * step(.5, uLod));
}
`;
const peelCode = `
#ifdef USE_CLEARCOAT
{
  // Orange peel: low-frequency waviness in the lacquer only
  vec3 pp = vObjPos * uPeelScale; float e = .08, n0 = vnoise(pp);
  vec3 g = vec3(vnoise(pp+vec3(e,0,0))-n0, vnoise(pp+vec3(0,e,0))-n0, vnoise(pp+vec3(0,0,e))-n0) / e;
  clearcoatNormal = normalize(clearcoatNormal + uNM * g * uPeel * .12);
}
#endif
`;
mat.onBeforeCompile = sh => {
  Object.assign(sh.uniforms, U);
  sh.vertexShader = 'varying vec3 vObjPos;\n' + sh.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\nvObjPos = position;');
  sh.fragmentShader = header + sh.fragmentShader
    .replace('#include <normal_fragment_maps>', '#include <normal_fragment_maps>\n' + flakeCode)
    .replace('#include <clearcoat_normal_fragment_begin>', '#include <clearcoat_normal_fragment_begin>\n' + peelCode);
};

const geos = {
  Sphere: () => new THREE.SphereGeometry(1, 160, 120),
  Knot: () => new THREE.TorusKnotGeometry(.62, .24, 360, 64),
  Capsule: () => new THREE.CapsuleGeometry(.6, 1, 32, 96).rotateZ(Math.PI/2),
  Cube: () => new THREE.BoxGeometry(1.3, 1.3, 1.3, 8, 8, 8)
};
const mesh = new THREE.Mesh(geos.Sphere(), mat);
scene.add(mesh);

// ---------- state ----------
const S = {};
const presets = {
  'Showroom blue': {base:'#1f4fa8', metal:.65, rough:.38, flakeOn:true, flakeAmt:.45, flakeDensity:.8, flakeScale:160, flipOn:true, flip:'#0a1636', flipAmt:.7, flipPow:1.6, clearOn:true, ccR:.03, peel:.2, peelScale:14},
  'Candy red':     {base:'#b00a1e', metal:.85, rough:.25, flakeOn:true, flakeAmt:.3, flakeDensity:.6, flakeScale:220, flipOn:true, flip:'#2a0006', flipAmt:.85, flipPow:1.3, clearOn:true, ccR:.02, peel:.15, peelScale:14},
  'Pearl white':   {base:'#ebe8e2', metal:.2, rough:.3, flakeOn:true, flakeAmt:.25, flakeDensity:.5, flakeScale:260, flipOn:true, flip:'#c4b2e6', flipAmt:.6, flipPow:2.2, clearOn:true, ccR:.03, peel:.2, peelScale:14},
  'Chameleon':     {base:'#16806a', metal:.9, rough:.3, flakeOn:true, flakeAmt:.4, flakeDensity:.7, flakeScale:180, flipOn:true, flip:'#6b1fb0', flipAmt:1, flipPow:1, clearOn:true, ccR:.02, peel:.12, peelScale:14},
  'Satin grey':    {base:'#5a5e63', metal:.5, rough:.55, flakeOn:true, flakeAmt:.2, flakeDensity:.6, flakeScale:200, flipOn:false, flip:'#2c2f33', flipAmt:.4, flipPow:2, clearOn:true, ccR:.35, peel:0, peelScale:14},
  'Plastic (no layers)': {base:'#1f4fa8', metal:0, rough:.4, flakeOn:false, flakeAmt:.45, flakeDensity:.8, flakeScale:160, flipOn:false, flip:'#0a1636', flipAmt:.7, flipPow:1.6, clearOn:false, ccR:.03, peel:.2, peelScale:14}
};
Object.assign(S, presets['Showroom blue'], {
  lod:true, env:'studio', envInt:1, keyInt:3, dist:4.6, shape:'Sphere',
  spin: !matchMedia('(prefers-reduced-motion: reduce)').matches
});

function apply(){
  mat.color.set(S.base).convertSRGBToLinear();
  mat.metalness = S.metal; mat.roughness = S.rough;
  mat.clearcoat = S.clearOn ? 1 : 0; mat.clearcoatRoughness = S.ccR;
  mat.envMapIntensity = S.envInt;
  U.uFlakeOn.value = S.flakeOn ? 1 : 0; U.uFlakeAmt.value = S.flakeAmt; U.uFlakeDensity.value = S.flakeDensity;
  U.uFlakeScale.value = S.flakeScale; U.uLod.value = S.lod ? 1 : 0;
  U.uFlipColor.value.set(S.flip).convertSRGBToLinear(); U.uFlipAmt.value = S.flipOn ? S.flipAmt : 0; U.uFlipPow.value = S.flipPow;
  U.uPeel.value = S.peel; U.uPeelScale.value = S.peelScale;
  scene.environment = buildEnv(S.env); stage.dataset.env = S.env;
  const r = keyRig[S.env]; key.position.set(...r.pos); key.color.set(r.col); key.intensity = S.keyInt * r.k;
  document.documentElement.style.setProperty('--paint', S.base);
  document.documentElement.style.setProperty('--flip', S.flip);
  document.querySelector('.l-clear').classList.toggle('off', !S.clearOn);
  document.querySelector('.l-flake').classList.toggle('off', !S.flakeOn);
  document.querySelector('.l-flip').classList.toggle('off', !S.flipOn);
}

// ---------- UI ----------
const sections = [
  {id:'clear', name:'Clearcoat', toggle:'clearOn', note:'A glass-like lacquer with its own reflection on top of everything. That second, razor-sharp highlight is most of what reads as “wet” paint.',
   ctrls:[['ccR','Roughness',0,.6,.01],['peel','Orange peel',0,1,.01],['peelScale','Peel size',4,40,1]]},
  {id:'flake', name:'Metallic flakes', toggle:'flakeOn', note:'Tiny tilted mirrors suspended in the paint. Up close they glitter; from a distance they should blur into a soft sheen, not shimmer.',
   ctrls:[['flakeAmt','Tilt',0,1,.01],['flakeDensity','Density',0,1,.01],['flakeScale','Fineness',40,400,1],['lod','Fade flakes with distance','check']]},
  {id:'flip', name:'Flip-flop colour', toggle:'flipOn', note:'The pigment shifts hue toward grazing angles, which is why a car looks one colour face-on and another along its curves.',
   ctrls:[['flip','Edge colour','color'],['flipAmt','Strength',0,1,.01],['flipPow','Falloff',.5,5,.05]]},
  {id:'base', name:'Base coat', note:'The colour layer. Metalness makes it tint its reflections instead of scattering light like plastic.',
   ctrls:[['base','Colour','color'],['metal','Metalness',0,1,.01],['rough','Roughness',.05,1,.01]]},
  {id:'light', name:'Lighting', note:'Paint is mostly reflection, so the environment does half the work. Long light strips and a horizon line are what sell a car’s shape.',
   ctrls:[['env','Environment','seg',['studio','sunset','overcast']],['envInt','Reflection strength',0,2.5,.01],['keyInt','Key light',0,8,.1],['dist','Camera distance',2.6,12,.1],['shape','Shape','seg',Object.keys(geos)],['spin','Auto-rotate','check']]}
];
const fmt = v => (Math.abs(v) >= 10 ? Math.round(v) : (+v).toFixed(2));
const refresh = [];
const host = $('#sections');
for (const sec of sections){
  const el = document.createElement('section'); el.id = 'sec-' + sec.id;
  el.innerHTML = `<div class="sec-head"><h2>${sec.name}</h2>${sec.toggle ? `<label class="switch"><input type="checkbox" aria-label="${sec.name} on"><span></span></label>` : ''}</div><p class="note">${sec.note}</p>`;
  if (sec.toggle){
    const cb = el.querySelector('.switch input');
    cb.onchange = () => { S[sec.toggle] = cb.checked; clearPreset(); apply(); };
    refresh.push(() => cb.checked = S[sec.toggle]);
  }
  for (const [k, label, a, b, step] of sec.ctrls){
    if (a === 'check'){
      const row = document.createElement('div'); row.className = 'check';
      row.innerHTML = `<span>${label}</span><label class="switch"><input type="checkbox" aria-label="${label}"><span></span></label>`;
      const cb = row.querySelector('input'); cb.onchange = () => { S[k] = cb.checked; apply(); };
      refresh.push(() => cb.checked = S[k]); el.append(row);
    } else if (a === 'seg'){
      const row = document.createElement('div'); row.className = 'seg'; row.setAttribute('role','group'); row.setAttribute('aria-label', label);
      for (const opt of b){
        const btn = document.createElement('button'); btn.textContent = opt[0].toUpperCase() + opt.slice(1);
        btn.onclick = () => { S[k] = opt; if (k === 'shape'){ mesh.geometry.dispose(); mesh.geometry = geos[opt](); } apply(); refreshAll(); };
        refresh.push(() => btn.setAttribute('aria-pressed', S[k] === opt)); row.append(btn);
      }
      el.append(row);
    } else if (a === 'color'){
      const row = document.createElement('div'); row.className = 'row';
      const id = 'in-' + k;
      row.innerHTML = `<label for="${id}">${label}</label><input type="color" id="${id}">`;
      const inp = row.querySelector('input'); inp.oninput = () => { S[k] = inp.value; clearPreset(); apply(); };
      refresh.push(() => inp.value = S[k]); el.append(row);
    } else {
      const row = document.createElement('div'); row.className = 'row';
      const id = 'in-' + k;
      row.innerHTML = `<label for="${id}">${label}</label><output for="${id}"></output><input type="range" id="${id}" min="${a}" max="${b}" step="${step}">`;
      const inp = row.querySelector('input'), out = row.querySelector('output');
      inp.oninput = () => { S[k] = +inp.value; out.textContent = fmt(S[k]); if (sec.id !== 'light') clearPreset(); apply(); };
      refresh.push(() => { inp.value = S[k]; out.textContent = fmt(S[k]); }); el.append(row);
    }
  }
  host.append(el);
}
function refreshAll(){ refresh.forEach(f => f()); }

const presetHost = $('#presets');
function clearPreset(){ presetHost.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', false)); }
for (const name of Object.keys(presets)){
  const b = document.createElement('button'); b.textContent = name; b.setAttribute('aria-pressed', name === 'Showroom blue');
  b.onclick = () => { Object.assign(S, presets[name]); clearPreset(); b.setAttribute('aria-pressed', true); apply(); refreshAll(); };
  presetHost.append(b);
}
document.querySelectorAll('[data-jump]').forEach(b => b.onclick = () => $('#sec-' + b.dataset.jump).scrollIntoView({behavior:'smooth', block:'start'}));

// ---------- interaction ----------
let yaw = .6, pitch = .25, dragging = false, lx = 0, ly = 0;
canvas.addEventListener('pointerdown', e => { dragging = true; lx = e.clientX; ly = e.clientY; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  yaw += (e.clientX - lx) * .008; pitch = THREE.MathUtils.clamp(pitch + (e.clientY - ly) * .008, -1.3, 1.3);
  lx = e.clientX; ly = e.clientY;
});
const end = () => dragging = false;
canvas.addEventListener('pointerup', end); canvas.addEventListener('pointercancel', end);

function resize(){
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);

const m4 = new THREE.Matrix4();
let last = performance.now();
function frame(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (S.spin && !dragging) yaw += dt * .35;
  mesh.rotation.set(pitch, yaw, 0);
  camera.position.set(0, .25, S.dist); camera.lookAt(0, 0, 0); camera.updateMatrixWorld();
  mesh.updateMatrixWorld();
  m4.multiplyMatrices(camera.matrixWorldInverse, mesh.matrixWorld);
  U.uNM.value.getNormalMatrix(m4);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
apply(); refreshAll(); resize(); requestAnimationFrame(frame);
})();
</script>
