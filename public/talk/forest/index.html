<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Magical Forest</title>
    <!-- Built from talk/forest/ (npm run build:forest). The artifact was written against Tailwind;
         these are the six classes it uses, by hand, so the page needs nothing from a CDN. -->
    <style>
      * { margin: 0; box-sizing: border-box; }
      body { background: #111827; font-family: system-ui, sans-serif; overflow: hidden; }
      .flex { display: flex; } .flex-col { flex-direction: column; }
      .items-center { align-items: center; } .justify-center { justify-content: center; }
      .min-h-screen { min-height: 100vh; } .bg-gray-900 { background: #111827; } .p-4 { padding: 16px; }
      .mb-4 { margin-bottom: 16px; } .mb-2 { margin-bottom: 8px; } .mt-2 { margin-top: 8px; }
      .text-white { color: #fff; } .text-center { text-align: center; }
      .text-3xl { font-size: 30px; line-height: 36px; } .font-bold { font-weight: 700; }
      .text-purple-300 { color: #d8b4fe; } .gap-6 { gap: 24px; } .text-xl { font-size: 20px; }
      .text-sm { font-size: 14px; } .text-gray-400 { color: #9ca3af; }
      .border-4 { border: 4px solid; } .border-purple-500 { border-color: #a855f7; }
      .rounded-lg { border-radius: 8px; } .shadow-2xl { box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); }
      /* Fit the 1000×500 canvas under its header at whatever size the slide gives it. */
      body #root canvas { width: min(100%, (100vh - 150px) * 2) !important; height: auto !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="forest.js"></script>
  </body>
</html>
